<title>칼빈 《기독교 강요》 연결 지도</title>
<style>
:root{--bg:#0b0f14;--line:#1d2836;--tx:#e8eef6;--tx2:#9fb0c4;--tx3:#6b7d92;--bord:#22303f;--acc:#f2c14e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
 font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,sans-serif;
 overscroll-behavior:none;-webkit-text-size-adjust:100%}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv.drag{cursor:grabbing}
header{position:fixed;top:0;left:0;right:0;z-index:20;

 padding:10px 14px 16px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
header>*{pointer-events:auto}
.toprow{display:flex;align-items:center;gap:10px}
.homebtn{flex:0 0 auto;align-self:center;display:inline-flex;align-items:center;justify-content:center;
 width:36px;height:36px;border-radius:50%;background:#b3261e;border:1px solid #e2504a;color:#fff;
 font-size:9.5px;font-weight:800;letter-spacing:.03em;line-height:1;text-decoration:none;
 box-shadow:0 2px 8px rgba(0,0,0,.45)}
.homebtn:hover{background:#d13a30;border-color:#f07c75}
.homebtn:focus-visible{outline:2px solid #f2dfb2;outline-offset:2px}
.brand{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;min-width:0}
.brand h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.brand .sub{font-size:11.5px;color:var(--tx3);line-height:1.45;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;flex:1 1 320px;min-width:0}
.brand .stat{margin-left:auto;font-size:11.5px;color:var(--tx2);font-variant-numeric:tabular-nums;white-space:nowrap}
#srcbar{position:fixed;left:0;right:0;bottom:0;z-index:15;pointer-events:none;text-align:center;
 background:linear-gradient(0deg,rgba(9,13,18,.97),rgba(9,13,18,.78) 62%,rgba(9,13,18,0));
 padding:16px 14px 6px;font-size:10.5px;line-height:1.5;color:#7e92a8;
 word-break:keep-all;overflow-wrap:anywhere}
#srcbar b{color:#a6b8cb;font-weight:600}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#q{flex:1 1 260px;min-width:140px;background:#0d151e;border:1px solid var(--bord);color:var(--tx);
 border-radius:10px;padding:9px 12px;font-size:14px;outline:none;font-family:inherit}
#q:focus{border-color:#3c5673;box-shadow:0 0 0 3px rgba(80,130,190,.15)}
.btn{background:#0d151e;border:1px solid var(--bord);color:var(--tx2);border-radius:9px;
 padding:8px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap;font-family:inherit}
.btn:hover{color:var(--tx);border-color:#38506a}
.btn.on{background:#1b2a3a;color:#dbe7f5;border-color:#3d5a78}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--bord);background:#0c141d;
 color:var(--tx2);border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer;white-space:nowrap;font-family:inherit}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.on{color:#fff;border-color:#4a6484;background:#16222f}
.chip.off{opacity:.4}
#results{position:fixed;top:112px;left:14px;width:min(430px,calc(100vw - 28px));max-height:52vh;overflow:auto;z-index:30;
 background:#0e1721;border:1px solid var(--bord);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.5);display:none}
#results.show{display:block}
#results .r{padding:9px 12px;border-bottom:1px solid #16212c;cursor:pointer}
#results .r:last-child{border-bottom:0}
#results .r:hover,#results .r.act{background:#15212e}
#results .r b{font-size:13px;font-weight:600;display:block}
#results .r span{display:block;font-size:11.5px;color:var(--tx3);margin-top:3px}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(460px,42vw);z-index:25;background:rgba(12,18,25,.985);
 border-left:1px solid var(--bord);transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column}
#panel.show{transform:none}
.ph{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid #16212c}
.ph h2{margin:0;font-size:16px;line-height:1.42;font-weight:700;flex:1;min-width:0}
#pClose{background:#0d151e;border:1px solid var(--bord);color:var(--tx2);border-radius:8px;width:30px;height:30px;
 font-size:15px;line-height:1;cursor:pointer;flex:0 0 auto;font-family:inherit}
#pBody{overflow:auto;padding:14px 16px 40px;font-size:13.5px;line-height:1.75;-webkit-overflow-scrolling:touch}
#pBody .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}

#pBody .tag.b{border-color:#3a5c86;color:#a9c8e8}
#pBody .tag.t{border-color:#6a5522;color:#e9cd84}
#pBody .one{background:#101a24;border-left:3px solid var(--acc);padding:9px 12px;border-radius:6px;margin:0 0 16px;color:#dfe8f2}
#pBody .sec{font-size:11.5px;letter-spacing:.4px;color:#8aa0b8;font-weight:700;margin:18px 0 8px;text-transform:none}
#pBody .core{color:#dbe6f2}
#pBody .core p{margin:0 0 9px}
#pBody ul{padding-left:0;margin:0;list-style:none}
#pBody ul li{position:relative;padding-left:12px;margin-bottom:8px;color:#cfdae6}
#pBody ul li:before{content:"";position:absolute;left:0;top:.66em;width:4px;height:4px;border-radius:50%;background:#3f5670}
#pBody ul li b{color:#eaf2fa;font-weight:600}
#pBody .lnk{display:block;width:100%;text-align:left;background:#0f1a24;border:1px solid #1e2d3d;color:#cfe0f0;
 border-radius:8px;padding:7px 10px;margin-bottom:6px;font-size:12.5px;line-height:1.5;cursor:pointer;font-family:inherit}
#pBody .lnk:hover{background:#15232f;border-color:#31506b;color:#eaf3fb}
#pBody .lnk small{display:block;color:#7e93a9;font-size:11px;margin-top:2px}
#pBody a.orig{display:inline-block;margin-top:6px;color:#8fc0ea;font-size:12.5px}
#load{position:fixed;inset:0;background:#0b0f14;z-index:40;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:14px;transition:opacity .4s}
#load .t{font-size:14px;color:#c9d7e5;font-weight:600}
#load .bar2{width:min(280px,70vw);height:4px;background:#16212c;border-radius:99px;overflow:hidden}
#load .bar2 i{display:block;height:100%;width:10%;background:var(--acc);transition:width .25s}
@media (max-width:760px){
 header{padding:8px 10px 12px;gap:6px}
 .homebtn{width:32px;height:32px;font-size:8.5px}

 .brand .sub{font-size:10.5px;flex-basis:100%;line-height:1.42}
 .brand .stat{font-size:10.5px}
 #srcbar{font-size:9.5px;padding:12px 10px 5px;line-height:1.45}
 #q{font-size:15px;padding:8px 10px}
 .btn{padding:7px 9px;font-size:12px}
 #panel{top:auto;left:0;right:0;bottom:0;width:100%;height:66vh;border-left:0;border-top:1px solid var(--bord);
  border-radius:16px 16px 0 0;transform:translateY(102%);box-shadow:0 -18px 40px rgba(0,0,0,.5)}
 #panel.show{transform:none}
 .ph{padding:12px 14px 8px}
 .ph h2{font-size:15px}
 #pBody{padding:12px 14px 40px;font-size:13.5px}
 #results{top:auto;bottom:8px;left:8px;right:8px;width:auto;max-height:46vh;border-radius:14px}
}
</style>

이신지 아는 데서 멈추지 않고, 그분께 합당한 영광과 예배를 돌리는 일까지 포함한다. 그래서 하나님을 아는 지식은 삶의 방식과 분리될 수 없고, 이 지식이 참되면 사람은 하나님을 경외하고 신뢰하며 그분의 뜻에 자기 삶을 맡긴다. 반대로 호기심으로 하나님을 탐구하며 삶을 바꾸지 않는 것은 참된 지식이 아니다. 이 장은 1권 전체, 나아가 전 책의 논지를 붙드는 정의다.","secs":[["1","창조주 하나님을 아는 지식의 정의 — 그 지식의 실체와 그것을 어떻게 써야 하는지. 하나님을 아는 지식은 그분의 속성에 대한 정보가 아니라 경외와 사랑과 신뢰다."],["2","그 지식의 효용에 대한 추가 설명과 함께, 헛된 호기심에 대한 책망과 에피쿠로스학파의 반박. 경건한 사람에게 하나님은 아버지로 나타나시고, 그 지식은 자녀의 신뢰를 낳는다."]],"vs":[["요 17:3","\"영생은 곧 유일하신 참 하나님과 그가 보내신 자 예수 그리스도를 아는 것이니이다\" — 지식과 생명의 결합."],["렘 9:24","\"나를 아는 것\"을 자랑하라 — 하나님을 아는 지식이 사람의 참된 자랑이다."],["잠 1:7","여호와를 경외하는 것이 지식의 근본이다."]],"hubs":["H01"],"rel":[["1-01","참 지혜의 두 부분 가운데 첫째 갈래."],["1-10","성경이 참 하나님을 이방 신들과 대조하며 그분의 속성을 그려 주는 곳."],["1-13","한 분 하나님 — 그 지식의 대상이신 삼위일체로 이어진다."]]},{"t":"c","id":"1-03","b":1,"n":3,"label":"하나님을 아는 지식이 사람의 마음에…","title":"하나님을 아는 지식이 사람의 마음에 본래부터 심어져 있다","one":"모든 사람의 마음에는 하나님을 아는 씨앗이 있고, 양심이 그 증인이다.","core":"칼빈은 하나님을 아는 지식이 학교에서 배우는 것이 아니라 사람의 본성에 새겨진 것이라고 말한다. 어떤 민족도 신 없이 살지 않았고, 우상숭배가 존재한다는 사실 자체가 사람 마음에 신을 아는 감각이 있음을 보여 준다. 종교는 권력자들이 백성을 다스리려고 꾸며 낸 발명품이 아니며, 악한 사람들이 하나님에 대한 두려움을 지우려 애쓰는 모습은 오히려 그 두려움이 마음 깊이 자리하고 있음을 드러낸다. 이 본래적 지식은 구원에 이르지 못하지만, 사람을 핑계할 수 없게 만든다.","secs":[["1","하나님을 아는 지식이 모든 사람에게 드러나 있으므로 버림받은 자도 핑계할 수 없다. 하나님의 존재에 대한 보편적 믿음과 고백."],["2","종교와 신에 대한 믿음이 간교한 정치가들의 발명이라는 반론을 반박하고, 보편적 믿음을 역사의 예로 확증한다."],["3","악한 사람들이 마음에서 하나님에 대한 두려움을 모두 몰아내려 애쓰는 모습으로도 확증된다. 결론적으로 하나님을 아는 지식은 사람의 마음에 본래부터 심어져 있다."]],"vs":[["롬 1:19","\"이는 하나님을 알 만한 것이 그들 속에 보임이라\" — 본성에 새겨진 지식."],["행 17:27-28","이방인도 하나님을 더듬어 찾을 수 있게 하셨다 — 일반 계시의 흔적."],["시 14:1","\"어리석은 자는 그 마음에 이르기를 하나님이 없다 하도다\" — 부정하려는 마음의 몸부림."]],"hubs":["H01","H05"],"rel":[["1-04","이 본래적 지식이 무지와 악으로 억눌리고 부패하는 과정."],["1-05","창조가 하나님을 아는 지식을 얼마나 선명하게 드러내는지."],["1-06","그래서 성경이 안내자로 필요하다는 결론."]]},{"t":"c","id":"1-04","b":1,"n":4,"label":"하나님을 아는 지식이 무지와 악으로…","title":"하나님을 아는 지식이 무지와 악으로 억눌리고 부패한다","one":"사람은 하나님을 알 만한 것을 알면서도 그 진리를 불의로 억누르고, 우상을 세운다.","core":"하나님을 아는 씨앗은 모든 사람에게 있지만, 그것이 바른 지식으로 자라지 못한다. 어떤 이는 무지로 미신에 빠지고, 어떤 이는 알면서도 진리를 짓밟는다. 칼빈은 이 부패가 단순한 착오가 아니라 교만과 완고함에서 온다고 본다. 사람은 하나님을 알면서도 그분 앞에 서기를 싫어하므로, 자기에게 편한 신을 만들어 두고 참 하나님의 자리에 앉힌다. 그러므로 이방인의 우상숭배와 오늘의 무관심은 같은 뿌리를 가진다 — 진리를 억누르는 마음이다.","secs":[["1","하나님을 아는 지식이 무지로 억눌려 많은 사람이 미신으로 떨어진다. 그러나 그 오류에는 교만이 함께 있으므로 그들은 핑계할 수 없다."],["2","불경건의 동반자는 완고함이다 — 알면서도 고치지 않는다."],["3","어떤 구실도 미신을 정당화하지 못한다. 이는 이성으로도, 성경으로도 증명된다."],["4","악한 사람은 결코 기꺼이 하나님 앞에 나오지 않는다. 그래서 위선이 생기고, 신에 대한 감각이 선한 열매를 맺지 못한다."]],"vs":[["롬 1:18","\"진리를 불의로 진압하는 자들의 모든 경건하지 않음과 불의에 대하여\" 하나님의 진노가 나타난다."],["롬 1:21-23","하나님을 알되 영화롭게도 감사하지 아니하고 썩어지지 않는 하나님의 영광을 우상으로 바꾸었다."],["시 36:1","악인의 죄가 그의 마음속에 이르기를 \"내 눈 앞에는 하나님을 두려워함이 없다\" 한다."]],"hubs":["H01","H05"],"rel":[["1-03","억눌린 지식의 원천 — 마음에 심어져 있는 씨앗."],["1-11","이 억누름이 제도가 되어 나타난 것이 우상과 형상이다."],["1-16","섭리를 부정하는 마음도 같은 뿌리에서 나온다."]]},{"t":"c","id":"1-05","b":1,"n":5,"label":"하나님을 아는 지식이 창조와 세상의…","title":"하나님을 아는 지식이 창조와 세상의 통치에서 두드러진다","one":"하늘과 땅은 하나님의 지혜와 선하심이 펼쳐진 극장이며, 사람은 그 극장의 관객이다.","core":"하나님은 보이지 않으시지만 그분의 솜씨는 만물에 선명하게 새겨져 있다. 칼빈은 우주의 질서와 사람 몸의 놀라운 구조를 하나님의 지혜가 드러나는 무대로 그린다. 사람의 몸과 영혼, 영혼의 탁월한 능력은 창조주가 누구신지 보여 주는 표지다. 그러나 이렇게 밝은 계시 앞에서도 사람은 하나님을 영화롭게 하지 못하고, 오히려 자연을 신으로 만들거나 운명에 맡긴다. 그러므로 창조 계시는 충분히 분명하지만, 우리 편의 어리석음 때문에 성경의 안내가 필요한 것이다.","secs":[["1-3","보이지 않고 헤아릴 수 없는 하나님의 본질이 그분의 일하심 안에서 어느 정도 보이게 된다 — 하늘과 땅의 놀라운 운동, 사람 몸의 대칭과 지체들의 결합이 그것을 선포한다. 특히 사람 몸의 구조가 하나님을 가장 가까이 보여 준다."],["4-5","이렇게 여러 방식으로 우리 안에 나타나신 하나님을 돌아보지 않는 뻔뻔한 배은망덕을 꾸짖는다. 영혼의 능력과 작용은 영혼이 몸과 구별된 실체이며 죽지 않는다는 증거다."],["6-8","첫째 부류의 일들 — 자연의 질서 안에 있는 것들 — 에서 하나님의 전능과 영원과 선하심을 배울 수 있고, 둘째 부류의 일들 — 자연의 통상 과정을 넘어서는 일들 — 은 하나님의 선하심과 공의와 자비를 더 밝히 보여 준다. 여기에 섭리와 능력과 지혜가 더해진다."],["9-10","하나님의 위엄에 대한 증거들과 그 증거의 쓰임 — 참 경건과 결합된 신 지식. 하나님을 아는 지식은 의로운 사람에게 장래 생명의 소망을 일으키고, 악한 사람에게는 남은 형벌을 기억하게 한다."],["11-13","학식 있는 자와 없는 자 모두가 창조의 질서를 하나님께 돌리지 않고 미신과 다신교로 떨어졌다. 철학자들의 하나님에 대한 의견도 끝없이 갈렸다. 모든 사람이 관습을 따르거나 오래된 관행에 동의함으로 참 종교를 부패시켰다."],["14-15","창조의 놀라운 영광 안에서도 우리는 자기 길을 그치지 않는다. 그러므로 우리의 무딤은 남의 탓이 아니라 우리 자신의 탓이며, 우리에게는 아무 핑계가 없다."]],"vs":[["시 19:1","\"하늘이 하나님의 영광을 선포하고 궁창이 그의 손으로 하신 일을 나타내는도다.\""],["롬 1:20","만물에 하나님의 영원하신 능력과 신성이 분명히 보인다."],["시 139:14","\"내가 주께 감사하옴은 나를 지으심이 심히 기묘하심이라\" — 사람 몸의 구조가 창조주의 솜씨를 보여 준다."],["행 14:17","하나님은 선을 행하시며 비와 결실하는 때를 주어 자신을 증언하신다."]],"hubs":["H04","H01"],"rel":[["1-03","본래적 지식이 왜 바른 지식이 되지 못하는지."],["1-06","자연 계시의 한계와 성경의 필요."],["1-14","창조 기사가 이 하나님을 어떤 표지로 구별하는지."]]},{"t":"c","id":"1-06","b":1,"n":6,"label":"하나님께 나아가려면 성경이 안내자와…","title":"하나님께 나아가려면 성경이 안내자와 스승이 되어야 한다","one":"자연 계시는 필요하지만 충분하지 않아, 하나님은 당신의 말씀을 기록으로 주셨다.","core":"창조의 극장은 하나님을 넉넉히 보여 주지만, 우리의 눈이 어두워 그것만으로는 창조주께 바른 지식으로 나아가지 못한다. 그래서 하나님은 선택하신 백성에게 더 나은 도움을 주셨다 — 당신의 말씀이다. 칼빈은 말씀의 계시가 족장들의 예언과 환상에서 시작해 율법의 반포와 선지자의 설교로 이어졌다고 정리한다. 성경은 하나님을 아는 지식의 유일한 참된 교과서이며, 우리 본성의 부패가 이 안내를 반드시 필요하게 만든다. 이 장에서 신학의 두 원천(창조와 성경)이 하나로 이어진다.","secs":[["1","하나님은 선택하신 자들에게 자신을 아는 더 나은 도움을 주셨다 — 곧 성경이다. 이는 처음부터 그러하셨다."],["2","첫째로 예언과 환상과 족장들의 사역으로, 둘째로 율법의 반포와 선지자의 설교로 주셨다."],["3","우리 본성의 부패 때문에 하나님을 알려는 사람은 누구든 말씀으로 돌아가야 한다. 시편과 선지서의 여러 구절이 이를 확증한다."],["4","시편의 직접적인 말씀과 그리스도의 말씀으로 확증한다. 결론 — 창조에 비치는 빛은 우리를 하나님께로 이끌 만큼 충분하지 않으므로, 말씀이 등불이 되어야 한다."]],"vs":[["시 119:105","\"주의 말씀은 내 발에 등이요 내 길에 빛이니이다.\""],["딤후 3:16","\"모든 성경은 하나님의 감동으로 된 것으로\" — 말씀의 기원과 유익."],["벧후 1:19","\"우리에게 더 확실한 예언이 있어 어두운 데에 비치는 등불과 같으니\""],["요 5:39","성경이 그리스도를 증언한다 — 말씀의 중심."]],"hubs":["H02"],"rel":[["1-05","자연 계시가 보여 주는 것과 그 한계."],["1-07","성경의 권위가 어디에 근거하는지."],["1-08","성경의 신뢰성을 사람의 이성 앞에서도 변증한다."]]},{"t":"c","id":"1-07","b":1,"n":7,"label":"성경의 권위는 교회의 승인이 아니라…","title":"성경의 권위는 교회의 승인이 아니라 성령의 증거에 있다","one":"성경이 하나님의 말씀인 것은 성령의 내적 증거로 확정되며, 교회가 승인해서 되는 것이 아니다.","core":"로마 가톨릭은 성경의 권위가 교회의 결정에 달려 있다고 가르쳤다. 칼빈은 이 가르침이 하나님의 진리를 사람의 의지에 매단다고 반박한다. 성경의 권위는 성경을 말하신 하나님이 누구신지에서 나오며, 그 확신은 성령이 성도들의 마음에 주시는 내적 증거로 생긴다. 교회는 성경을 낳은 어머니가 아니라 성경이 낳은 딸이며, 성경을 알아보는 증인일 뿐이다. 이 장은 개혁파 성경론의 핵심 문장으로, 성경의 자기 증거와 성령의 조명을 함께 세운다.","secs":[["1","성경의 권위는 사람이 아니라 하나님의 성령에게서 온다. 성경의 권위가 교회의 판단에 달렸다는 반론을 반박한다 — 그렇게 하면 하나님의 진리가 사람의 의지에 예속되고, 성령을 모욕하며, 교회에 폭정을 세우고, 오류를 쌓고, 양심을 무너뜨리며, 신앙을 불경한 자들의 조롱거리로 만든다."],["2","바울의 말에서 끌어낸 반론에 대한 답변과, 반대자들이 제기한 난점들의 해결. 두 번째 반론도 논파된다."],["3","아우구스티누스의 한 말에 근거한 세 번째 반론을 검토한다."],["4","결론 — 성경의 권위는 그것이 하나님의 말씀이라는 사실에 근거한다. 이는 경건한 자들의 양심과 조금이라도 성실한 모든 사람의 동의로 확증된다."],["5","마지막 결론 — 성경의 권위는 성령의 증거로 성도들의 마음에 인쳐진다. 그 증거의 확실함과, 이사야의 말씀 및 성도들의 경험에서 오는 확증."]],"vs":[["엡 2:20","교회는 사도와 선지자의 터 위에 세워졌다 — 교회가 성경보다 앞서지 않는다."],["요 10:27","\"내 양은 내 음성을 들으며\" — 양이 목자의 음성을 알아보는 것은 성령의 일이다."],["고전 2:14","육에 속한 사람은 하나님의 성령의 일을 받지 못한다 — 성령의 조명이 필요하다."],["사 55:11","하나님의 말씀은 그 목적을 이루지 않고는 헛되이 돌아오지 않는다."]],"hubs":["H02","H12"],"rel":[["1-06","왜 말씀이 필요한지에 이어지는 권위의 문제."],["1-08","성경의 신뢰성을 이성적으로도 변증한다."],["1-09","성령과 성경을 갈라놓는 열광주의에 대한 반박."],["1-09","이 원칙이 4권 9장 공의회 권위 논쟁에서 다시 쓰인다."]]},{"t":"c","id":"1-08","b":1,"n":8,"label":"성경의 신뢰성을 확증하는 이유가…","title":"성경의 신뢰성을 확증하는 이유가 이성 앞에서도 충분하다","one":"성경은 그 자체의 위엄과 예언의 성취와 순교의 역사로도 신뢰할 만하지만, 확신의 근거는 성령이다.","core":"성경의 권위는 성령의 증거에서 온다고 말한 뒤, 칼빈은 그것이 이성을 무시하는 비합리적 주장이 아님을 보인다. 성경은 그 자체의 장엄함, 모세의 고대성과 기적, 선지자들의 놀라운 예언과 성취, 복음서 기자들의 단순하면서도 숭고한 조화, 그리고 순교자들의 견딤으로도 충분히 신뢰할 만하다. 그러나 이런 보조적 증거들은 성령이 마음에 확신을 주신 뒤에야 제 역할을 한다. 이 장은 변증과 신앙의 순서를 함께 붙드는 모범이다.","secs":[["1-2","성경의 신뢰성을 세우는 보조적 도움들 — 성경의 배열, 그 위엄, 진리, 단순함, 효력. 선지자들의 글에 두드러진 장엄함."],["3-6","구약에서 오는 증거 — 모세 오경의 고대성과 위엄, 모세의 기적과 예언, 그리고 이에 대한 불경한 반론들의 논파."],["7-8","모세가 예언한 유다의 홀과 이방인의 부르심, 다른 선지자들의 예언 — 예루살렘의 멸망, 바벨론 포로에서의 귀환, 선지자들의 조화, 다니엘의 유명한 예언."],["9-10","모세와 선지자들에 대한 반론과 답변. 성경이 보존된 하나님의 놀라운 섭리, 칠십인역, 유대인들의 성경 필사에 대한 정성."],["11-12","신약에서 오는 증거 — 복음서 기자들의 조화와 숭고한 단순함, 요한과 바울과 베드로의 위엄, 교회사의 증거 — 교회가 진리를 받고 보존한 지속적인 동의, 진리 자체의 불가항력적 능력, 여러 증인들의 일치."],["13","순교자들의 일관된 견딤. 결론 — 이 모든 증거는 성령으로 성경의 확실성이 마음에 세워진 뒤에야 유익하다."]],"vs":[["사 46:9-10","\"처음부터 마지막 일을, 아직 되어 보지 못한 일을 이른다\" — 예언의 신적 기원."],["요 14:26","성령이 모든 것을 가르치고 예수께서 말씀하신 것을 생각나게 하신다."],["히 11:1","믿음은 바라는 것들의 실상이요 보이지 않는 것들의 증거다."],["마 24:35","\"천지는 없어지겠으나 내 말은 없어지지 아니하리라.\""]],"hubs":["H02","H12"],"rel":[["1-07","권위의 근거 — 성령의 증거."],["1-09","성령과 성경을 대립시키는 자들에 대한 반박."],["1-06","말씀의 필요성."]]},{"t":"c","id":"1-09","b":1,"n":9,"label":"성경을 떠나 환상을 따라서는 경건의…","title":"성경을 떠나 환상을 따라서는 경건의 모든 근본이 무너진다","one":"성령과 기록된 말씀을 갈라놓는 열광주의자는 성경의 모든 근거를 뽑아 버린다.","core":"칼빈은 성령을 말하면서 성경을 떠난다고 주장하는 이들, 즉 당시 '영적인 사람'이라 자처하던 자유주의자들을 겨냥한다. 그들은 사도들도 성경의 문자에 매이지 않았다고 말하지만, 사도들이 가르친 것은 바로 그 말씀이다. 사탄은 성경으로 무장하지 않은 사람을 쉽게 속일 수 있다. 칼빈이 특히 문제 삼는 것은 바울이 말한 '문자와 영'의 대비다 — 바울이 영을 문자에서 떼어낸 것이 아니라, 성령의 감동 없는 문자가 죽음이라는 점을 말한 것이다. 성령과 말씀은 서로 떨어질 수 없다.","secs":[["1","자유주의자(리버틴)들의 성격과 오류를 간단히 설명하고 논박한다 — 사도들과 모든 참 그리스도인은 성경의 말씀을 붙들었다."],["2","논박 계속 — 기록된 말씀의 도움 없이는 사탄의 속임수를 분별할 수 없다. 첫 번째 반론에 대한 답변."],["3","바울이 말한 '문자와 영'에 대한 두 번째 반론과 그 답변, 바울의 뜻에 대한 설명. 영은 말씀과 분리되지 않는다."]],"vs":[["사 59:21","\"너의 입에 두는 내 말과 네 자손의 입에 둔 내 말이 떠나지 아니하리라\""],["요 6:63","\"살리는 것은 영이니 육은 무익하니라\" — 이 말이 성경을 무가치하게 만들지 않는다."],["행 17:11","베뢰아 사람들이 날마다 성경을 상고한 것 — 참된 영적 분별의 본."],["고후 3:6","\"의문은 죽이는 것이요 영은 살리는 것\" — 영과 문자를 대립시키는 구절이 아니다."]],"hubs":["H02","H12"],"rel":[["1-07","성령의 증거로 성경의 권위가 선다는 주장."],["1-08","성경의 신뢰성."],["3-01","성령의 사역이 우리에게 적용되는 방식으로 이어진다."]]},{"t":"c","id":"1-10","b":1,"n":10,"label":"성경은 참 하나님을 이방의 모든…","title":"성경은 참 하나님을 이방의 모든 신과 배타적으로 대조한다","one":"성경이 가리키는 하나님은 창조의 일하심이 보여 준 그 하나님이시며, 그분이 우리의 하나님이 되신다.","core":"칼빈은 성경이 하나님을 아는 지식의 유일한 기준임을 확인한 뒤, 성경이 어떤 하나님을 가르치는지 묻는다. 성경의 하나님은 자연 계시가 증언하는 그 창조주와 동일하시며, 신실하시고 자비하시고 공의로우신 분이다. 이방인들도 신의 통일에 대한 어렴풋한 개념은 가졌지만, 성경은 참 하나님을 모든 신들과 배타적으로 대조하고 그분에게만 통치와 영광을 돌린다. 하나님의 속성은 추상적 목록이 아니라 그분이 자기 백성과 맺은 관계 가운데 드러난다.","secs":[["1","하나님을 아는 지식에 대한 설명을 다시 잇는다. 성경에 나타나신 하나님은 그분의 일하심에 묘사된 그 하나님이시다."],["2","모세와 다윗과 예레미야가 기술한 하나님의 속성, 그 속성에 대한 해설과 요약, 그리고 이 지식의 쓰임."],["3","우리를 참 하나님께로 인도하면서 성경은 이방의 모든 신을 배제한다 — 이방인들이 어느 정도 하나님의 통일을 붙들었음에도 그러하다."]],"vs":[["출 3:14","\"나는 스스로 있는 자이니라\" — 하나님의 이름."],["출 34:6-7","여호와는 자비롭고 은혜롭고 노하기를 더디하고 인자와 진실이 많은 하나님이다."],["시 103:8","여호와는 자비롭고 은혜로우며 노하기를 더디하고 인자가 많으시다."],["렘 9:23-24","\"나를 아는 것\"이 참된 자랑 — 하나님의 속성을 아는 지식의 결론."]],"hubs":["H01","H03"],"rel":[["1-02","하나님을 아는 지식의 정의."],["1-05","창조가 드러낸 하나님과 같은 하나님."],["1-12","이 하나님만 예배의 대상이 되신다는 논의."]]},{"t":"c","id":"1-11","b":1,"n":11,"label":"하나님께 가시적 모습을 돌리는 것은…","title":"하나님께 가시적 모습을 돌리는 것은 불경건이며, 우상은 하나님을 견디지 못한다","one":"하나님은 영이시므로 어떤 형상으로도 표현될 수 없고, 형상을 세우는 일은 참 하나님께서 떠나는 일이다.","core":"제2계명은 어떤 형상도 만들어 그것을 하나님으로 섬기지 말라고 명한다. 칼빈은 이 계명을 단지 조각된 우상을 금하는 규정이 아니라 하나님은 영이시라는 신학적 진리로 뽑아낸다. 보이지 않는 하나님을 눈에 보이는 것으로 대신하는 순간 사람은 자기가 만든 신을 섬기게 된다. 칼빈은 이어서 형상의 기원과 발전, 형상을 예배하는 행위의 성격, 화상을 '무식한 자들의 책'이라 부르는 변명, 성상 숭배를 인정한 제2차 니케아 공의회의 논변을 차례로 검토하며 형상 예배를 통렬히 비판한다.","secs":[["1-3","하나님은 우상과 반대되시며 그분 자신에 대하여 참된 증인이 되신다 — 그분을 몸의 모양으로 나타내려는 모든 시도를 분명히 금하신다. 모세·이사야·바울이 그 이유를 밝히고, 그룹과 스랍의 예도 형상의 정당화가 되지 못한다."],["4","우상의 재료 자체가 우상숭배자들의 이야기를 반박한다 — 사람이 만든 것이 어떻게 신이 되겠는가."],["5-7","'형상은 무식한 자들의 책'이라는 변명에 답한다 — 성경은 형상이 헛되고 거짓을 가르친다고 말하며, 고대 신학자들도 형상의 제작과 숭배를 정죄했다. 성당의 사치스러운 장식은 형상의 쓰임을 드러낸다."],["8-11","우상과 형상의 기원 — 홍수 직후에 시작되어 계속 자라 남았다. 형상 숭배의 성격과 변명들, 로마 가톨릭의 회피, 그리고 '둘리아'와 '라트리아'를 구별하는 변명에 대한 반박."],["12-16","형상의 사용과 남용, 그리스도인의 예배당에 형상을 두는 것이 유익한지의 문제, 제2차 니케아 공의회의 궤변, 형상 숭배를 지지하려 동원한 구절들, 그리고 고대 우상숭배자들의 신성모독적 표현을 근대의 많은 이들이 승인한 일."]],"vs":[["출 20:4-5","\"너를 위하여 새긴 우상을 만들지 말고\" — 제2계명."],["요 4:24","\"하나님은 영이시니 예배하는 자가 영과 진리로 예배할지니라.\""],["신 4:15-16","여호와께서 말씀하시던 날 너희가 아무 형상도 보지 못하였으므로 스스로 부패하여 우상을 만들지 말라."],["사 44:9-10","우상을 만드는 자는 다 허망하니 자기가 좋아하는 것을 위하여 만들 뿐이다."],["롬 1:23","썩어지지 아니하는 하나님의 영광을 바꾸어 우상의 형상과 같게 하였다."]],"hubs":["H01","H07"],"rel":[["1-12","형상을 버린 뒤 남는 문제 — 하나님만 예배의 대상이시라는 논의."],["1-04","우상숭배의 마음 뿌리."],["2-08","제2계명의 자세한 해설(도덕법)."]]},{"t":"c","id":"1-12","b":1,"n":12,"label":"하나님을 우상과 구별하여 그분만…","title":"하나님을 우상과 구별하여 그분만 유일한 예배의 대상으로 모셔야 한다","one":"참 하나님은 우상과 구별되어야 하며, 오직 그분에게만 종교적 예배가 돌려져야 한다.","core":"하나님을 아는 지식은 결국 누구에게 예배를 드리는가의 문제로 귀결된다. 칼빈은 성경이 하나님은 한 분이라고 가르칠 때 단어 논쟁을 하시는 것이 아니라 모든 영광과 종교적 예배를 오직 그분께 돌리신다고 설명한다. 그래서 성인이나 천사에게 기도하고 그들을 중보자로 부르는 관행은 하나님이 정하신 예배 질서를 어긴다. 이 장은 1권의 예배론적 결론이며, 4권의 성인 숭배·유물 숭배 비판으로 이어지는 뿌리다.","secs":[["1","성경은 하나님이 한 분이심을 가르칠 때 말시비를 하지 않고 모든 영광과 종교적 예배를 오직 그분께 돌리신다."],["2","이 순수한 교리에 반대하는 로마 가톨릭은 '둘리아'와 '라트리아'의 구별로 아무것도 얻지 못한다."],["3","그 구별을 무너뜨리는 성경 구절들 — 종교적 예배는 오직 하나님께만 돌려져야 한다. 하나님께 대한 예배가 여러 갈래로 왜곡된 예들."]],"vs":[["마 4:10","\"주 너의 하나님께 경배하고 다만 그를 섬기라.\""],["계 19:10","천사가 요한에게 \"경배하지 말라\" 하며 오직 하나님께 경배하라 한다."],["출 20:3","\"너는 나 외에는 다른 신들을 네게 두지 말라.\""],["고전 8:6","\"우리에게는 한 하나님 곧 아버지가 계시고 한 주 곧 예수 그리스도가 계시니라.\""]],"hubs":["H01","H07"],"rel":[["1-11","형상 숭배 비판에서 이어지는 예배의 대상 문제."],["1-13","예배의 대상이신 한 하나님 — 삼위일체."],["4-17","성인과 성물 숭배 비판으로 이어지는 논지"]]},{"t":"c","id":"1-13","b":1,"n":13,"label":"성경은 한 신적 본질이 세 위격…","title":"성경은 한 신적 본질이 세 위격 안에 계심을 가르친다","one":"하나님은 한 본질이시며 영원히 세 위격 — 아버지와 아들과 성령 — 으로 계신다.","core":"칼빈은 삼위일체를 신학의 사변적 주제가 아니라 성경이 처음부터 가르친 진리로 제시한다. 하나님은 한 분이시며 그 본질은 나뉘지 않고, 그 한 본질 안에 아버지와 아들과 성령 세 위격이 영원히 계신다. '위격'이라는 말은 성경의 언어는 아니지만, 성경의 진리를 지키기 위해 교회가 정당하게 사용해 온 용어다. 칼빈은 아들의 영원한 신성, 성령의 신성을 성경으로 증명하고, 아리우스파·마케도니아파·세르베투스 같은 반삼위일체 오류를 조목조목 논박한다. 동시에 삼위일체를 설명하려는 인간의 유추를 경계한다.","secs":[["1-2","성경은 하나님의 본질이 무한하고 영적임을 가르쳐 우상숭배자와 세상의 지혜뿐 아니라 마니교도와 신인동형론자도 반박한다. 이 한 본질 안에 세 위격이 계시며, 그래서 세 하나님이 되지도 않고 본질이 나뉘지도 않는다. '위격'이라는 말의 의미와 세 위격의 구별이 설명된다."],["3-5","'위격'이라는 용어를 거부하는 이들의 반론과 세 가지 답변 — 그 용어는 외래어가 아니라 거룩한 신비를 설명하기 위해 쓰인 것이며, 정통 신학자들은 삼위·자존·위격이라는 말을 쓸 수밖에 없었다. 고대 교회는 용어 설명에서 다소 달랐으나 실체에서 일치했다는 증거(힐라리, 예로니모, 아우구스티누스)."],["6","용어의 정의에 이어 그 의미하는 바의 정의와 설명 — 위격들의 구별."],["7-13","아들의 영원한 신성에 대한 증거 — 아들은 아버지의 로고스(말씀)이시므로 영원하신 하나님이시다. '창조하실 때 말씀이 시작되었다'는 반론, 아들이 하나님과 여호와로 불린 사실, 구약에서 족장들에게 나타난 여호와의 사자, 신약에서 아들이 만군의 여호와·심판자·영광의 하나님·창조주로 고백되는 구절들, 그리고 그리스도께서 자신의 능력으로 기적을 행하신 사실."],["14-15","성령의 신성 증명 — 성령은 세상의 창조자요 보존자이시며, 선지자들을 보내셨고, 모든 것을 살리시며, 어디에나 계신다. 성령이 하나님이라 불리시고, 성령을 훼방하는 죄가 용서되지 않는다."],["16-20","삼위일체에 대한 견해 — 그리스도인의 세례의 형식이 한 본질 안에 세 위격이 계심을 증명한다. 위격들의 구별 — 구별되지만 나뉘지 않는다. 인간사에서 가져온 유추는 조심스럽게 써야 한다. 세 위격은 하나님의 완전한 통일을 파괴하지 않고 오히려 이루신다. 이 부분의 결론과 참된 교리의 요약."],["21-29","아리우스파·마케도니아파·반삼위일체 오류들의 논박과 주의할 점. 세르베투스와 근대의 다른 반삼위일체론자들의 논박. '하나님의 아들'로 불리심이 곧 하나님이심을 부정하는 좋은 반론이 되지 못하는 이유. 이레네우스와 터툴리안의 구절들에 대한 답변, 고대 저술가들(유스티누스, 힐라리)의 증언과 결론."]],"vs":[["마 28:19","\"아버지와 아들과 성령의 이름으로 세례를 베풀며\" — 삼위의 이름."],["요 1:1","\"태초에 말씀이 계시니라 이 말씀이 하나님과 함께 계셨으니 이 말씀은 곧 하나님이시니라.\""],["요 8:58","\"아브라함이 나기 전부터 내가 있느니라\" — 아들의 영원한 선재."],["행 5:3-4","성령을 속인 것이 하나님께 속인 것이라 — 성령의 신성."],["고후 13:13","\"예수 그리스도의 은혜와 하나님의 사랑과 성령의 교통하심이 너희 무리와 함께 있을지어다.\""],["요 10:30","\"나와 아버지는 하나이니라.\""]],"hubs":["H03"],"rel":[["1-10","참 하나님을 아는 지식."],["1-12","예배의 대상이 한 분 하나님이심."],["2-14","그리스도의 두 성품 — 위격 논의의 연장."]]},{"t":"c","id":"1-14","b":1,"n":14,"label":"세상과 그 모든 것의 창조에서 참…","title":"세상과 그 모든 것의 창조에서 참 하나님이 거짓 신들과 구별된다","one":"창조 기사와 천사의 세계는 하나님이 누구신지 구별해 주는 표지이며, 그 창조는 우리의 유익을 위함이다.","core":"이방인도 세상이 지어졌다는 사실은 알았지만, 그것을 참 하나님께 돌리지 못했다. 그래서 하나님은 창조의 역사를 기록으로 주셔서 우리가 거짓 신화에 빠지지 않게 하셨다. 칼빈은 세상이 여섯 날에 창조되었다는 순서 자체가 하나님의 지혜와 선하심을 드러낸다고 본다. 이 장의 큰 부분은 천사의 교리에 할애된다 — 천사는 하나님의 사자이며 택하신 자를 지키는 사역자이고, 마귀는 창조된 본성 자체가 아니라 부패한 천사다. 마귀도 하나님의 허락 없이는 아무것도 하지 못한다.","secs":[["1-2","창조의 사실만으로도 하나님을 알아야 하지만, 우리가 이방의 허구로 떨어지지 않도록 하나님은 창조의 역사를 주셨다. 세상이 한순간이 아니라 여섯 날에 창조된 것도 같은 이유이며, 창조의 순서는 아담이 만물이 갖추어진 뒤에 지어졌음을 보여 준다."],["3-9","천사에 대한 교리 — 천사에게서도 하나님을 배우고, 우상숭배자들의 오류를 경계한다. 천사는 하나님께 지어졌으나 그 시기와 질서를 캐묻는 것은 유익하지 않다. 천사의 본성·직무·여러 이름, 천사가 하나님의 선하심을 나누어 주는 사자라는 점, 왕국과 지역을 맡은 자들과 택한 자의 수호자, 천사의 수와 서열·날개에 대한 설명, 천사가 섬기는 영이요 영적 실체라는 점."],["10-12","천사를 하나님의 보좌에 앉힌 이방의 오류를 성경으로 반박하고, 하나님께서 천사의 사역을 쓰시는 이유를 밝힌다. 성경의 천사 교리가 우리에게 주는 유익."],["13-19","악한 천사(마귀)에 대한 교리 — 마귀의 간계와 공격을 경계하고 경건을 자극하도록. 마귀는 사람의 원수이므로 우리는 끊임없이 싸워야 한다. 마귀의 사악함은 창조 때문이 아니고 부패 때문이며, 천사 타락의 방식과 시기를 캐묻는 것은 헛되다. 마귀는 뜻과 행동에서 늘 하나님의 뜻을 거스르지만 허락 없이는 아무것도 하지 못한다. 하나님은 악한 영들이 성도를 시험하고 악인을 다스리도록 허용하신다. 악한 천사의 본성 — 감각과 지성을 지닌 영적 실체."],["20-22","창조 역사의 나머지 부분을 간략히 다루며, 하나님에 관하여 우리가 알아야 할 것이 무엇인지 밝힌다. 이 지식의 특별한 목적은 배은망덕이나 무심함으로 하나님의 완전하심을 지나치지 않게 하는 것이며, 만물이 우리의 유익을 위해 지어졌음을 깨달아 하나님을 신뢰하고 기도하고 사랑하게 하는 것이다."]],"vs":[["창 1:1","\"태초에 하나님이 천지를 창조하시니라.\""],["시 33:6","\"여호와의 말씀으로 하늘이 지어지고 그 만상은 그의 입 기운으로 이루어졌도다.\""],["골 1:16","만물이 그리스도 안에서 창조되었고 그를 위하여 창조되었다."],["히 1:14","천사들은 구원 얻을 후사들을 섬기려고 보내심을 받은 영이 아니냐."],["벧전 5:8","마귀는 우는 사자 같이 두루 다니며 삼킬 자를 찾는다."],["욥 1:12","마귀가 욥을 해하려 하였으나 하나님의 허락 밖에서 아무것도 하지 못했다."]],"hubs":["H04","H03"],"rel":[["1-05","창조가 드러내는 하나님의 지혜."],["1-15","창조의 정점인 사람."],["1-16","창조 뒤에도 계속되는 하나님의 보존과 통치."]]},{"t":"c","id":"1-15","b":1,"n":15,"label":"사람이 창조된 상태와 영혼의 기능…","title":"사람이 창조된 상태와 영혼의 기능, 하나님의 형상과 원래의 자유의지","one":"사람은 하나님의 형상대로 지어졌고, 그 형상은 영혼의 지성과 의지에 새겨진 원래의 의와 거룩함이다.","core":"칼빈은 타락 후의 사람을 논하기 전에 창조된 사람의 원래 모습을 그린다. 사람은 하나님의 형상대로 지어졌으며, 그 형상은 몸의 모양이 아니라 영혼에 새겨진 것이다. 형상의 내용은 지성의 진리와 의지의 의로움, 곧 원래의 의와 거룩함이다. 영혼은 죽지 않는 실체이며, 지성과 의지의 두 기능을 가진다. 원래 의지는 선을 택할 자유가 있었으나, 그 자유는 하나님의 은혜 안에서만 유지되는 것이었다. 이 장은 2권의 원죄론으로 넘어가는 교두보이며, 자유의지 논쟁의 출발점이다.","secs":[["1","하나님을 아는 지식은 두 갈래 — 타락 전과 타락 후. 여기서는 타락 전을 다룬다는 규칙과 주의점, 그리고 이 논의에서 무엇을 피해야 하는지."],["2","영혼의 불멸을 증명한다 — 양심의 증언, 하나님을 아는 지식, 영혼에 주어진 고귀하고 뛰어난 능력, 그 활동과 정서들."],["3","하나님의 형상은 영혼의 불멸에 대한 가장 강력한 증거 가운데 하나다. 그 형상이 무엇인지, 오시안더의 꿈같은 주장에 대한 반박."],["4","하나님의 형상은 영혼에 있다. 그 본성은 그리스도로 말미암은 새롭게 하심에서 배울 수 있다. 새롭게 하심에 포함되는 것과, 타락 전 사람 안에 있던 하나님의 형상이 무엇이었는지."],["5","마니교도와 세르베투스의 영혼 기원설, 그리고 하나님의 형상이 본질 없이는 사람 안에 없다고 주장하는 오시안더의 주장을 반박한다."],["6-7","영혼의 기능에 대한 철학자들의 견해는 대체로 서로 어긋나고 불확실하고 어둡다. 영혼의 탁월함과, 한 사람 안에 오직 하나의 영혼이 있다는 점. 기독교 교리에 더 맞는 영혼 기능의 구분 — 지성과 의지."],["8","타락 전 사람의 지성과 의지의 능력과 직무. 사람의 자유의지. 이 자유가 타락으로 잃어버린 사실 — 철학자들이 알지 못한 진리 — 과 자유의지에 대한 여러 견해의 허구."]],"vs":[["창 1:26-27","\"우리의 형상을 따라 우리의 모양대로 우리가 사람을 만들고\" — 사람의 창조."],["골 3:10","새 사람을 입었으니 이는 그를 창조하신 자의 형상을 좇아 지식에까지 새롭게 하심을 받은 자니라."],["엡 4:24","\"하나님을 따라 의와 진리의 거룩함으로 지으심을 받은 새 사람을 입으라.\""],["전 12:7","영혼이 주신 자에게로 돌아간다 — 영혼의 불멸."],["창 2:7","\"생기를 그 코에 불어넣으시니 사람이 생령이 된지라.\""]],"hubs":["H04","H05","H06"],"rel":[["1-14","창조 기사 안에서 사람의 자리."],["2-01","원래의 형상과 대조되는 원죄."],["2-02","원래의 자유의지가 어떻게 상실되었는지."]]},{"t":"c","id":"1-16","b":1,"n":16,"label":"하나님은 창조하신 세상을 지금도…","title":"하나님은 창조하신 세상을 지금도 보존하시고 섭리로 통치하신다","one":"창조는 시작일 뿐이며, 하나님은 섭리로 만물과 그 각 부분을 지금도 붙드시고 다스리신다.","core":"칼빈은 하나님을 창조주로만 두고 세상은 스스로 돌아간다고 보는 이신론을 거부한다. 하나님은 세상을 지으신 뒤 손을 떼신 것이 아니라, 매 순간 만물을 붙드시고 그 각 부분을 다스리신다. 섭리는 막연한 일반 원리가 아니라 개별 사건과 개별 사람에게 미치는 특별한 통치다. 이 장에서 칼빈은 에피쿠로스적 우연론과 무관심한 섭리론, 스토아적 운명론을 차례로 반박하고, 참된 섭리의 정의를 제시한다. 우연은 우리의 시각일 뿐 하나님의 확정된 작정 밖에 있지 않다.","secs":[["1","악인도 육신의 감각을 따라 하나님을 창조주로는 인정한다. 그러나 경건한 자는 그분이 지혜롭고 능력 있는 통치자이심을 함께 인정한다."],["2","행운과 우연한 원인들로 하나님의 섭리를 대적하는 에피쿠로스학파를 반박한다. 해는 섭리를 밝히 보여 주는 표지다."],["3","무관심한 섭리라는 궤변을 반박하고, 하나님의 전능하심과 섭리를 함께 살핀다. 여기서 나오는 두 가지 유익."],["4","섭리의 정의 — 철학자들의 잘못된 교훈과 에피쿠로스·페리파토스학파의 꿈을 반박한다."],["5-7","하나님의 특별 섭리를 하나님의 공의와 자비와 성경의 구절로써 주장하고 증명한다. 인류에 관한 구절과, 인류를 위해 세상이 창조되었다는 점에서 증명한다. 이스라엘의 역사와 요나와 야곱의 예, 그리고 매일의 경험에서도 증명한다."],["8-9","섭리에 대한 잘못된 견해를 반박한다 — 스토아학파의 학설, 이방인의 행운과 우연. 하나님의 확정된 작정으로 된 일이 어째서 우리에게 우연처럼 보이는지, 우연성과 결과를 하나님의 은밀하지만 의로운 작정에서 떼어 내는 오류."]],"vs":[["골 1:17","\"그가 만물보다 먼저 계시고 만물이 그 안에 함께 섰느니라\" — 계속되는 붙드심."],["히 1:3","아들은 만물을 그 능력의 말씀으로 붙드신다."],["마 10:29-30","참새 두 마리도 아버지의 뜻 없이 떨어지지 않고, 머리카락까지 세여져 있다."],["시 104:27-30","모든 생물이 주께서 주시는 대로 먹으며, 주의 영을 보내어 창조되고 땅의 면을 새롭게 하신다."],["잠 16:33","\"제비는 사람이 뽑으나 모든 일의 결정은 여호와께 있느니라.\""]],"hubs":["H04"],"rel":[["1-17","섭리의 교리를 어떻게 써야 하는지."],["1-18","악인의 행위를 쓰시는 하나님의 주권."],["1-14","창조와 천사의 세계."]]},{"t":"c","id":"1-17","b":1,"n":17,"label":"섭리의 교리는 이렇게 사용해야 한다","title":"섭리의 교리는 이렇게 사용해야 한다","one":"섭리의 교리는 막연한 운명론이 아니라 아버지의 통치를 신뢰하게 하는 교리다.","core":"칼빈은 섭리의 교리가 신학적 사변이 아니라 성도의 삶을 붙드는 교리임을 보인다. 하나님의 섭리는 과거와 미래를 다 포괄하며, 수단을 쓰시고 수단 없이도, 수단을 거슬러서도 일하신다. 이 교리는 사람의 계획과 근면을 무력화하지 않고, 오히려 계획할 수 있게 하고 결과는 하나님께 맡기게 한다. 칼빈은 또한 하나님이 뜻을 바꾸시거나 후회하신다고 말하는 듯한 성경 구절들을 검토하며, 그것이 인간 언어의 방식으로 표현된 것임을 설명한다.","secs":[["1-2","섭리의 요약 — 미래와 과거를 다 포괄하며, 수단으로, 수단 없이, 수단을 거슬러 일하신다. 인류와 특히 교회가 특별한 돌봄의 대상이며, 그 통치는 대개 은밀하다."],["3","이 교리는 하나님의 은밀한 작정에 근거하므로, 자기 악행의 책임을 하나님께 돌리는 불경건도, 결과를 핑계로 무책임하게 사는 태도도 정당화하지 못한다."],["4","장래의 일에 관하여 하나님의 섭리를 믿는 것이 사람의 계획과 모순되지 않는다."],["5","이미 일어난 일에 관하여, 하나님의 작정에 따랐다는 이유로 죄를 벌하지 말아야 한다는 논변의 어리석음을 지적한다."],["6-10","섭리에 대한 거룩한 묵상 — 모든 일이 하나님의 작정으로 일어나며, 모든 것이 경건한 자에게 유익이 되고, 사람의 마음은 하나님의 손 안에 있다. 하나님은 교회의 원수들을 여러 방식으로 막으시고 꺾으시며, 사탄까지도 성도의 유익을 위해 다스리신다. 경건한 자를 인내와 절제로 단련하시고, 게으름을 흔들어 깨우신다. 이차 원인의 올바른 사용, 그리고 경건한 자가 부주의하거나 지혜롭지 못할 때 섭리가 어떻게 깨닫게 하시는지."],["10-11","사람의 삶이 무수한 재앙에 둘러싸여 있어도, 하나님의 섭리를 신뢰하는 의인은 온전히 안전하다. 이 묵상의 유익."],["12-14","두 가지 반론 — 하나님의 뜻을 바꾸시거나 후회하신다고 표현하는 성경 구절들 때문에 섭리가 무너진다는 반론, 그리고 하나님의 작정을 무효화하는 듯한 표현들에 대한 반론. 성경이 하나님께 후회를 돌려 말하는 이유와 그 답변."]],"vs":[["롬 8:28","\"우리가 알거니와 하나님을 사랑하는 자 곧 그 뜻대로 부르심을 입은 자들에게는 모든 것이 합력하여 선을 이루느니라.\""],["시 37:5","\"너의 길을 여호와께 맡기라 저를 의지하면 저가 이루시고\""],["잠 16:9","\"사람이 마음으로 자기의 길을 계획할지라도 그 걸음을 인도하는 자는 여호와시니라.\""],["약 4:13-15","\"주께서 원하시면 살 것이요\" — 계획과 하나님의 뜻을 겸손히 함께 두는 태도."],["렘 18:7-8","민족에 대하여 말씀하신 뒤 그 악에서 돌이키면 뜻을 돌이키신다고 하신다 — 하나님의 후회 표현."]],"hubs":["H04","H06"],"rel":[["1-16","섭리의 정의와 증명."],["1-18","악인의 도구성과 하나님의 무죄성."],["3-08","고난을 받아들이는 십자가의 삶으로 이어지는 신뢰."]]},{"t":"c","id":"1-18","b":1,"n":18,"label":"하나님은 악인까지 도구로 쓰시지만…","title":"하나님은 악인까지 도구로 쓰시지만 그 죄에는 조금도 책임이 없다","one":"하나님은 악한 자의 행위를 주권적으로 사용하시되, 그 죄의 저자가 아니시다.","core":"섭리론의 마지막 난제는 하나님이 악인을 쓰신다면 그 죄의 책임이 하나님께 있는가 하는 문제다. 칼빈의 답은 분명하다. 하나님은 악인의 행위를 도구로 쓰시지만, 그것을 쓰시는 하나님의 의로운 뜻과 죄를 범하는 악인의 뜻은 구별된다. 하나님은 허용만 하시는 것이 아니라 주권적으로 방향을 정하시지만, 죄 자체의 저자는 아니다. 이 구별은 인간 이성의 눈에는 모순처럼 보이지만, 성경의 증언으로 굳게 세워진다. 이 장은 개혁파 신학에서 악의 문제를 다루는 고전적 진술로 남았다.","secs":[["1","육신의 생각은 하나님의 섭리에 대한 반론들의 근원이다. '허락'과 '작정'을 나누는 근본적 반론이 제기된다."],["2","은밀하게 숨은 모든 움직임도 하나님의 보이지 않는 의로운 자극으로 그 목적에 이른다. 여러 예와 반론들에 대한 답변."],["3","이 반론들은 교만하고 신성모독적인 영에서 나온다. 하나님 안에 서로 대립하는 두 뜻이 있어야 한다는 반론을 반박하고, 하나님의 단일한 뜻이 때로 그렇게 보이는 이유를 밝힌다."],["4","하나님이 죄의 저자라는 반론을 여러 예로써 반박한다. 하나님께서 사탄을 끌어당기시거나 굽히신다고 말하는 구절들을 통해 아우구스티누스의 답변과 훈계를 제시한다."]],"vs":[["행 4:27-28","헤롯과 빌라도가 하나님의 손과 뜻이 정하신 대로 행한 그 일 — 하나님의 정하신 뜻과 악한 행위의 결합."],["창 50:20","\"당신들은 나를 해하려 하였으나 하나님은 그것을 선으로 바꾸사\" — 악한 뜻과 하나님의 선한 목적."],["사 10:5-7","앗수르는 하나님의 진노의 막대기였으나 그 마음은 그렇지 않았다."],["삼하 16:10-11","\"여호와께서 저에게 명하신 것이니\" — 시므이의 저주를 다윗이 받아들인 말."],["롬 9:19-20","\"그런즉 하나님이 어찌하여 책망하시느냐\" — 사람이 하나님께 반문할 수 없다는 바울의 답."]],"hubs":["H04","H05"],"rel":[["1-17","섭리를 어떻게 사용할 것인가."],["1-16","특별 섭리의 증명."],["3-24","책임과 유기하심을 다루는 예정론의 논변"]]},{"t":"c","id":"2-01","b":2,"n":1,"label":"아담의 타락으로 온 인류가 저주…","title":"아담의 타락으로 온 인류가 저주 아래 떨어지고 원죄를 물려받았다","one":"아담의 배교로 온 인류가 부패하였고, 그 부패는 모방이 아니라 유전으로 모든 사람에게 흐른다.","core":"1권에서 창조된 사람을 보았다면, 2권은 타락한 사람에서 시작한다. 칼빈은 사람을 바로 아는 일이 자기 기분을 좋게 하는 데 있지 않고 진정한 겸손에 있다고 말한다. 아담은 스스로 범죄하여 자기와 온 인류를 멸망에 빠뜨렸고, 그 부패는 본받음으로 전해지는 것이 아니라 출생으로 전해진다. 원죄는 단순히 첫 죄의 모방이 아니라 유전하는 본성의 부패이며, 그것이 우리를 하나님의 진노 아래 두고 마음의 모든 기능을 더럽힌다. 칼빈은 이 교리가 하나님이 죄의 저자가 되지 않음을 밝히는 방식으로 원죄를 정의한다.","secs":[["1-3","자기 지식의 필요성 — 우리는 교만을 벗고 참된 겸손을 입어야 한다. 사람의 지식은 두 부분으로 이루어지며, 그 둘째 부분을 다루기 위해 먼저 두 가지를 살펴야 한다."],["4-5","아담이 어떻게 자기와 온 인류를 그 무서운 파멸에 빠뜨렸는가, 그리고 타락의 전염이 어디까지 미치는가 — 모든 피조물에도 미치되 사람에게 가장 깊이 미친다."],["6-7","부패는 모방으로만 전해진 것이 아니라 유전으로 전해진다. 아담과 그리스도의 대조에서 이것이 증명된다. 영혼이 전해진다는 반론과, 자녀가 부모의 개인적 죄에 대하여 책임이 없다는 반론에 대한 답변."],["8-9","원죄의 정의와 그 두 부분 — 원죄는 우리를 하나님의 진노 아래 두고, 마음의 모든 기능에 유전적 부패를 낳는다. 정의의 전반부(유전하는 부패가 영혼의 모든 기능에 미친다)에 대한 설명."],["10-11","정의의 두 부분에서 하나님은 죄의 저자가 아니시며, 온 인류는 내재하는 부패로 더러워졌음이 따라온다. 그러나 이것은 본성 자체가 아니라 본성에 덧붙은 성질이므로, 두 원리가 있다는 마니교의 꿈은 사라진다."]],"vs":[["롬 5:12","\"한 사람으로 말미암아 죄가 세상에 들어오고 죄로 말미암아 사망이 들어왔나니\" — 유전하는 죄와 죽음."],["롬 5:19","\"한 사람의 순종하지 아니함으로 많은 사람이 죄인 된 것 같이\" — 아담과 그리스도의 대조."],["시 51:5","\"내가 죄악 중에서 출생하였음이여\" — 태에서부터의 부패."],["엡 2:3","\"본질상 진노의 자녀이었더니\" — 우리의 본래 처지."],["욥 14:4","\"누가 깨끗한 것을 더러운 것 가운데서 낼 수 있으리이까\" — 유전하는 부패."]],"hubs":["H05","H01"],"rel":[["2-15","타락 전 사람의 원래 모습과의 대조."],["2-02","타락이 의지에 남긴 결과."],["2-03","부패한 본성 전체의 상태."],["2-06","그래서 구속자가 필요한 이유."]]},{"t":"c","id":"2-02","b":2,"n":2,"label":"사람은 이제 의지의 자유를 잃고…","title":"사람은 이제 의지의 자유를 잃고 죄의 종이 되었다","one":"타락한 사람에게 남은 것은 의지 그 자체이지, 선을 택할 자유가 아니다.","core":"이 장은 《기독교 강요》에서 가장 길고 치밀한 자유의지 논쟁이다. 칼빈은 철학자들과 스콜라 신학자들이 '자유의지'라는 말로 무엇을 말하려 했는지 정리하고, 그 개념이 성경의 사람 이해와 맞지 않음을 보인다. 타락한 사람도 생각하고 선택하고 원한다. 그러나 선을 향한 참된 자유는 잃었다. 사람의 지성은 땅의 일과 기술에서는 놀라운 능력을 보이지만, 하늘의 일에서는 스스로 빛을 내지 못한다. 의지는 자원해서 죄를 선택하며, 그래서 죄의 종이 된 것은 부자연스러운 일이 아니라 자기 본성에 맞는 일이다.","secs":[["1","앞 장과 이어지는 네 장의 연결. 자유의지 논의의 기초를 놓기 위해 먼저 치워야 할 두 가지 장애물."],["2-6","여러 사람의 견해 — 철학자들의 의견과 그 미로들, 고대 신학자들의 견해, 스콜라 신학자들이 자유의지에 덧붙인 것들과 그 종류들, 그리고 이 문제를 설명하려는 그들의 얽힘."],["7-9","결론 — 이렇게 사소한 문제를 이토록 크게 다룰 일이 아니라는 점. 새 용어를 좋아하는 이들의 반론에 대한 답변. 교부들, 특히 아우구스티누스가 '자유의지'라는 말을 쓰면서도 이단의 교리를 정죄했다는 점. 아우구스티누스를 빼면 고대 저술가들의 자유의지 언어는 거의 이해하기 어렵다는 평가."],["10-12","참된 교리의 단순한 진술 — 사람이 참으로 유익을 얻기 시작하는 것은 하나님의 은혜로 말미암는다. 고대 신학자들의 증언으로 확증. 기초가 놓인 뒤, 지성과 의지의 능력이 지금 어디까지 미치는가를 일반적으로 논한다."],["13-17","사람의 지성이 땅의 일과 하늘의 일 모두로 미친다. 땅의 일에 대한 지성의 능력과 기술에 대한 능력 — 개인에게 주어진 재능도 하나님의 은혜를 증언한다. 이 지식의 근거와 쓰임 — 타락한 본성도 하나님의 관대하심으로 장식된다는 점과, 개인에게 주어진 재능이 인류 공동의 유익을 위함이라는 점."],["18-24","하늘의 일에 대한 사람 지성의 능력 — 이는 세 가지로 줄어든다. 성경 구절들이 아담의 자손에게 얼마간의 빛이 있으나 하늘의 일을 깨닫기에 충분하지 않음을 보인다. 양자됨은 본성에서 오지 않고 성령의 중생으로 인쳐진다. 사람의 지성은 조명되기 전까지 하늘의 일에서 눈멀어 있다. 디모데전서의 증언. 테미스티우스는 지성의 착각이 일반적인 것보다 개별적인 것에서 드러난다고 보아 더 진리에 가까웠다. 그러나 일반적인 것에서도 지성이 그렇게 드물게 속는 것은 아니다 — 하나님을 판단하는 자리에서 그 눈멂이 드러난다."],["25-27","모든 죄를 무지의 탓으로 돌릴 수도 없고, 모든 죄에 고의적 악의가 있다고 할 수도 없다는 중간 견해. 의지에 대한 검토 — 모든 사람이 느끼는 선에 대한 자연적 욕구가 의지의 자유를 증명하지 못한다. 스콜라 신학자들의 교리는 성경과 반대되며, 온 사람이 죄의 권세 아래 있으므로 의지도 그 종이 되었다는 결론."]],"vs":[["롬 6:16-17","\"죄의 종으로 사망에 이르는 자\" — 순종함으로 의의 종이 된다."],["요 8:34","\"죄를 범하는 자마다 죄의 종이라\" — 자유의 상실."],["롬 7:18-19","\"내 속 곧 내 육신에 선한 것이 거하지 아니하는도다\" — 바울의 고백."],["고전 2:14","육에 속한 사람은 하나님의 성령의 일을 받지 못하고 깨닫지도 못한다."],["빌 2:13","\"너희 안에서 행하시는 이는 하나님이시니\" — 의지의 근원이 은혜임."]],"hubs":["H06","H05"],"rel":[["2-01","원죄와 유전하는 부패."],["2-03","은혜 없이 독자적으로는 아무 선도 할 수 없음의 정밀한 진술."],["2-04","하나님이 마음 안에서 일하시는 방식."],["2-05","자유의지 변호 논거에 대한 조목별 반박."]]},{"t":"c","id":"2-03","b":2,"n":3,"label":"타락한 본성에서 나오는 것은 모두…","title":"타락한 본성에서 나오는 것은 모두 저주받을 만하다","one":"타락한 사람은 좋은 의지를 품을 수 없고, 은혜로 새롭게 될 때만 하나님께로 돌이킨다.","core":"앞 장에서 사람의 능력이 어디까지 미치는지 살폈다면, 이 장은 더 날카롭다. '육'이라는 말은 감각적인 부분만이 아니라 영혼의 고귀한 부분까지 포함하며, 사람은 한 부분도 온전한 곳이 없다. 칼빈은 이방인들의 도덕적 미덕도 인정하지만, 그것이 참된 선이 되려면 하나님을 향한 마음이 있어야 한다고 본다. 의지는 억지로가 아니라 자원해서 죄에 묶여 있다 — 필연이면서도 자발적이다. 그리고 하나님께로 돌이키는 첫 마음부터 끝까지, 그 전부가 은혜의 일이다.","secs":[["1-2","온 사람의 지성과 의지가 부패하였다. '육'이라는 말은 감각적인 부분뿐 아니라 영혼의 더 높은 부분에도 적용된다. 마음도 부패에 휘말렸으므로 사람 안에서 온전함이나 하나님을 아는 지식이나 경외를 찾을 수 없다."],["3-4","이방인 가운데 놀라운 재능을 가진 이들이 있었으니 사람 본성이 완전히 부패하지는 않았다는 반론에 답한다. 이방인의 덕과 악을 같은 자리에 둘 것인가, 덕이 있는 이들이 사람 본성이 선천적으로 정직함을 증명하는가 하는 반론."],["5","사람에게 여전히 의지하는 능력은 있으나 그 안에 온전함이 없다. 그는 죄의 속박 아래 필연적으로 떨어지지만, 그럼에도 자발적으로 떨어진다 — 필연과 자발성이 모순되지 않는다."],["6-11","하나님께 돌이키는 것이 사람 의지의 치료이며, 그것도 시작만이 아니라 계속과 완성이 하나님의 일이다. 여러 반론 — 의지가 하나님으로 말미암아 돌이키지만 일단 준비되면 그다음은 자기의 몫이라는 반론, 은혜로 되는 것이니 회개의 필요가 없다는 반론. 하나님이 성도들의 기도를 들으신다는 사실이 선한 의지가 은혜임을 확증한다."],["12-14","'협력하는 은혜'를 나누는 반론과 그에 대한 답변. 아우구스티누스와 베르나르의 증언으로 답변을 확증한다. 이 장 후반부에서는 아우구스티누스가 바로 이 교리를 붙들었음을 많은 구절로 보이고, 그가 자기 자신과 다른 신학자들과 어긋난다는 반론을 걷어 낸다. 아우구스티누스의 자유의지 교리 요약."]],"vs":[["롬 3:10-12","\"기록된 바 의인은 없나니 하나도 없으며 깨닫는 자도 없고 하나님을 찾는 자도 없고\" — 전적 부패."],["롬 8:7","\"육신의 생각은 하나님과 원수가 되나니\" — 마음의 적대."],["요 15:5","\"나를 떠나서는 너희가 아무것도 할 수 없음이라.\""],["고전 4:7","\"네가 받지 아니한 것이 무엇이 있느냐\" — 모든 것이 선물이다."],["렘 13:23","구스인이 피부를, 표범이 그 반점을 바꿀 수 없듯이 습관이 굳은 자는 선을 행할 수 없다 — 다만 은혜로."]],"hubs":["H06","H05"],"rel":[["2-02","자유의지 일반에 대한 논의."],["2-04","어떻게 하나님께서 마음 안에서 일하시는가."],["2-05","반대 논거의 반박."],["3-01","그리스도의 유익이 성령으로 적용되는 방식으로 이어짐."]]},{"t":"c","id":"2-04","b":2,"n":4,"label":"하나님은 사람의 마음 안에서 어떻게…","title":"하나님은 사람의 마음 안에서 어떻게 일하시는가","one":"하나님은 악인의 마음도, 성도의 의지도 실제로 움직이시며, 조명하시고 굽히신다.","core":"하나님의 역사가 단지 미리 아심이나 허락에 그친다는 생각을 칼빈은 거부한다. 성경은 하나님이 바로의 마음을 완강하게 하시고, 사탄을 보내어 거짓 영으로 역사하시고, 성도의 의지를 새롭게 하신다고 말한다. 그래서 하나님은 악한 자의 마음도 실제로 역사하시지만, 그 죄악에 참여하지 않으신다. 이 구별은 어렵지만, 성경의 두 진술을 함께 붙드는 데서 온다 — 하나님의 주권적 역사와 사람의 책임 있는 행위가 모두 참이다. 중생한 의지도 하나님의 은혜로 움직이되, 억지가 아니라 기꺼이 움직인다.","secs":[["1","앞 장과의 연결 — 아우구스티누스의 '좋은 말과 나쁜 말을 타는 사람' 비유. 마귀에 관한 문제에 대한 답."],["2-3","하나님과 사람에 관한 문제에 대한 답 — 욥의 경우. 하나님이 하시는 일과 사탄과 악인들이 하는 일의 구별. 하나님이 이 경우 하시는 일을 미리 아심이나 허락으로 돌리는 오래된 반론에 대한 답 — 하나님이 실제로 눈멀게 하시고 굳게 하신다."],["4-5","하나님이 양쪽으로 역사하신다는 것을 보여 주는 성경 구절들과, 미리 아심에 관한 반론의 처리. 아우구스티누스의 확증. 하나님은 사탄을 써서 버림받은 자를 자극하시되, 그 오염에서 자유하시다는 변형된 답변."],["6-8","중간적 사항(무관한 일들)에서 하나님께서 사람의 마음에 어떻게 역사하시는가. 이런 일에서도 우리 의지가 하나님의 지배적 섭리에서 벗어날 만큼 자유롭지 않다. 이런 예들이 규칙이 되지 못한다는 반론에 대한 답변 — 보편적 경험과 성경과 아우구스티누스의 한 구절로 무장한다. 어떤 이들은 결과에서 자유의지의 오류를 반박하는 논증을 끌어내는데, 그것을 어떻게 이해해야 하는가 — 사람이 죄의 멍에에 그렇게 묶여 있다는 점."]],"vs":[["출 7:3","\"내가 바로의 마음을 완악하게 할 것이라\" — 실제적 역사."],["삼상 16:14","여호와의 영이 사울에게서 떠나고 여호와께로부터 악한 영이 그를 번뇌하게 하였다."],["겔 36:26-27","\"새 영을 너희 속에 두고 새 마음을 너희에게 주되\" — 마음을 바꾸시는 역사."],["빌 2:12-13","두렵고 떨림으로 구원을 이루라, 너희 안에서 행하시는 이는 하나님이시다."],["잠 21:1","\"왕의 마음이 여호와의 손에 있음이 마치 보의 물과 같아서\" — 주권적으로 이끄신다."]],"hubs":["H06"],"rel":[["2-02","자유의지의 상실."],["2-03","은혜가 전부라는 진술."],["1-18","악인을 도구로 쓰시는 하나님."],["3-01","성령의 사역으로서의 적용."]]},{"t":"c","id":"2-05","b":2,"n":5,"label":"자유의지를 변호하는 통상의 논거들을…","title":"자유의지를 변호하는 통상의 논거들을 반박한다","one":"율법의 명령과 약속과 책망은 사람의 능력을 증명하지 않고, 오히려 은혜의 필요를 드러낸다.","core":"이 장은 반대자들의 주장을 조목조목 다룬다. 율법이 완전한 순종을 요구하니 할 수 있다, 하나님이 찾으라고 하시니 찾을 수 있다, 꾸짖으시니 고칠 수 있다는 논변들이 그것이다. 칼빈의 답은 일관된다. 명령은 의무를 보여 주고, 약속은 은혜를 보여 주며, 책망은 사람이 스스로 고칠 수 없음을 깨닫게 한다. 성경이 말하는 '너희가 돌이키라'는 명령에도 하나님이 함께 주시는 은혜가 있다. 오래된 여러 구절들(창세기, 로마서, 전도서, 누가복음)의 바른 해석을 제시하며 논의를 마무리한다.","secs":[["1-5","반대자들의 터무니없는 궤변들을 먼저 반박하고 몇몇 성경 구절을 해석한다. 아리스토텔레스와 펠라기우스의 궤변, 크리소스토무스의 말에서 빌려온 궤변, 펠라기우스파가 오래전에 주장한 궤변에 차례로 답한다. 답변의 요약."],["6-9","신(新)펠라기우스주의자들이 성경에서 자유의지를 변호하려 끌어낸 첫째 부류의 논거 — 율법이 완전한 순종을 요구하므로 하나님이 순종할 능력을 주셨다는 주장. 약속이 붙은 명령은 우리의 구원이 어디에 있는지 보여 준다. 세 부류의 명령(돌이키라, 지키라 등)에 대한 개별 검토도 그들을 돕지 못한다."],["10","둘째 부류 — 하나님이 구하는 자에게 주신다는 약속이 자유의지를 증명한다는 논거."],["11-12","셋째 부류 — 하나님의 책망이 우리 힘으로 피할 수 없는 악을 꾸짖는 헛된 일이라는 논거. 모세의 말에서 빌려온 반론을 바울의 말로 논파한다."],["13-15","넷째 부류 — 하나님이 회개할지 지켜보신다는 논거. 다섯째 부류 — 선한 행위와 악한 행위가 우리 것이라고 설명되므로 둘 다 할 수 있다는 논거와 그 답변. 논의의 결론."],["16-19","성경 구절들에 대한 논의 — 창세기의 한 구절, 로마서의 구절과 그 반론들의 논파, 전도서의 구절, 누가복음의 구절(예루살렘을 향한 탄식). 우의적 해석의 약함과 아우구스티누스의 해석, 그리고 전체의 결론과 요약."]],"vs":[["신 30:11-14","\"이 명령은 네게 어려운 것도 아니요 먼 것도 아니라\" — 말씀이 가까이 있음."],["요 6:44","\"나를 보내신 아버지께서 이끌지 아니하시면 아무도 내게 올 수 없으니\" — 오는 것도 은혜."],["롬 9:16","\"그런즉 원하는 자로 말미암음도 아니요 달음박질하는 자로 말미암음도 아니요 오직 긍휼히 여기시는 하나님으로 말미암음이니라.\""],["마 23:37","\"내가 너희를 모으려 한 일이 몇 번이냐\" — 사람의 완고함과 그리스도의 탄식."],["겔 18:31","\"너희가 어찌하여 죽고자 하느냐\" — 책망의 목적은 회개로 이끄는 데 있다."]],"hubs":["H06"],"rel":[["2-02","자유의지의 실제 상태."],["2-03","은혜의 필요성."],["2-04","하나님이 의지를 움직이시는 방식."],["4-17","성도의 연약함과 은혜의 관계"]]},{"t":"c","id":"2-06","b":2,"n":6,"label":"잃어버린 사람의 구속은 그리스도…","title":"잃어버린 사람의 구속은 그리스도 안에서 찾아야 한다","one":"창조주를 아는 것만으로는 구원에 이르지 못하며, 중보자 그리스도 안에서만 하나님이 자비로우신 아버지가 되신다.","core":"1권이 창조주 하나님을 다루었다면, 2권의 나머지는 구속자 하나님을 다룬다. 칼빈은 창조주를 아는 지식이 구원에 이르지 못한다고 말한다. 타락한 우리에게 하나님은 두렵고 먼 분이 되셨기에, 그분이 아버지가 되시려면 중보자가 필요하다. 구약의 성도들도 그리스도 없이 하나님께 나아가지 못했고, 제사와 성막과 언약의 모든 제도가 그리스도를 가리켰다. 그래서 구약 성도들의 신앙도 그리스도를 향한 신앙이었으며, 하나님을 믿으라는 말은 결국 그리스도를 믿으라는 말과 하나다.","secs":[["1","창조주 하나님을 아는 지식은 그리스도 구속자를 믿는 신앙 없이는 유익이 없다. 첫째 이유와, 사도의 증언으로 강화된 둘째 이유."],["2","하나님은 중보자 그리스도 없이는 고대 이스라엘에게도 기뻐하시지 않으셨다. 첫째 이유는 희생 제도의 제정에, 둘째 이유는 언약의 성격에 근거한다."],["3","그리스도는 환난당한 자들에게 늘 약속된 위로였고, 신앙과 소망의 기치는 언제나 세워졌다. 여러 성경 구절이 이를 확증한다."],["4","유대인들은 그리스도를 바라보도록 가르침을 받았다. 이 가르침은 그리스도 자신이 승인하셨다. '하나님은 신앙의 대상이다'라는 통상적 격언에 대한 검토와 그 바른 이해."]],"vs":[["요 14:6","\"나로 말미암지 않고는 아버지께로 올 자가 없느니라.\""],["행 4:12","\"다른 이름으로는 사람들이 구원을 받지 못하나니\" — 오직 그리스도."],["히 9:22","\"피 흘림이 없은즉 사함이 없느니라\" — 제사의 제도가 그리스도를 가리킨다."],["요 5:46","\"모세가 나를 두고 기록하였은즉\" — 모세도 그리스도를 증언했다."],["창 3:15","\"여자의 후손이 네 머리를 상하게 할 것이요\" — 첫 복음 약속."]],"hubs":["H11","H09"],"rel":[["2-07","율법 전체가 그리스도를 가리키는 방식."],["2-09","그리스도가 구약에도 알려졌다는 점."],["1-01","하나님을 아는 지식의 두 갈래."]]},{"t":"c","id":"2-07","b":2,"n":7,"label":"율법은 백성을 율법 아래 붙들려고…","title":"율법은 백성을 율법 아래 붙들려고 주신 것이 아니라 그리스도 안의 소망을 살리려고 주셨다","one":"율법의 제사와 절기와 도덕법 전체가 그리스도를 가리키며, 율법의 참된 쓰임은 우리를 그리스도께로 몰아가는 데 있다.","core":"율법은 구원의 길이 아니라 그리스도를 가리키는 그림자다. 칼빈은 모세를 통해 주신 종교 제도의 모든 부분 — 제사, 씻음, 절기, 다윗 왕조의 왕권, 도덕법 자체 — 이 그리스도를 가리킨다고 정리한다. 특히 도덕법의 세 가지 쓰임을 제시한다. 첫째는 죄를 깨닫게 하는 거울의 쓰임, 둘째는 악을 억제하는 쓰임, 셋째는 택한 자를 가르쳐 날마다 하나님의 뜻 안에서 자라게 하는 쓰임이다. 율법은 폐하여진 것이 아니며, 그 저주만 그리스도 안에서 끝났다.","secs":[["1-2","모세의 손으로 주신 종교의 전 체계가 여러 방식으로 그리스도를 가리켰다 — 제사, 씻음, 절기, 성막, 다윗의 집에 세워진 왕국, 의식의 목적, 도덕법의 목적."],["3","도덕법이 신자를 그리스도께로 인도한다는 것을 더 넉넉히 설명한다. 도덕법은 하나님이 요구하시는 완전한 의를 보여 주어 우리의 무능을 깨닫게 한다."],["4-5","율법의 약속이 조건적이지만 가장 좋은 근거 위에 세워졌다는 점과 그 근거에 대한 설명. 지킬 수 없는 율법을 주신 것이 모순이 아니라는 점을 이성과 성경으로 증명한다."],["6-9","도덕법의 직무와 쓰임을 살펴보면 율법이 그리스도께로 인도함을 안다. 율법은 하나님이 받으시는 의를 묘사하면서 우리의 무능을 드러낸다. 율법은 우리의 비참을 보여 주는 거울에 합당히 비유된다 — 이는 율법의 탁월함을 조금도 깎지 않는다. 율법이 우리의 죄책을 드러낼 때 낙망하지 말고 하나님의 자비로 도피해야 한다. 아우구스티누스의 여러 구절로 첫째 쓰임을 확증한다."],["10-11","둘째 쓰임 — 죄인을 억제하는 것. 이는 공동체 전체의 유익을 위해 가장 필요하다. 율법은 우리의 비참을 보여 주어 치료를 받아들이게 하고, 우리를 직무에 붙들어 두는 역할도 한다. 일반적 경험으로 확증."],["12-13","셋째이자 가장 적절한 쓰임 — 택한 자에 관한 것. 율법은 그들이 하나님의 뜻을 행하는 일에 날마다 자라도록 가르친다. 율법 폐기를 주장하는 무율법주의(안티노미안)의 불경한 이단을 배격해야 한다."],["14-17","율법의 폐지에 관한 논의 — 도덕법의 어느 부분이 어떤 의미에서 폐지되었는가, 저주가 어떻게 폐지되었는가, 의식법이 지킴에 관한 한 어떻게 폐지되었는가. 바울이 말한 것은 도덕법이 아니라 의식 규례에만 적용된다."]],"vs":[["갈 3:24","\"이같이 율법이 우리를 그리스도께로 인도하는 초등교사가 되어\" — 율법의 목적."],["롬 3:20","\"율법으로는 죄를 깨달음이니라\" — 첫째 쓰임."],["롬 7:7","\"율법으로 말미암지 않고는 내가 죄를 알지 못하였으리니\" — 죄의 지식."],["딤전 1:9","\"율법은 불법한 자와 복종하지 아니하는 자를 위하여 있는 것이요\" — 둘째 쓰임."],["시 119:105","율법은 신자의 길을 비추는 등불이다 — 셋째 쓰임."]],"hubs":["H07"],"rel":[["2-08","도덕법의 실제 해설."],["2-11","구약의 의식이 그리스도 안에서 성취되는 방식."],["3-17","율법과 복음의 약속의 조화."]]},{"t":"c","id":"2-08","b":2,"n":8,"label":"도덕법의 해설 — 십계명","title":"도덕법의 해설 — 십계명","one":"십계명은 하나님 사랑과 이웃 사랑의 두 돌판이며, 그 요구는 행위뿐 아니라 마음의 동기까지 미친다.","core":"이 장은 《기독교 강요》에서 가장 긴 장이다. 칼빈은 먼저 율법 해석의 세 가지 규칙을 세운다. 율법은 외적 행위뿐 아니라 마음의 정욕까지 다스리며, 계명의 목적을 물어 무엇을 요구하시는지 알아야 하며, 계명은 하나의 극단을 말할 때 반대편 극단도 함께 명하거나 금한다. 이 규칙 위에서 십계명을 하나씩 해설한다. 서론은 하나님이 우리의 하나님이 되신다는 은혜를 먼저 선포하고, 그 은혜에 대한 응답으로 순종을 요구한다. 칼빈은 모든 계명을 하나님 사랑과 이웃 사랑으로 모으고, 계명을 권면으로 낮추는 스콜라 신학의 오류를 반박한다.","secs":[["1-5","율법이 기록으로 주어진 이유 — 하나님과 우리 자신에 대한 지식을 더 온전히 가르치기 위해. 하나님을 아는 지식에서 얻는 몇 가지 일반 원칙, 우리 자신을 아는 지식에서 얻는 원칙, 약속과 위협이 붙은 이유, 순종보다 하나님이 기뻐하시는 것이 없다는 점."],["6-10","해석의 세 가지 규칙 — 첫째, 우리 삶은 외적 정직만이 아니라 마음의 내적 정직으로도 율법에 의해 빚어져야 한다. 그리스도의 권위로 확증하고, 그리스도를 또 다른 모세로 보는 궤변을 반박한다. 둘째, 계명의 목적을 물어 입법자가 무엇을 요구하시는지 알아야 한다. 셋째, 십계명을 두 돌판으로 나누는 구분 — 전자는 하나님께 대한 의무, 후자는 이웃에 대한 의무."],["11-12","십계명의 구분과 여러 구분법 가운데 두 돌판으로 나누는 구분이 가장 좋다는 점."],["13-15","십계명 해설 — 서론이 율법의 권위를 세우는 세 가지 방식. 두 번째로 하나님의 아버지 같은 친절을 기억하게 하심, 세 번째로 이집트에서의 구원을 기억하게 하심. 하나님이 특정한 칭호로 자신을 구별하시는 이유."],["16","제1계명 해설 — 그 목적과 '나 외에 다른 신을 두지 말라'는 말의 의미. 경배, 신뢰, 기도, 감사를 하나님께만 돌린다."],["17-21","제2계명 해설 — 목적과 요약, 두 부분, 금지된 형상들의 간략한 열거. 위협이 붙은 이유와 하나님께 붙은 네 가지 칭호(전능하신 자, 질투하시는 자, 보응하시는 자, 긍휼히 여기시는 자). 아버지의 죄를 자손에게 묻는다는 말의 바른 해석과 하나님의 공의와의 관계, 그리고 천 대까지 은혜를 베푸신다는 약속의 쓰임."],["22-27","제3계명 해설 — 목적과 요약, 세 부분. 하나님의 이름을 헛되이 일컫는 일, 맹세, 맹세의 정의와 그것이 예배의 한 종류라는 점. 이 계명을 어기는 여러 방식 — 아는 거짓을 증언하게 하나님을 부르는 것, 사소한 일에 하나님을 부르는 것, 피조물로 대신하는 것. 모든 맹세를 정죄하는 재세례파의 반박과 공적·사적 맹세의 정당성."],["28-34","제4계명 해설 — 목적과 세 가지 뜻. 첫째 뜻(영적 안식의 그림자)이 계명의 으뜸 목적이며 하나님이 우리의 안식이 되심을 보여 준다. 일곱이라는 수가 성경에서 완전을 뜻하므로 영원한 안식을 가리킨다는 해석과, 더 단순하게 수 자체보다 우리의 모든 일에서 쉬는 교리를 붙드는 해석. 둘째와 셋째 뜻 — 공적 예배를 위한 모임과 노동하는 자를 위한 배려. 주일 준수에 대한 반론과 그 근거, 미신적 필요가 없다는 점과 계명의 요약."],["35-38","제5계명 해설 — 그 목적과 실질, 부모에게 돌릴 공경의 정도, '아버지'라는 말이 누구에게 적용되는가. 공경받을 만하든 그렇지 않든 이 공경이 요구된다는 점, 공경의 내용(존경, 순종, 감사), 약속이 붙은 이유와 그 의미, 순종치 않는 자녀에게 선포된 저주, 부모와 그 자리에 있는 자들에게 어디까지 순종해야 하는가."],["39-40","제6계명 해설 — 목적과 실질. 하나님은 영적 입법자로서 마음의 살인까지 금하시고 생명을 보호하려는 진실한 소망을 요구하신다. 이 계명의 두 근거 — 사람이 하나님의 형상이며 우리의 살붙이인 것."],["41-44","제7계명 해설 — 목적과 실질, 음행을 막는 방편. 절제는 하나님의 다스림 아래 있을 때 탁월한 선물이며, 어떤 이에게는 전혀 주어지지 않고 어떤 이에게는 한때만 주어진다. 결혼을 권하는 논증과 정절에 합당한 때, 참된 독신과 그 올바른 사용, 결혼 생활에서 지켜야 할 주의점과 정숙에 반하는 모든 것의 정죄."],["45-46","제8계명 해설 — 목적과 실질, 네 가지 도둑질의 종류와 이 계명이 정죄하는 악한 행위들, 그 밖의 특별한 종류의 도둑질. 이 계명의 올바른 준수 — 네 가지 측면과 그 적용(백성과 관원, 교회의 목회자와 양 무리)."],["47-48","제9계명 해설 — 목적과 실질. 거짓을 미워하고 진리를 구하는 것이 계명의 핵심. 두 종류의 위반 — 헐뜯음, 악한 말(그리스도인의 사랑의 의무에 반하는 것), 남의 평판을 깎는 조롱과 비방."],["49-50","제10계명 해설 — 목적과 실질, '탐심'의 의미, 권고와 여기서 말하는 탐심의 구별. 하나님이 이토록 큰 순수함을 요구하시는 이유와 반론에 대한 답, 이웃 사랑이 으뜸으로 권해지는 이유, 집과 아내와 남종과 여종이 마지막에 열거된 이유."],["51-59","율법의 끝 — 계명의 요약. 율법은 단순한 초보가 아니라 완전한 교리를 전한다. 복음서와 서신에서 둘째 돌판만 언급되는 이유, 이에 대한 반론의 처리. 하나님의 율법에 바로 다스려진 삶은 이웃 사랑으로 특징지어진다 — 자기 이익을 앞세우는 자들이 이것을 뒤집는다. '이웃'이 누구인가, 스콜라 신학자들의 두 가지 오류(계명을 수도자들의 권면으로 바꾸는 것, 숨은 불경건과 탐심을 사소한 죄라 부르는 것)와 그 반박."]],"vs":[["출 20:2-3","\"나는 너를 애굽 땅 종 되었던 집에서 인도하여 낸 네 하나님 여호와니라\" — 서론의 은혜, 이어지는 제1계명."],["신 6:5","\"너는 마음을 다하고 뜻을 다하고 힘을 다하여 네 하나님 여호와를 사랑하라\" — 으뜸 되는 계명."],["레 19:18","\"네 이웃을 네 자신 같이 사랑하라\" — 둘째 계명."],["마 5:21-22","마음으로 형제에게 노하는 것도 살인이라 — 계명의 내면성."],["마 22:37-40","온 율법과 선지자의 강령이 이 두 계명에 달렸다."],["롬 13:8-10","사랑은 율법의 완성이니라."]],"hubs":["H07"],"rel":[["2-07","율법의 목적과 세 가지 쓰임."],["2-12","제1·2계명과 예배의 대상 문제."],["3-19","그리스도인의 자유와 율법의 관계."]]},{"t":"c","id":"2-09","b":2,"n":9,"label":"그리스도는 율법 아래에서도…","title":"그리스도는 율법 아래에서도 알려졌고, 복음에서 온전히 나타나셨다","one":"구약 성도들도 그리스도의 날을 보았으나, 복음에서 그리스도는 얼굴과 얼굴을 대하여 나타나셨다.","core":"구약과 신약을 끊어 놓는 이들에게 칼빈은 구약의 성도들도 그리스도를 보았다고 답한다. 다만 그 보임이 흐릿했고, 복음에서는 그리스도가 몸으로 오셔서 온전히 나타나셨다. '복음'이라는 말은 넓은 뜻으로는 하나님께서 족장들에게 주신 자비의 증언도 포함하지만, 좁은 뜻으로는 그리스도 안에 드러난 구원의 기쁜 소식이다. 그래서 율법과 복음은 서로 반대가 아니라 약속과 성취의 관계에 있다. 세르베투스가 약속은 폐지되고 복음만 남았다고 주장한 것은 이 관계를 잘못 본 것이다.","secs":[["1","율법 아래의 거룩한 족장들은 그리스도의 날을 보았으나 흐릿하게 보았다. 복음 아래에서는 그가 더 온전히 드러나셨다. 그 이유와 확증."],["2","'복음'이라는 말은 가장 넓은 뜻으로는 하나님이 족장들에게 주신 자비의 증언을 포함한다. 그러나 엄밀한 뜻으로는 그리스도 안의 은혜의 선포다."],["3","약속이 전적으로 폐지되었다는 세르베투스의 견해를 반박한다. 우리가 여전히 하나님의 약속을 신뢰해야 하는 이유와, 다른 이유, 그리고 몇몇 반론의 해결."],["4","율법과 복음을 바르게 비교하지 못하는 이들에 대한 반박. 여기서 제기되는 몇 가지 질문에 대한 답, 그리고 율법과 복음의 간단한 비교."],["5","세례 요한의 사역에 대한 논의. 하나님이 옛적에 선지자들을 통하여 증언하시기를 기뻐하신 것은 헛되지 않았다."]],"vs":[["요 8:56","\"너희 조상 아브라함은 나의 때 볼 것을 즐거워하다가 보고 기뻐하였느니라\" — 구약 성도가 그리스도를 보았다."],["눅 10:23-24","많은 선지자와 왕이 너희 보는 것을 보고자 하였으나 보지 못하였다."],["갈 3:8","\"하나님이 이방을 믿음으로 말미암아 의롭다 하실 것을 성경이 미리 알고\" — 구약에 이미 복음이 있다."],["히 1:1-2","옛적에는 선지자들로, 이 마지막에는 아들로 말씀하셨다."],["고후 3:13-16","모세의 얼굴을 가리운 수건 — 그리스도 안에서 벗겨진다."]],"hubs":["H08"],"rel":[["2-10","구약과 신약의 놀라운 유사성."],["2-11","두 언약의 차이."],["2-06","중보자 없이는 하나님께 나아갈 수 없음."]]},{"t":"c","id":"2-10","b":2,"n":10,"label":"구약과 신약의 유사성","title":"구약과 신약의 유사성","one":"옛 언약과 새 언약은 본질에서 하나이며, 두 언약 모두 영생의 소망을 약속하고 그리스도의 중보 위에 서 있다.","core":"세르베투스와 재세례파는 구약의 성도들이 육신의 복만 바라고 영생은 몰랐다고 주장했다. 칼빈은 이 주장을 반박하며 두 언약의 세 가지 근본 일치를 제시한다. 첫째, 두 언약 모두 이 세상을 넘어선 영생의 복을 약속했다。 둘째, 두 언약 모두 하나님의 자비 위에 세워졌다. 셋째, 두 언약 모두 그리스도의 중보로 확증되었다. 칼빈은 아담과 아벨과 노아와 아브라함과 다윗과 욥과 에스겔의 마른 뼈 환상에 이르기까지, 구약 성도들이 장래의 영광을 바라보았다는 증거를 길게 늘어놓는다.","secs":[["1","세르베투스와 재세례파에 맞서 두 언약의 유사성을 증명해야 할 필요성을 밝히는 서론."],["2","일반적 유사성 — 두 언약은 진실로 하나이며 다만 다른 방식으로 관리되었다. 두 언약이 완전히 일치하는 세 가지 점."],["3","첫째 일치 — 구약도 신약과 마찬가지로 그 약속을 현세 너머로 확장하여 영생의 소망을 제시했다."],["4-8","나머지 두 일치 — 두 언약 모두 하나님의 자비 위에 세워졌고 그리스도의 중보로 확증되었다. 두 점의 기초가 되는 하나님의 자비에 대한 긴 증명 — 율법과 선지자에서 말씀의 능력이 그리스도가 나타나기 전에도 영혼을 살렸다는 증거, 언약의 형식이 그리스도 이전과 이후에 실질적으로 하나였다는 증거."],["9","언약의 형식에 대한 확증과, 언약의 성격에서 오는 확증."],["10-14","예들로 증명한다 — 아담과 아벨과 노아가 여러 시험을 당하면서도 현재를 버리고 살아 있는 믿음으로 영원한 행복을 바라보았다. 아브라함의 부르심과 삶 전체, 이삭과 야곱의 예, 그리고 그 결론. 야곱이 장자의 명예를 얻고자 한 열심도 장래 생명에 대한 강한 소망을 보여 준다."],["15-18","다윗이 주께 큰 것을 바라면서도 현재의 삶을 허무하다고 선언한 점, 신자의 행복에 대한 다윗의 묘사가 장래의 상태에서만 성취될 수 있다는 점, 모든 경건한 자들이 믿음과 소망으로 하늘에서 얻고자 한 공통된 고백, 세상이 무너지는 가운데서도 의인이 기뻐한 증거."],["19-22","욥이 이 소망을 가장 분명하게 말한 점과 두 반론의 처리. 후기 선지자들이 의인의 행복이 현세의 한계 너머에 있다고 가르친 점, 에스겔의 마른 뼈 환상과 이사야의 구절로 확증된 점, 의인의 장래 불멸을 분명히 보여 주는 선지서 구절들."],["23","두 언약의 유사성에 관한 논의의 결론. 더 넉넉한 확증을 위해 네 구절을 제시하고 반론을 처리한다."]],"vs":[["히 11:9-10","아브라함이 장막에 거주하며 하나님의 경영하시고 지으실 터가 있는 성을 바랐다."],["히 11:13","이 사람들은 다 믿음을 따라 죽었으며 약속을 받지 못하였으되 그것들을 멀리서 보고 환영하며."],["시 73:25-26","\"주 밖에는 나의 영혼이 어떻게 홀로 전멸하겠나이까\" — 현세 너머의 소망."],["욥 19:25-27","\"내가 알기에는 나의 구속자가 살아 계시니\" — 욥의 고백."],["겔 37:5-6","마른 뼈에게 생기를 불어넣으시리라 — 부활의 소망."],["창 15:6","\"아브람이 여호와를 믿으니 여호와께서 이를 그의 의로 여기시고\" — 구약의 칭의."]],"hubs":["H08","H13"],"rel":[["2-09","율법 아래에서도 그리스도를 보았다는 점."],["2-11","그러면서도 남는 두 언약의 차이."],["3-02","믿음의 정의 — 구약 성도들의 믿음."]]},{"t":"c","id":"2-11","b":2,"n":11,"label":"두 언약의 차이","title":"두 언약의 차이","one":"차이는 실질이 아니라 관리 방식에 있으며, 다섯 가지로 정리된다.","core":"구약과 신약이 본질에서 하나라면 왜 차이가 보이는가. 칼빈은 그 차이가 언약의 실질이 아니라 관리 방식에 있다고 답한다. 첫째, 구약에서는 아직 어린 상속자에게 주인처럼 땅의 복이 주어졌고 신약에서는 하늘의 것이 드러났다. 둘째, 구약은 의식과 그림자로 그리스도를 가리켰고 신약은 그리스도를 바로 보여 준다. 셋째, 구약은 문자요 신약은 영이다. 넷째, 구약은 종의 자리요 신약은 자유의 자리다. 다섯째, 구약은 한 민족에게, 신약은 모든 민족에게 주어졌다. 다만 이 다섯 가지는 절대적이지 않아서, 구약에도 성령의 은혜가 풍성히 있었음을 칼빈은 놓치지 않는다.","secs":[["1-3","옛 언약과 새 언약의 다섯 가지 차이 — 이는 실질보다 관리 방식에 속한다. 첫째 차이와 그 증명 — 갈라디아서 4:1의 어린 상속자의 비유. 족장들이 땅의 복을 더 값지게 여기고 형벌을 두려워한 이유."],["4-5","둘째 차이 — 구약은 의식 아래 그리스도를 예표했고 신약은 그 진리와 온전한 몸을 그대로 보여 준다. 에베소서의 논지와, 율법이 그리스도께로 인도하는 초등교사라는 점."],["6","그럼에도 율법 아래 있었던 자들 가운데 가장 강력한 신앙의 예들이 있으며, 그리스도인 가운데서도 그만한 이를 거의 찾기 어렵다."],["7-8","셋째 차이 — 구약은 문자요 신약은 영이다. 이 차이를 먼저 일반적으로 고찰하고, 사도의 본문을 주의 깊게 살펴 특별히 다룬다. 세 가지 대조 — 구약은 문자적이고 죽이는 것이며 임시적이고, 신약은 영적이고 살리는 것이며 영구적이다."],["9-10","넷째 차이 — 구약은 종의 자리에, 신약은 자유의 자리에 속한다. 세 구절로 확증하고 두 반론에 답한다. 마지막 세 차이와 첫째 차이의 구별, 아우구스티누스의 확증, 구약 아래 족장들의 처지."],["11-12","다섯째 차이 — 구약은 한 백성에게만, 신약은 모든 민족에게 주어졌다. 이방인의 부르심에 관한 논의와, 그것이 사도에게 문제가 된 이유."],["13-14","두 반론 — 하나님이 변하지 않으시므로 한 번 명하신 것을 나중에 기뻐하지 않으실 수 없다는 반론, 하나님이 처음부터 유대인을 지금 그리스도인과 같이 대하실 수 있었다는 반론. 두 반론의 어리석음을 밝힌다."]],"vs":[["갈 4:1-3","어린 상속자는 주인이지만 종과 다를 바 없다 — 구약의 미성숙."],["히 8:6","\"더 아름다운 언약의 중보자\" — 더 나은 언약."],["요 1:17","\"율법은 모세로 말미암아 주어졌고 은혜와 진리는 예수 그리스도로 말미암아\""],["엡 2:14-16","중간에 막힌 담을 허시고 둘로 하나를 만드셨다 — 이방인의 부르심."],["롬 11:29","\"하나님의 은사와 부르심에는 후회하심이 없느니라\" — 하나님의 불변성."]],"hubs":["H08"],"rel":[["2-10","두 언약의 유사성."],["2-09","그리스도가 구약에도 알려졌다는 점."],["2-07","율법의 폐지와 성취."]]},{"t":"c","id":"2-12","b":2,"n":12,"label":"중보자의 직무를 이루시려면…","title":"중보자의 직무를 이루시려면 그리스도가 사람이 되셔야 했다","one":"우리의 구원을 위하여 참 하나님이시며 참 사람이신 중보자가 필요했다.","core":"칼빈은 그리스도가 사람이 되어야 했던 이유를 하나님의 작정 안에서 설명한다. 중보자는 하나님과 사람 사이에 서서 양쪽에 속해야 한다. 그가 사람이 되지 않으면 우리의 형제가 되어 우리를 대신할 수 없고, 하나님이 아니시면 우리를 하나님과 화목하게 할 능력이 없다. 그래서 그리스도는 우리의 육신을 입고 완전한 순종을 이루시고 죄의 형벌을 지불하셨다. 이 장은 이어서 오시안더를 비롯한 여러 반론을 다루며 정통 그리스도론을 세운다.","secs":[["1","중보자가 신이시며 사람이 되셔야 한 것은 절대적 필요가 아니라 하나님의 작정에 따른 필요였다. 순결한 사람이나 천사도 이 일을 감당할 수 없었다."],["2","둘째 이유 — 중보자는 지옥의 후사들을 하나님의 자녀로 바꾸어야 했다."],["3","셋째 이유 — 우리의 육신 안에서 완전한 순종을 드리고 하나님의 공의를 만족시키며 죄의 형벌을 지불해야 했다. 넷째 이유."],["4-7","정통 교리에 대한 여러 반론과 그 답변 — 율법의 제사, 선지자와 사도와 복음서의 증언이 이를 확증한다. 두 번째에서 열한 번째 반론까지 차례로 처리한다. 오시안더의 오류 — 아담 안의 하나님의 형상의 본성, 그리스도가 천사와 사람의 머리이신 점에 관한 답변."]],"vs":[["요 1:14","\"말씀이 육신이 되어 우리 가운데 거하시매\" — 성육신."],["히 2:14","자녀들이 혈육에 함께 속하였으므로 그도 함께 속하셨다 — 우리 육신을 입으심."],["히 2:17","\"모든 일에 그 형제들과 같이 되심으로\" — 자비하고 신실한 대제사장."],["갈 4:4-5","\"때가 차매 하나님이 그 아들을 보내사 여자에게서 나게 하시고\" — 성육신의 때."],["딤전 2:5","\"한 하나님, 하나님과 사람 사이에 한 중보자 곧 사람이신 그리스도 예수\" — 참 사람이신 중보자."]],"hubs":["H09","H11"],"rel":[["2-13","참 사람의 본질을 입으셨다는 증명."],["2-14","두 성품과 한 인격."],["2-16","그리스도께서 이루신 구속의 일."]]},{"t":"c","id":"2-13","b":2,"n":13,"label":"그리스도가 참 사람의 본질을 입으셨다","title":"그리스도가 참 사람의 본질을 입으셨다","one":"그리스도는 참 사람이셨고, 그 인성은 우리와 같은 육신이며 다만 죄가 없으시다.","core":"아들과 그리스도가 신성만 가졌다거나 육신의 모양만 가졌다고 주장한 마니교와 마르키온을 칼빈은 반박한다. 그리스도는 다윗의 후손으로 태어나셨고, 자라셨고, 주리셨고, 목마르셨고, 우셨고, 죽으셨다. 이 모든 것은 참 사람의 표지다. 다만 그리스도는 죄가 없으시고, 그 무죄는 우리의 구원에 필요한 조건이었다. 칼빈은 '그리스도가 우리의 육신을 입었다 해도 그 육신은 원죄에 물들지 않았다'고 설명하며, 여러 이단적 반론을 조목조목 답한다. 이 장은 그리스도의 온전한 인성을 지키는 데 목적이 있다.","secs":[["1","그리스도의 참 인성을 반대한 마니교도와 마르키온을 성경으로 논박한다."],["2","이단들의 불경한 반론에 대한 여섯 가지 답변."],["3","다른 여덟 가지 반론에 대한 답변."],["4","다른 세 가지 반론에 대한 답변. 그리스도의 신성은 이미 여러 확실한 증거로 세워졌으므로 여기서는 인성만 다룬다는 전제 아래, 참 사람이 되신 그리스도에 관한 여러 성경 구절을 정리한다."]],"vs":[["눅 24:39","\"내가 바로 그니라 나를 만져 보라 영은 살과 뼈가 없으되\" — 참 몸."],["히 4:15","\"모든 일에 우리와 똑같이 시험을 받은 자로되 죄는 없으시니라\" — 참 인성과 무죄."],["롬 1:3","\"그의 아들에 관하여 말하면 육신으로는 다윗의 혈통에서 나셨고\" — 다윗의 후손."],["갈 4:4","\"여자에게서 나게 하시고\" — 참 사람으로 태어나심."],["롬 8:3","\"자기 아들을 죄 있는 육신의 모양으로 보내어\" — 육신의 모양이 아니라 참 육신."]],"hubs":["H09"],"rel":[["2-12","중보자가 사람이 되셔야 했던 이유."],["2-14","두 성품이 한 인격을 이루는 방식."],["2-01","원죄 — 그리스도에게는 미치지 않는다."]]},{"t":"c","id":"2-14","b":2,"n":14,"label":"두 성품이 어떻게 중보자의 한…","title":"두 성품이 어떻게 중보자의 한 인격을 이루는가","one":"그리스도는 신성과 인성 두 성품으로 한 위격을 이루시며, 두 성품은 섞이지도 나뉘지도 않는다.","core":"이 장은 그리스도론의 정밀한 진술이다. 그리스도는 한 인격 안에 두 성품을 가지신다. 두 성품은 섞이거나 변화되지 않고, 한 인격을 이루되 서로 구별된다. 칼빈은 네스토리우스(두 인격을 나눔)와 유티케스(두 성품을 섞음)를 함께 정죄하고, 세르베투스의 오류를 집중적으로 반박한다. 성경이 그리스도에 대하여 말할 때 어떤 것은 신성에, 어떤 것은 인성에 속한다는 규칙(속성의 교통)을 세워야 한다. 이 교리는 투쟁이 아니라 신앙의 유익을 위해 주어진 것이다.","secs":[["1","그리스도 안의 두 성품 — 사람의 성품과 신적 성품 — 에 대한 증명. 몸과 영혼의 연합을 비유로 들되 그 유비의 한계를 밝힌다."],["2","두 성품을 구별하는 성경 구절과 속성의 교통에 대한 증명."],["3","두 성품의 연합을 보여 주는 성경 구절과, 이 논의에서 지켜야 할 규칙."],["4","두 성품 교리의 유익과 쓰임, 네스토리우스파와 유티케스파 — 둘 다 교회가 정당하게 정죄했다."],["5-8","세르베투스의 여러 이단을 논박한다. 정통 교리의 일반적 요약과 답변, '위격적 연합'의 의미, 두 번째 반론과 답변, 그리스도의 이중 아들됨, 그 밖의 반론들, 그리고 세르베투스의 다른 유해한 이단 — '말씀이 육신이 되었다'는 말을 어떻게 이해해야 하는가."]],"vs":[["요 1:14","\"말씀이 육신이 되어\" — 한 인격 안의 두 성품."],["골 2:9","\"그 안에는 신성의 모든 충만이 육체로 거하시고\" — 참 신성과 참 육체."],["마 16:16","\"주는 그리스도시요 살아 계신 하나님의 아들이시니이다\" — 한 인격의 고백."],["롬 9:5","\"조상들도 그들의 것이요 육신으로 하면 그리스도가 그들에게서 나셨으니\" — 인성과 신성의 병존."],["딤전 3:16","\"하나님이 육신으로 나타나신 바 되시고\" — 성육신의 신비."]],"hubs":["H09"],"rel":[["2-12","중보자의 필요."],["2-13","참 인성의 증명."],["2-15","그리스도의 삼중직으로 이어짐."]]},{"t":"c","id":"2-15","b":2,"n":15,"label":"그리스도의 삼중직 — 선지자와 왕과…","title":"그리스도의 삼중직 — 선지자와 왕과 제사장","one":"그리스도는 우리를 가르치는 선지자, 우리를 다스리는 왕, 우리를 위하여 자신을 드리는 제사장이시다.","core":"칼빈은 그리스도의 직무를 세 가지로 정리한다. 선지자로서 그는 하나님의 뜻을 온전히 계시하시고 우리를 가르치신다. 왕으로서 그는 성령으로 우리를 다스리시고 보호하시며 마침내 승리하신다. 제사장으로서 그는 자신을 제물로 드려 우리를 위하여 화목제물이 되시고 지금도 우리를 위하여 간구하신다. 이 세 직무를 알지 못하면 그리스도를 이름으로만 알 뿐이다. 기름 부음은 이 세 직무에 함께 관련되며, 그리스도인의 왕 같은 제사장 됨도 여기서 나온다.","secs":[["1","이단과 거짓 그리스도인에게 그리스도는 이름뿐이지만, 하나님께 참으로 부르심을 받은 자들은 그를 참 선지자와 왕과 제사장으로 인정한다."],["2","그리스도의 기름 부음은 주로 왕의 직무를 가리키지만 선지자와 제사장의 직무에도 관련된다. 중보자의 위엄과 필요성."],["3-4","그리스도 왕국의 영적 성격에서 그 왕국의 영원함을 추론한다. 이는 교회 전체와 각 지체 모두에 해당한다. 그리스도의 영적 왕국에서 오는 유익 — 영생으로 우리를 일으키심, 구원에 필요한 모든 것으로 우리를 부요하게 하심, 그리고 마귀의 권세를 이기게 하심."],["5","우리 구속자의 기름 부음이 하늘에 속한 것이라는 점, 그 기름 부음의 상징, 사도의 한 구절과 앞에서 인용한 다른 구절들의 조화."],["6","그리스도의 제사장직의 유익을 얻으려면 무엇이 필요한가. 그리스도의 죽으심에서 출발해야 하며, 거기서 그의 간구가 따라온다. 우리가 그리스도 안에서 하나님께 나아가고, 그를 통하여 담대함을 얻는다."]],"vs":[["사 61:1","\"주 여호와의 영이 내게 내리셨으니 이는 여호와께서 내게 기름을 부으사\" — 선지자적 기름 부음."],["신 18:15","\"너의 하나님 여호와께서 너를 위하여 네 형제 가운데서 나 같은 선지자 하나를 일으키시리니\" — 모세 같은 선지자."],["시 2:6","\"내가 나의 왕을 내 거룩한 산 시온에 세웠다 하시리로다\" — 왕의 직무."],["히 10:12-14","그리스도가 한 영원한 제사를 드리시고 하나님 우편에 앉으셨다 — 제사장직."],["히 7:25","\"그가 항상 살아 계셔서 그들을 위하여 간구하심이니라\" — 계속되는 중보."],["벧전 2:9","\"왕 같은 제사장들이요\" — 그리스도 안의 신자의 신분."]],"hubs":["H10"],"rel":[["2-16","그리스도께서 이 직무를 이루신 실제 사건들."],["2-11","제사장직과 속죄."],["3-20","제사장의 간구와 우리의 기도."]]},{"t":"c","id":"2-16","b":2,"n":16,"label":"그리스도께서 죽으심과 부활과…","title":"그리스도께서 죽으심과 부활과 승천으로 구속자의 직무를 이루신 방식","one":"그리스도의 순종과 죽으심과 부활과 승천과 재림이 우리의 구원 전부를 이룬다.","core":"칼빈은 우리에게 필요한 모든 것이 그리스도 안에 있으며, 그것이 어떻게 우리에게 오는지 묻는다. 하나님의 공의와 자비가 어떻게 함께 서는가 — 하나님은 우리를 미워하시면서도 사랑하신다. 그리스도는 우리 대신 저주를 받으셨고, 십자가에서 '하나님께 버린 바 됨'의 극한까지 내려가셨다. 칼빈은 '음부에 내려가셨다'는 신앙고백을 사도신경의 오래된 조항으로서 중요하게 다루며, 그것을 그리스도가 우리 대신 당하신 지옥의 고통으로 해석한다. 이어 부활과 승천과 우편에 앉으심과 재림의 유익을 하나하나 설명한다.","secs":[["1","우리에게 필요한 모든 것이 그리스도 안에 있으며, 그것을 어떻게 얻는가."],["2-4","하나님의 공의와 자비를 어떻게 화해시킬 것인가. 성경이 우리의 비참을 가르치기 위해 쓰는 표현들, 하나님이 우리 안에서 미움의 근거와 사랑의 근거를 모두 찾으신다는 점, 성경과 아우구스티누스의 확증."],["5-6","그리스도로 말미암은 우리의 구속 — 먼저 일반적으로, 그리고 구속이 우리 구주의 사역 전체에 미친다는 점. 그리스도가 왜 십자가에 달리셨는가, 율법에 예표되고 사도와 선지자로 완성된 숨은 교리, 그리스도가 저주가 되셨다는 의미."],["7","그리스도의 죽으심 — 왜 죽으셨는가, 그 죽음에서 오는 유익, 장사되심과 그 유익."],["8-11","음부 강하 — 이 조항이 교회에 점차 소개된 경위, 버려서도 안 되고 앞 조항과 혼동해서도 안 된다는 점. 족장들의 임보(림버스 파트룸)에 관한 터무니없는 해석과 그 우화의 논파. 음부 강하 조항의 더 정확한 해석과 그것이 주는 큰 위로. 성경 구절과 고대 신학자들의 저술로 확증하고 반론을 논파하며 이 교리의 유익을 밝힌다."],["12","그리스도가 두려워하셨다고 말하는 것이 그를 모욕하고 절망을 돌린다는 반론과, 복음서의 진술에 근거한 답변."],["13","그리스도의 부활 — 많은 유익과 함께, 하나님 앞에서 우리의 의가 새롭게 회복되고, 그의 생명이 우리의 생명의 기초가 된다."],["14-16","그리스도의 승천 — 왜 승천하셨는가, 거기서 오는 유익. 아버지 우편에 앉으심의 의미. 승천의 많은 유익 — 아담이 막아 버린 나라에 우리가 들어가게 하심, 아버지께 우리를 위해 간구하심."],["17-18","심판하러 다시 오심 — 그 성격, 산 자와 죽은 자를 심판하실 그들, 모순되어 보이는 구절들의 조화, 심판의 방식. 그리스도의 재림 교리의 유익과, 사도신경을 어떻게 볼 것인가에 대한 설명."],["19","결론 — 그리스도 안에 택한 자의 구원이 모든 부분에서 포함되어 있다. 지금까지 말한 모든 것이 그리스도께로 모인다."]],"vs":[["사 53:5-6","\"그가 찔림은 우리의 허물 때문이요\" — 대속의 고난."],["갈 3:13","\"그리스도께서 우리를 위하여 저주를 받은 바 되사\" — 저주를 대신 지심."],["고후 5:21","\"하나님이 죄를 알지도 못하신 자로 우리를 대신하여 죄를 삼으신 것은\" — 우리의 의가 되게 하심."],["롬 4:25","\"예수를 우리의 범죄 때문에 죽음에 내어 주셨고 우리를 의롭다 하시기 위하여 살리셨느니라\" — 죽으심과 부활."],["엡 1:20-22","그리스도를 하나님 우편에 앉히시고 만물 위에 머리가 되게 하셨다 — 승천과 통치."],["마 25:31-32","인자가 영광 중에 모든 천사와 함께 올 때에 — 재림."]],"hubs":["H11","H10","H20"],"rel":[["2-15","삼중직 — 이 사건들이 그 직무의 실현이다."],["2-17","그리스도의 공로."],["3-25","최후의 부활 — 그리스도의 부활과 우리의 부활."]]},{"t":"c","id":"2-17","b":2,"n":17,"label":"그리스도께서 우리를 위하여 은혜와…","title":"그리스도께서 우리를 위하여 은혜와 구원을 얻으셨다고 옳게 말할 수 있다","one":"그리스도는 우리의 구원을 값없이 주시는 분이시며, 동시에 그 구원을 우리를 위하여 참으로 얻으신 분이다.","core":"칼빈은 '그리스도의 공로'라는 말을 조심스럽게 다룬다. 어떤 이들은 공로를 말하면 은혜가 흐려진다고 걱정하지만, 성경은 그리스도가 우리를 위하여 순종하시고 죽으셨으며 그로 말미암아 은혜가 주어졌다고 가르친다. 칼빈의 요점은 이것이다 — 그리스도의 공로는 하나님의 값없는 사랑에서 나온 것이며, 우리 공로의 근거가 아니라 하나님의 약속의 근거다. 그래서 성도는 자신의 공로를 자랑하지 않고 그리스도의 공로에 의지한다. 스콜라 신학자들이 이 주제를 다루는 방식은 이 진리를 흐린다.","secs":[["1","그리스도는 구원의 사역자일 뿐 아니라 저자와 왕이시다. 이 표현이 하나님의 은혜를 흐리지 않는다는 점과, 그리스도의 공로가 무엇을 뜻하는지."],["2","두 가르침이 양립한다는 점을 여러 성경 구절로 증명한다."],["3","그리스도는 그의 순종으로 참으로 우리를 위하여 하나님의 은혜를 얻으셨다."],["4-5","이 은혜가 그리스도의 피 흘리심과 죽기까지 하신 순종으로 얻어졌다. 이런 방식으로 그는 우리의 몸값을 지불하셨다."],["6","스콜라 신학자들이 이 주제를 다루는 거만한 방식. 보충으로 살펴야 할 질문 — 어떤 이들은 사람의 구원을 너무 자신에게 돌린다."]],"vs":[["빌 2:8","\"자기를 낮추시고 죽기까지 복종하셨으니 곧 십자가에 죽으심이라\" — 순종의 공로."],["롬 5:18-19","한 사람의 순종하심으로 많은 사람이 의인이 되리라."],["히 5:9","\"그가 온전함을 이루어 자기에게 순종하는 모든 자에게 영원한 구원의 근원이 되시고\""],["막 10:45","\"인자가 온 것은 섬김을 받으려 함이 아니라 도리어 섬기려 하고 자기 목숨을 많은 사람의 대속물로 주려 함이니라\""],["엡 1:7","\"우리는 그리스도 안에서 그의 은혜의 풍성함을 따라 그의 피로 말미암아 구속 곧 죄 사함을 받았느니라\""]],"hubs":["H11","H16"],"rel":[["2-16","구속의 사건들."],["3-11","칭의 — 그리스도의 공로가 우리에게 전가되는 방식."],["3-15","행위의 공로 비판과 대조."]]},{"t":"c","id":"3-01","b":3,"n":1,"label":"그리스도의 유익은 성령의 비밀한…","title":"그리스도의 유익은 성령의 비밀한 사역으로 우리에게 적용된다","one":"성령은 우리를 그리스도와 묶는 끈이며, 그리스도의 모든 유익은 성령의 은밀한 사역으로 우리 것이 된다.","core":"2권이 그리스도 안에 있는 구원을 다루었다면, 3권은 그 구원이 어떻게 우리 것이 되는가를 묻는다. 칼빈의 답은 성령이다. 성령은 그리스도와 우리를 묶는 끈이며, 믿음도 성령이 우리 마음에 일으키시는 역사다. 그리스도에게 충만히 계신 성령의 은사가 우리에게 흘러 들어오는 통로가 성령의 사역이다. 칼빈은 성령의 여러 이름 — 양자의 영, 보증과 인, 물, 생명, 기름과 부음, 불, 샘 — 을 하나하나 풀어 그 사역의 풍성함을 보여 준다. 그래서 신학은 그리스도를 아는 데서 멈추지 않고, 성령이 그 지식을 살아 있는 신앙으로 만드시는 자리로 들어간다.","secs":[["1","성령은 우리를 그리스도와 연합시키는 끈이다. 그 연합의 결과로 믿음이 생기며, 그 믿음은 성령의 은밀한 사역으로 말미암는다."],["2","중보자 그리스도 안에는 성령의 은사가 충만히 있다. 그 은사가 무엇을 위함인지, 성령이 왜 그리스도의 영이라 불리시는지."],["3","성령의 여러 칭호 — 양자의 영, 보증과 인, 물, 생명, 기름과 부음, 불, 샘. 각 칭호가 성령의 어떤 사역을 드러내는지."],["4","믿음은 성령의 특별한 사역이므로, 성령의 능력과 효력이 흔히 믿음에게 돌려진다. 이제 우리는 여기서부터 성령의 사역을 따라가야 한다."]],"vs":[["요 14:16-17","아버지께서 다른 보혜사를 보내사 영원토록 너희와 함께 있게 하시리라."],["롬 8:9","\"그리스도의 영이 없으면 그리스도의 사람이 아니라\" — 성령과 그리스도의 소유."],["롬 8:15","\"양자의 영을 받았으므로 아빠 아버지라고 부르짖느니라.\""],["고전 12:13","\"우리가 다 한 성령으로 세례를 받아 한 몸이 되었고\" — 성령의 연합."],["엡 1:13-14","성령은 우리의 기업을 보증하시는 인이시다."]],"hubs":["H12","H13"],"rel":[["3-02","성령이 일으키시는 믿음의 본질."],["3-03","믿음에서 나오는 회개와 중생."],["4-14","성령이 성례 안에서 역사하시는 방식"]]},{"t":"c","id":"3-02","b":3,"n":2,"label":"믿음 — 그 정의와 고유한 속성","title":"믿음 — 그 정의와 고유한 속성","one":"믿음은 성령으로 말미암아 하나님의 선하신 뜻을 확실히 아는 지식이며, 그 지식은 마음에 인쳐진 신뢰다.","core":"이 장은 믿음론의 정밀한 진술이다. 칼빈은 맹목적인 순종을 믿음이라 부르는 스콜라의 암묵적 신앙을 먼저 반박한다. 믿음은 하나님의 뜻을 아는 지식이며, 그 지식은 단순한 동의가 아니라 확실하고 견고한 것이다. 그러나 그 확실성은 우리의 이성에서 오지 않고 성령의 증거에서 온다. 믿음은 하나님의 선하심과 약속 위에 서고, 그 약속의 중심은 그리스도다. 그래서 믿음은 의심과 싸우는 신뢰이며, 두려움과 함께 자라면서도 끝내 넘어지지 않는다. 이 장의 정의가 개혁파 신앙고백의 믿음 이해를 이루었다.","secs":[["1","지금까지의 논의를 간단히 정리하고 이 장의 주제를 밝힌다. 믿음의 교리를 다루어야 할 필요성."],["2-5","암묵적 신앙의 교리를 반박한다 — 믿음은 하나님의 뜻을 아는 지식인데, 그 교리는 믿음을 파괴한다. 많은 것이 암묵적으로 믿어질 수 있으나, 믿음은 하나님과 그리스도를 아는 지식에 있다. 우리 믿음이 암묵적이라 불릴 수 있는 의미와 사도들과 거룩한 여인들의 예. 어떤 이에게 암묵적 믿음은 믿음의 준비로 있을 수 있으나, 스콜라의 암묵적 신앙과는 전혀 다르다."],["6-10","하나님의 말씀은 믿음과 관련되어 그 근원이며 기초다. 믿음이 말씀 가운데서 특히 무엇을 바라보는가 — 그리스도 안에서 값없이 주어지는 은혜의 약속. 형성된 믿음과 형성되지 않은 믿음이라는 스콜라의 구별은 믿음의 본성으로 반박된다. 바울의 한 구절에서 나온 반론에 대한 답과, 믿음이라는 말에 여러 뜻이 있음을 놓친 스콜라의 오류. 한때 믿는 자들, 위선자들의 믿음."],["11-13","믿음이 버림받은 자에게도 돌려 말해지는 이유와, 그들에게 있는 은혜의 인식, 그리고 그들이 택한 자와 구별되는 점. 버림받은 자에게 믿음이 임시적인 이유, 택한 자에게 확고하고 영구적인 이유. 믿음이라는 말의 여러 쓰임."],["14-20","믿음의 정의를 여섯 부분으로 나누어 설명한다. 정의에서 말하는 지식의 의미, 그 지식이 왜 확실하고 견고해야 하는지 — 우리의 연약함과 하나님의 확실성에서 오는 이유. 그 확실성의 요점과 열매, 참 믿는 자에 대한 묘사. 이 확실성에 대한 반론과 다윗의 예로 확증, 믿는 자의 영혼 안에서 육체와 영이 싸우는 갈등에 대한 설명. 전체적으로 택한 자의 믿음은 확실하고 의심할 여지가 없다는 확증."],["21-27","믿음의 본성에 대한 자세한 설명 — 믿는 자가 두려움에 흔들릴 때 자비하신 하나님의 품으로 돌아간다. 악인에 대한 하나님의 심판을 생각할 때 생기는 두려움과 그것을 믿음이 이기는 방식. 경외함으로 구원을 이루라는 사도의 권면과 어긋나지 않는다 — 두려움과 믿음은 서로 돕는 사이다. 불신이 섞인 확신을 꿈꾸는 이들의 오류를 반박한다. 베르나르의 한 구절로 확증. 참된 두려움이 생기는 두 가지 방식 — 하나님을 아버지로 공경할 때와 주로 두려워할 때. 요한일서의 한 구절에 대한 반론과, 자녀의 두려움과 종의 두려움의 구별로 답한다."],["28-32","믿음이 하나님의 선하신 뜻을 바라본다는 말의 의미와 그 뜻에 포함되는 것. 믿음의 기초인 값없는 약속, 복음 안에서 그 값없는 약속을 찾는 믿음은 나뉘지 않는다는 점. 하나님의 말씀은 믿음의 버팀목이자 뿌리이며, 말씀은 하나님의 선하심과 자비를 증언한다. 모든 약속이 그리스도 안에 포함된다 — 두 반론과 사람들의 예에서 온 세 번째 반론에 대한 답."],["33-43","믿음은 성령으로 우리 마음에 계시되고 인쳐진다 — 마음이 깨끗해져 하나님의 것을 맛보게 된다. 그 증명 — 이성과 성경과 예와 유비로, 그리고 믿음의 탁월한 성질과 아우구스티누스의 유명한 구절로. 성령이 인과 보증과 약속의 영이라 불리는 이유. 믿는 자도 흔들리지만 끝내 멸망하지 않고 시험을 이기고 서 있다는 증명. 스콜라의 반론과 전도서의 한 구절로 그 반론을 지지하려는 시도에 대한 답. 택한 자를 경솔하고 주제넘다고 고발하는 반론과, 택한 자의 마지막까지 견딤을 공격하는 반론에 대한 답. 믿음의 정의는 히브리서에서 사도가 준 정의와 일치한다. 소망은 참된 믿음에 inseparable하게 따르는 동반자이며, 믿음과 소망은 서로를 붙든다. 이 두 말이 때로 혼용되며, 소망에 두 기초를 돌리는 스콜라의 주장은 반박된다."]],"vs":[["히 11:1","\"믿음은 바라는 것들의 실상이요 보지 못하는 것들의 증거니\" — 믿음의 정의."],["롬 10:17","\"믿음은 들음에서 나며 들음은 그리스도의 말씀으로 말미암았느니라\" — 말씀과 믿음."],["엡 2:8","\"너희는 그 은혜에 의하여 믿음으로 말미암아 구원을 받았으니\" — 믿음도 선물."],["고후 4:13","\"우리가 같은 믿음의 정신을 가졌으므로\" — 믿음의 확신."],["롬 8:38-39","\"내가 확신하노니 사망이나 생명이나…… 우리를 우리 주 그리스도 예수 안에 있는 하나님의 사랑에서 끊을 수 없으리라\" — 확실성."],["막 9:24","\"내가 믿나이다 나의 믿음 없는 것을 도와 주소서\" — 믿음과 불신의 싸움."]],"hubs":["H13"],"rel":[["3-01","성령이 일으키시는 믿음."],["3-03","믿음에서 나오는 회개."],["3-11","믿음이 칭의를 받아들이는 방식."],["3-20","기도 — 믿음의 영구한 훈련."]]},{"t":"c","id":"3-03","b":3,"n":3,"label":"믿음으로 인한 중생 — 회개","title":"믿음으로 인한 중생 — 회개","one":"회개는 믿음에서 나오는 삶의 돌이킴이며, 죄를 미워하고 하나님께로 돌아서는 전 생애의 일이다.","core":"칼빈은 회개를 믿음과 분리하지도, 혼동하지도 않는다. 회개는 믿음에서 나오지만 믿음 그 자체는 아니다. 회개는 하나님께로 돌이키는 삶의 변화이며, 하나님을 경외함에서 나오고, 육신의 죽임과 영의 살림으로 이루어진다. 그것은 한순간에 완성되지 않고 평생 계속된다. 그래서 신자는 날마다 자기 부패를 깨닫고 돌이킨다. 칼빈은 이어서 회개의 열매와 고백, 그리고 성령을 훼방하는 죄를 다룬다. 회개는 값싼 후회가 아니라 은혜가 사람을 실제로 바꾸는 사건이다.","secs":[["1-4","회개는 믿음에 뒤따르며 믿음이 낳는다. 세 가지 반대 견해 — 회개의 기원을 믿음에 돌리는 것을 오해하는 견해, 회개를 믿음과 같은 것으로 보는 견해, 율법적 회개와 복음적 회개 두 형태를 두는 견해를 차례로 검토한다."],["5-9","정통 교리 — 믿음과 회개는 구별되지만 분리되지 않는다. 회개는 세 부분으로 설명된다. 첫째, 회개는 우리 삶을 하나님께로 돌이키는 일이다. 둘째, 회개는 하나님을 경외함에서 생긴다 — 선지자와 사도가 하나님의 심판을 말하는 이유. 셋째, 회개는 육신의 죽임과 영의 살림으로 이루어지며, 이는 하나님의 형상을 우리 안에 새롭게 하는 일이다. 회개는 한순간에 완성되지 않는다."],["10-13","회개가 왜 이렇게 넓어야 하는지, 중생한 자에게 남은 정욕에 대한 아우구스티누스의 견해 검토. 하나님이 정죄하시는 것은 본성 자체가 아니라 하나님의 질서에 거스르는 정욕이다. 아우구스티누스가 이 견해를 가졌음을 보여 주는 구절들과 야고보서의 반론."],["14","재세례파와 리버틴이 현세의 회개가 계속되어야 한다는 점을 반대하는 데 대한 답변 — 그들의 주장이 얼마나 해로운지 드러난다."],["15-20","회개의 열매 — 근신함과 변명하지 않음과 분개함과 두려움과 사모함과 열심과 징계함. 지혜롭게 지켜야 할 절제. 회개의 내적 열매 — 하나님께 대한 경건, 사람에 대한 사랑, 삶의 순결. 이 외적 훈련을 회개의 으뜸으로 여기는 이들의 착각과, 유대 교회에서 그것이 받아들여진 이유. 회개의 으뜸 되는 부분은 하나님께로 돌이키는 것이며, 거기에 죄의 고백과 자백이 따른다. 회개의 목적은 세례 요한과 그리스도와 사도들의 선포가 보여 준다. 그리스도인의 회개는 죽을 때까지 끝난다."],["21-25","회개는 하나님이 택한 자에게 주시는 은혜에서 시작된다. 성령을 훼방하는 죄 — 그 죄의 참된 정의와, 그 죄를 범하는 자가 누구인가. 그 죄가 용서받을 수 없는 이유, 노바티안파가 사도의 말을 왜곡한 논법, 에서의 예와 어떤 선지자의 경고에서 나온 난점, 아합처럼 경건하지 않은 자의 거짓 회개를 성경이 승인하는 듯 보이는 문제에 대한 답."]],"vs":[["행 2:38","\"회개하고 너희 각 사람이 예수 그리스도의 이름으로 세례를 받아\" — 회개와 세례."],["요엘 2:12-13","\"너희는 이제라도 금식하고 울며 애통하고 마음을 다하여 내게로 돌아오라\" — 회개의 본질."],["고후 7:10","\"하나님의 뜻대로 하는 근심은 후회할 것이 없는 구원에 이르게 하는 회개를 이루는 것이요\" — 참된 근심."],["골 3:5","\"땅에 있는 지체를 죽이라 곧 음란과 부정과 사욕과 악한 정욕과 탐심이니\" — 육신의 죽임."],["엡 4:22-24","옛 사람을 벗고 새 사람을 입으라 — 회개의 두 방향."],["마 12:31-32","성령을 훼방하는 죄는 이 세상에서도 오는 세상에서도 용서받지 못한다."]],"hubs":["H14","H15"],"rel":[["3-02","믿음과 회개의 관계."],["3-04","스콜라 회개론(고해) 비판."],["3-05","면죄부와 연옥."],["3-06","중생한 삶의 구체적 모습."]]},{"t":"c","id":"3-04","b":3,"n":4,"label":"스콜라 신학의 고해 — 성경의…","title":"스콜라 신학의 고해 — 성경의 회개와 얼마나 다른가","one":"고해·만족·면죄라는 제도는 성경의 회개를 세 가지로 쪼개어 그리스도의 은혜를 흐린다.","core":"칼빈은 스콜라 신학의 회개론을 조목조목 해부한다. 그들은 회개를 통회와 고해와 만족의 세 부분으로 나누고, 모든 죄를 사제에게 고백하지 않으면 구원이 없다고 가르쳤다. 칼빈은 그 첫째로 성경이 요구하는 회개의 성격을 왜곡한다고 지적한다. 둘째로 모든 죄를 빠짐없이 고백하는 것은 불가능하고, 그 의무는 양심을 절망이나 위선으로 몰아간다. 셋째로 사제의 열쇠 권세는 사도의 계승이 아니라 말씀의 사역에 있다. 넷째로 인간의 만족이라는 개념이 그리스도의 유일한 제사를 흐린다. 이 장은 종교개혁의 회개론이 무엇을 회복하려 했는지 선명하게 보여 준다.","secs":[["1-3","스콜라 신학자들의 회개 교리의 오류 — 정의에서의 오류와 네 가지 정의 검토. 통회에 대한 그들의 견해와 그 검토. 참되고 진실한 통회란 무엇인가."],["4-8","귀고백(사제에게 죄를 고백하는 일) — 그것이 하나님의 권위에서 온 것인가. 교회법학자와 스콜라의 논증, 유다의 예에서 나온 우의적 논증과 성경 두 구절에서 나온 논증에 답한다. 고해가 하나님의 권위에서 온 것이 아니며 그 사용이 그리스도 이후 거의 천이백 년 동안 자유로웠다는 증명. 크리소스토무스도 이 방식을 승인하지 않았다."],["9-14","거짓 고해가 논파된 뒤, 하나님의 말씀이 명하는 고백을 다룬다. 하나님께 비밀히 하는 고백의 효력. 사람에게 하는 고백의 두 형태 — 공적 고백과 사적 고백, 그리고 각각의 쓰임. 사적 고백의 두 종류 — 자기 자신을 위한 것과 이웃을 위한 것. 그리스도께서 권하신 것은 무엇인가. 이 세 가지 고백에서 열쇠의 권세가 어떻게 쓰이는가."],["15-24","로마 가톨릭의 고해 오류 — 모든 죄를 고백해야 한다는 의무, 허구의 열쇠, 사제의 판결권. 첫째 오류에 대한 반박 — 모든 죄를 그렇게 고백하는 것이 불가능함을 다윗의 증언과 양심의 증언으로 보인다. 그 엄격한 의무가 절망이나 위선으로 이끈다. 고해가 해롭지 않고 유익하다는 반론에 대한 답 — 그 안에 깃든 위선과 거짓과 불경건을 드러낸다. 둘째 오류에 대한 반박 — 사제는 사도의 계승자가 아니며, 홀로 주관하시는 성령을 그들은 갖지 못했다. 셋째 오류에 대한 반박과 그에 대한 변명의 해부. 넷째 오류에 대한 반박 — 교회의 권징을 거꾸로 세운다. 이 허구의 고해에 대한 결론."],["25-39","만족 — 스콜라 신학자들이 회개의 셋째 자리에 놓은 것. 그 오류와 허구, 그리고 그리스도의 은혜와 효력을 좁은 한계에 가두는 반론, 요한과 세례 요한의 증언으로 답한다. 만족이라는 허구가 그리스도의 영광을 깎고 양심의 평안을 빼앗는다. 경한 죄와 중한 죄를 나누는 자의적 구별, 죄책과 그 형벌을 나누는 구별에 대한 답, 그리스도의 죽으심의 효력과 율법의 제사에서 오는 답과 우리의 참된 만족. 하나님의 징계에 관한 두 가지 구별과 이 교리가 신자에게 주는 두 가지 쓰임. 다윗의 형벌에 대한 반론과 그 밖의 다섯 구절에 근거한 반론들, 교부들의 구절에 근거한 반론에 대한 답. 이 만족들은 하나님의 보좌가 아니라 교회의 평안과 관계되었다 — 스콜라 신학자들이 그 뜻을 뒤집었다."]],"vs":[["시 32:5","\"내가 이르기를 내 허물을 여호와께 자복하리라 하고\" — 하나님께 하는 고백."],["요일 1:9","\"만일 우리가 우리 죄를 자백하면 그는 미쁘시고 의로우사 우리 죄를 사하시며\" — 자백의 약속."],["마 16:19","\"무엇이든지 네가 땅에서 매면 하늘에서도 매일 것이요\" — 열쇠의 권세."],["히 10:14","그리스도가 한 제사로 거룩하게 된 자들을 영원히 온전하게 하셨다 — 만족의 유일성."],["시 130:3-4","\"여호와여 주께서 죄악을 지켜보신다면 주 앞에 누가 서리이까\" — 모든 죄의 고백이 불가능함."],["골 2:13-14","우리의 죄를 용서하시고 우리에게 거스르는 증서를 도말하셨다 — 만족의 완결성."]],"hubs":["H14","H23"],"rel":[["3-03","성경의 회개."],["3-05","면죄부와 연옥 — 만족의 제도화."],["3-11","칭의 — 그리스도의 의만 의지함."],["4-12","교회의 권징과 열쇠의 바른 사용."]]},{"t":"c","id":"3-05","b":3,"n":5,"label":"만족을 보충하려는 방식들 —…","title":"만족을 보충하려는 방식들 — 면죄부와 연옥","one":"면죄부와 연옥은 그리스도의 만족이 충분하지 않다는 가정 위에 세워진 제도이며, 성경의 근거가 없다.","core":"면죄부는 인간의 만족이라는 교리에서 태어났다. 칼빈은 그 제도가 그리스도의 피의 공로를 값으로 사고파는 일이 되었다고 비판한다. 교회의 보물 창고라는 개념, 성인들의 공로가 남아 그것으로 죄의 형벌을 면제한다는 발상은 성경에 근거가 없다. 이어서 연옥 교리를 다룬다. 연옥은 성경이 말하지 않는 곳이며, 그 교리를 지지하려 동원된 구절들(용서받지 못할 죄, 무릎을 꿇는 모든 것, 마카베오의 예, 불로 시험하는 날)은 모두 다른 뜻을 가진다. 칼빈은 이 두 제도가 양심을 붙들지 못하고 오히려 공포와 이익을 낳는다고 본다.","secs":[["1-5","만족이라는 교리가 면죄부의 어머니다. 면죄부의 허무함과 그 이유, 교황과 그를 따르는 자들의 탐욕. 스콜라 신학자들이 말하는 면죄부의 견해와 그 실제 성격, 일곱 구절로 반박. 로마 주교 레오의 증언과 아우구스티누스로도 확인된다. 사도의 한 구절을 면죄부의 근거로 내세우는 시도에 대한 두 번째 답. 교황의 부패한 이익 추구와 면죄부의 기원."],["6-10","로마 가톨릭의 허구인 연옥을 검토한다 — 사물의 성격에서, 하나님의 권위에서, 그리고 성경의 증거에서. 연옥을 지지하려 인용한 구절들의 해설 — 용서받지 못할 죄, 땅과 땅 아래의 모든 것이 무릎을 꿇는 것, 유다 마카베오가 제사를 드린 예, 모든 사람의 공적을 시험하는 불. 고대 신학자들의 견해와 그에 대한 귀류법적 반박. 연옥 교리는 오래되었으나 더 오래된 사도에게 반박되며, 고대 저술가들과 성경 어디에도 근거가 없다."]],"vs":[["마 12:32","성령을 훼방하는 죄는 이 세상에서도 오는 세상에서도 사함을 받지 못한다 — 연옥의 근거가 되지 못한다."],["빌 2:10","하늘과 땅과 땅 아래의 모든 것이 무릎을 꿇는다 — 심판과 경배의 보편성."],["고전 3:13-15","각 사람의 공적이 불로 시험된다 — 연옥이 아니라 마지막 심판의 시험."],["히 1:3","그리스도가 죄를 정결하게 하시고 높은 곳에 앉으셨다 — 정결함이 완성되었다."],["눅 23:43","\"오늘 네가 나와 함께 낙원에 있으리라\" — 중간 상태에 연옥이 없다."]],"hubs":["H14","H23"],"rel":[["3-04","만족 교리의 뿌리."],["3-11","그리스도의 의만으로 서는 칭의."],["4-18","미사 — 그리스도의 제사를 반복하는 문제."]]},{"t":"c","id":"3-06","b":3,"n":6,"label":"그리스도인의 삶 — 성경이 그…","title":"그리스도인의 삶 — 성경이 그 삶으로 부르는 이유","one":"하나님이 거룩하시고 우리가 그의 백성이므로, 그리스도인은 거룩한 삶으로 부름받았다.","core":"칼빈은 중생 다음에 그리스도인의 삶을 다룬다. 왜 우리가 거룩하게 살아야 하는가. 첫째, 하나님이 거룩하시기 때문이다. 둘째, 우리가 그리스도와 연합했기 때문이다. 셋째, 하나님이 우리를 구속하셨기 때문이다. 칼빈은 성경의 도덕 체계가 철학자의 윤리보다 탁월한 이유를 설명하고, 그리스도인의 삶에 대한 다섯 가지 권면을 제시한다. 이 장은 신앙이 교리로 끝나지 않고 삶으로 이어져야 한다는 개혁파의 강조를 대표한다. 다만 칼빈은 이 삶이 우리의 공로가 아니라 은혜의 열매임을 잊지 않는다.","secs":[["1","중생의 교리와 이 장의 연결. 그리스도인의 삶에 관한 교리의 필요성과 그 요약."],["2","첫째 구분 — 개인적 거룩. 하나님이 거룩하시기 때문이며, 우리가 그의 성도들과 교통하기 때문이다."],["3","둘째 구분 — 우리의 구속과 관련된 것. 성경의 놀라운 도덕 체계와, 그리스도인의 삶으로 이끄는 다섯 가지 특별한 권면."],["4","그리스도인의 삶에 반대하는 거짓 그리스도인들을 꾸짖는다 — 그들은 그리스도를 참으로 배우지 않았고, 복음이 그들의 인도자가 되지 못했다."],["5","그리스도인은 낙심하지 말아야 한다 — 하나님의 말씀을 인도자로 삼고, 진실하게 의를 닦으며, 은혜 안에서 자라기를 구하면 된다."]],"vs":[["레 11:44","\"나는 여호와 너희 하나님이니 너희는 스스로 거룩하게 하고 거룩하라\" — 거룩의 근거."],["벧전 1:15-16","\"너희를 부르신 이가 거룩하시므로 너희도 온갖 행실이 거룩하라\" — 부르심과 거룩."],["마 5:48","\"그러므로 하늘에 계신 너희 아버지의 온전하심과 같이 너희도 온전하라\""],["고후 7:1","\"이 약속을 가진 우리는 하나님을 두려워하는 가운데서 거룩함을 온전히 이루어\" — 약속과 거룩."],["딛 2:11-12","\"모든 사람에게 구원을 주시는 하나님의 은혜가 나타나 우리를 양육하시되\" — 은혜가 거룩을 가르친다."]],"hubs":["H15"],"rel":[["3-03","회개와 중생."],["3-07","자기 부인 — 삶의 요약."],["3-08","십자가를 지는 삶."],["3-10","현세의 사용."]]},{"t":"c","id":"3-07","b":3,"n":7,"label":"그리스도인의 삶의 요약 — 자기 부인","title":"그리스도인의 삶의 요약 — 자기 부인","one":"우리는 우리 자신의 것이 아니므로, 하나님의 영광과 이웃의 유익을 구하는 삶을 산다.","core":"칼빈은 그리스도인의 삶의 요약을 자기 부인으로 제시한다. 우리는 우리 자신의 것이 아니라 하나님의 것이며, 그래서 우리의 삶의 목적은 하나님의 영광이다. 자기 부인은 이웃을 향한 사랑에서 구체적으로 드러난다. 우리는 이웃을 자기 몸과 같이 사랑해야 하며, 그 사랑에는 인내와 겸손과 온유와 절제가 따른다. 하나님을 향한 자기 부인은 모든 일을 그의 손에서 받아들이는 평정과 겸손으로 나타난다. 마지막으로 칼빈은 우리의 모든 삶을 하나님께 맡기고 그분의 섭리에 의지하는 태도를 권한다. 이 장은 개혁파 경건의 윤리적 정점이다.","secs":[["1","그리스도인의 삶의 둘째 일반 구분. 그 시작과 요약 — 두 가지 관련, 곧 우리는 우리 자신의 것이 아니며 하나님의 것이라는 점."],["2","우리가 우리 자신의 것이 아니므로 하나님의 영광을 구하고 그의 뜻에 순종해야 한다. 그리스도의 제자들에게 권해진 자기 부인."],["3","삶에서 따를 세 가지와 피할 두 가지 — 불경건과 세상 정욕을 버리고, 절제와 공의와 경건을 따르라."],["4","자기 부인은 바울의 가르침의 요약이며 가장 어렵다. 그것을 어렵게 만드는 우리의 성질들과 그 치료 — 교만, 야망, 탐욕."],["5-7","이웃의 유익을 구하는 일 — 자기 부인이 가장 필요하고 가장 어려운 자리. 두 가지 치료. 사랑에는 인내와 친절이 따라야 하며, 이웃 안에서 하나님의 형상을 보아야 한다. 사랑 없이는 그리스도인의 삶이 존재할 수 없고, 사랑을 해치는 악에 대한 치료 — 자비, 겸손, 정숙, 온유."],["8-10","하나님과 관련된 자기 부인은 평정과 인내로 이끈다 — 우리는 언제나 하나님께 속해 있다. 하나님의 복이 없이 부와 명예를 탐하지 않고, 악한 자의 방법을 따르지 않으며, 우리의 모든 염려를 하나님께 맡긴다. 우리 자신을 전적으로 하나님께 맡겨야 한다는 교리의 필요성과, 환난의 여러 쓰임, 이방인들이 그것을 남용하고 곡해한 점."]],"vs":[["롬 12:1-2","\"너희 몸을 하나님이 기뻐하시는 거룩한 산 제물로 드리라\" — 자기 부인의 근거."],["갈 2:20","\"이제는 내가 사는 것이 아니요 오직 내 안에 그리스도께서 사시는 것이라\" — 자기 부인의 핵심."],["빌 2:3-4","\"아무 일에든지 다툼이나 허영으로 하지 말고 오직 겸손한 마음으로\" — 이웃을 먼저."],["마 16:24","\"누구든지 나를 따라오려거든 자기를 부인하고 자기 십자가를 지고 나를 따를 것이니라\""],["고전 10:31","\"너희가 먹든지 마시든지 무엇을 하든지 다 하나님의 영광을 위하여 하라\""]],"hubs":["H15","H17"],"rel":[["3-06","그리스도인의 삶의 근거."],["3-08","자기 부인의 한 갈래 — 십자가."],["3-09","장래 생명에 대한 묵상."],["3-10","현세의 위안을 쓰는 법."]]},{"t":"c","id":"3-08","b":3,"n":8,"label":"자기 부인의 한 갈래 — 십자가를…","title":"자기 부인의 한 갈래 — 십자가를 지는 것","one":"하나님은 십자가로 우리의 교만을 꺾고 순종을 훈련하시며, 우리는 그 손에서 고난을 받는다.","core":"십자가는 그리스도인의 삶에서 선택 사항이 아니라 하나님의 훈련 과정이다. 칼빈은 십자가가 필요한 이유를 다섯 가지로 제시한다. 교만을 꺾고, 하나님께 도움을 구하게 하며, 하나님의 임재를 경험하게 하고, 순종을 훈련하며, 육신의 방종을 다스린다. 그리고 하나님은 우리의 연약함과 지난 허물을 바로잡으시려고 고난을 허락하신다. 칼빈은 특히 의를 위하여 받는 박해의 십자가를 말하며, 고난 가운데서도 그리스도의 모범을 따라 견디는 것이 철학자의 체념과 어떻게 다른지 설명한다. 이 장은 개혁파 고난 신학의 고전이다.","secs":[["1","십자가란 무엇인가 — 누가, 누구에게, 무슨 이유로 지우시는가. 십자가의 필요성과 존귀함."],["2-3","십자가는 교만을 꺾고 우리를 하나님께 나아가게 하려고 필요하다 — 다윗의 예. 하나님이 함께하심을 경험하게 하려는 목적. 십자가의 여러 쓰임 — 인내와 소망과 하나님께 대한 확고한 신뢰를 낳는다."],["4-6","십자가는 순종을 훈련한다 — 아브라함의 예. 육신의 방종을 다스리려고 십자가가 필요하며, 하나님은 우리의 연약함을 허용하시고 지난 허물을 고치셔서 순종 안에 붙드신다."],["7-9","의를 위하여 박해받을 때 주어지는 특별한 위로와 그 내용. 이 십자가는 신자에게 가장 합당하며 기꺼이 즐겁게 지아야 한다 — 그 즐거움은 무감각이 아니다. 이 싸움의 성격 — 스토아학파의 허무맹랑함에 반대하며, 그리스도의 권위와 모본으로 설명한다."],["10-11","택한 자들의 증언과 한결같은 경험, 특히 베드로의 예로 증명한다. 그리스도인의 인내와 철학자의 인내의 구별 — 철학자는 피할 수 없는 필연을 핑계하지만, 그리스도인은 하나님의 아버지 되심을 바라본다."]],"vs":[["마 10:38","\"자기 십자가를 지고 나를 따르지 않는 자도 내게 합당하지 아니하니라\""],["롬 5:3-5","\"환난은 인내를, 인내는 연단을, 연단은 소망을 이루는 줄 앎이로다\" — 십자가의 열매."],["히 12:6","\"주께서 그 사랑하시는 자를 징계하시고\" — 아버지의 징계."],["고후 4:17","\"우리의 잠시 받는 환난의 경한 것이 지극히 크고 영원한 영광의 중한 것을 우리에게 이루게 함이니\""],["벧전 4:13","\"그리스도의 고난에 참여하는 것으로 즐거워하라\" — 박해의 위로."]],"hubs":["H15","H04"],"rel":[["3-07","자기 부인."],["3-09","장래 생명에 대한 묵상 — 고난의 방향."],["1-17","섭리 — 고난을 하나님의 손에서 받음."]]},{"t":"c","id":"3-09","b":3,"n":9,"label":"장래 생명에 대한 묵상","title":"장래 생명에 대한 묵상","one":"하나님은 고난으로 이 세상에 대한 우리의 사랑을 깨뜨리고 하늘의 생명을 바라보게 하신다.","core":"고난의 방향은 하늘이다. 칼빈은 우리가 이 세상의 생명을 지나치게 사랑하기에 하나님께서 고난으로 그 집착을 깨뜨리신다고 말한다. 그러나 그는 현세의 생명을 경멸하라고 가르치지 않는다. 이 생명은 하나님의 선하신 선물이며, 그 안에서 하나님의 선하심을 맛보아야 한다. 다만 우리의 고향은 하늘이므로 이 세상의 것을 상대적으로 대해야 한다. 칼빈은 죽음을 두려워하지 말라고 권한다. 죽음은 그리스도 안에서 저주가 아니라 통과가 되었다. 이 장은 세상과 하늘을 함께 붙드는 균형을 보여 준다.","secs":[["1-2","하나님이 그의 백성을 고난으로 연단하시는 목적 — 우리가 현재의 삶을 경멸하는 데 익숙해지도록. 이 생명에 대한 우리의 어리석은 사랑. 현재의 삶을 지나치게 사랑하면 장래의 생명을 바라보지 못한다 — 번영의 해로움."],["3-4","현재의 생명은 하나님의 은혜의 증거이므로 미워할 것이 아니라, 오히려 그 안에서 하나님의 선하심을 깨닫게 해야 한다. 현재의 생명에 대한 권태를 어떻게 다스릴 것인가. 신자의 삶의 평가, 현재와 장래의 비교."],["5-6","그리스도인은 죽음의 두려움에 떨지 말아야 한다 — 두 가지 이유, 반론과 답, 그리고 다른 이유들. 결론 — 어떤 종류의 환난을 당하든 우리는 언제나 이 목표를 바라보아야 한다."]],"vs":[["히 13:14","\"우리가 여기에는 영구한 도성이 없으므로 장차 올 도성을 찾는지라\" — 순례자의 삶."],["고후 5:1-2","\"우리가 무너질 장막집이 있음을 앎이라 하늘에 있는 처소를 원하여\" — 하늘의 소망."],["빌 1:23","\"떠나서 그리스도와 함께 있는 것이 훨씬 더 좋으므로\" — 죽음의 방향."],["골 3:1-2","\"위의 것을 찾으라…… 위의 것을 생각하고 땅의 것을 생각하지 말라\""],["시 39:5","\"주의 손 안에서 내 날이 몇 자 되나이다\" — 삶의 짧음."]],"hubs":["H15","H20"],"rel":[["3-08","십자가."],["3-10","현세의 위안을 쓰는 법."],["3-25","최후의 부활 — 하늘의 소망의 완성."]]},{"t":"c","id":"3-10","b":3,"n":10,"label":"현재 삶과 그 위안을 어떻게…","title":"현재 삶과 그 위안을 어떻게 사용해야 하는가","one":"하나님이 주신 현세의 위안은 감사로 누리되, 그것이 하나님을 가로막지 않게 해야 한다.","core":"이 장은 금욕주의와 방종 사이의 길을 찾는다. 칼빈은 하나님이 우리에게 이 세상의 위안을 필요를 넘어 기쁨까지 주셨다고 말한다. 그래서 수녀원의 엄격함처럼 하나님의 선물을 금하는 것은 잘못이다. 그러나 방종도 잘못이다. 창조물은 하나님이 우리에게 맡기신 것이며, 우리는 그것을 그분의 영광과 이웃의 유익을 위해 써야 한다. 이 장의 마지막 부분에는 유명한 직업소명 교리가 나온다. 각 사람은 자기가 부름받은 자리에서 일할 때 양심의 평안을 얻고, 그 모든 일이 하나님을 섬기는 예배가 된다.","secs":[["1-3","이 교리의 필요성. 현세의 선물의 사용 — 피해야 할 두 극단, 곧 과한 금욕과 육신의 방종. 하나님이 많은 자비를 창조하신 것은 필요만이 아니라 우리의 위안과 기쁨까지 고려하신 것이다. 지나친 금욕과 육신의 방종을 모두 버려야 한다 — 창조물은 우리를 하나님을 알고 사랑하고 섬기도록 초대한다."],["4-5","모든 땅의 복은 하늘의 생명과 비교할 때 낮게 여겨야 한다. 지나친 사랑이 이 생명에 대한 열망을 파괴한다. 둘째, 조급함과 과도한 욕심과 그 치료. 창조물은 우리의 사용을 위해 맡겨졌으며, 사람은 그 사용에 대하여 여전히 책임이 있다."],["6","하나님은 우리의 모든 행위에서 그의 부르심을 바라보라고 요구하신다. 이 교리의 쓰임과 그것이 주는 위로 — 이런 기초를 통해 우리는 부름받은 자리에서 인도하심을 받고, 직무를 성실히 감당하게 된다."]],"vs":[["고전 7:29-31","\"세상을 쓰는 자들은 다 쓰지 못하는 자 같이 하라\" — 이 세상을 상대적으로."],["딤전 4:4-5","\"하나님께서 지으신 모든 것이 선하매 감사함으로 받으면 버릴 것이 없나니\" — 창조물의 선함."],["시 145:15-16","모든 것의 눈이 주를 바라며, 주는 때를 따라 먹을 것을 주신다 — 창조물과 감사."],["골 3:23","\"무슨 일을 하든지 마음을 다하여 주께 하듯 하고 사람에게 하듯 하지 말라\" — 일과 소명."],["마 6:33","\"너희는 먼저 그의 나라와 그의 의를 구하라\" — 우선순위."]],"hubs":["H15","H17"],"rel":[["3-09","장래 생명에 대한 묵상과의 균형."],["3-07","자기 부인."],["3-19","그리스도인의 자유 — 중간 문제."]]},{"t":"c","id":"3-11","b":3,"n":11,"label":"믿음으로 의롭다 하심 — 이름과…","title":"믿음으로 의롭다 하심 — 이름과 실제가 무엇인가","one":"의롭다 하심은 죄인의 죄를 사하시고 그리스도의 의를 전가하여 하나님 앞에 의롭다고 선언하시는 일이다.","core":"이 장은 《기독교 강요》 칭의론의 기둥이다. 칼빈은 먼저 의롭다 하심이 무엇인지 용어부터 정의한다. 하나님이 우리를 의롭다 하시는 것은 우리가 그 안에서 의롭게 되는 성질을 넣어 주시는 일이 아니라, 죄를 용서하시고 우리를 의롭다 여기시는 법적 선언이다. 칼빈은 오시안더가 말한 '본질적 의'를 집중적으로 반박한다. 의는 우리 안에 실체로 들어오는 것이 아니라 그리스도에게서 전가된다. 이어서 믿음과 행위를 섞는 스콜라의 여러 회피를 조목조목 반박하고, 의롭다 하심이 오직 믿음으로, 오직 그리스도로 이루어진다는 정의를 성경과 교부로 확증한다.","secs":[["1","이 교리와 중생의 관계. 이 교리를 아는 것이 왜 매우 필요한지 두 가지 이유."],["2-4","설명을 위해 용어를 정리한다 — 하나님 앞에서 의롭다 하심이 무엇인가. 의롭다 함이라는 말의 여러 쓰임 — 하나님께 찬미를 돌림, 헛된 의를 내세움, 죄의 사함과 하나님 앞에서 값없는 의를 얻음. 이로써 확증한다."],["5-12","오시안더의 본질적 의라는 꿈을 반박한다 — 그의 논증들과 그에 대한 답변이 열여섯 가짓수까지 이어진다. 그리스도가 우리의 의가 된다는 말의 의미, 전가된 의와 시작된 의의 구별, 오시안더의 오류에 대한 결론."],["13-20","믿음과 행위를 섞어 의를 이루려는 스콜라의 주장을 반박한다 — 같은 이름으로 다른 것을 부르는 회피, 또 다른 회피들과 그에 대한 답, 그 회피가 낳는 해로운 결과. 성경에서 의롭다 하심이 무엇으로 이루어지는지. 이 교리를 설명하기 위해 제시된 두 구절과 또 다른 구절. 로마 가톨릭이 오직 믿음으로 의롭다 하심을 공격하는 세 번째 회피와 그에 대한 답. 의라는 말이 선한 행위에도 붙는 것과 그 보상을 근거로 드는 다섯째 회피에 대한 답."],["21-23","오시안더와 스콜라 신학자들이 반박된 뒤, 믿음으로 의롭다 하심이라는 정의의 정확함이 세워진다. 그 정의는 성경 구절과 고대 교부들의 저술로 확증된다. 사람이 믿음으로 의롭다 하심을 받는 것은 믿음으로 성령을 받고 그렇게 의로워지기 때문이 아니라, 믿음으로 그리스도의 의를 붙들기 때문이다."]],"vs":[["롬 3:24","\"그리스도 예수 안에 있는 속량으로 말미암아 하나님의 은혜로 값없이 의롭다 하심을 얻은 자 되었느니라\" — 값없는 칭의."],["롬 4:5","\"경건하지 아니한 자를 의롭다 하시는 이를 믿는 자에게는 그의 믿음을 의로 여기시나니\" — 전가된 의."],["롬 5:1","\"그러므로 우리가 믿음으로 의롭다 하심을 받았으므로 우리 주 예수 그리스도로 말미암아 하나님과 화평을 누리자\""],["고후 5:21","\"우리를 대신하여 죄를 삼으신 것은 우리로 그 안에서 하나님의 의가 되게 하심이라\" — 전가의 근거."],["갈 2:16","\"사람이 의롭게 되는 것은 율법의 행위로 말미암음이 아니요 오직 예수 그리스도를 믿음으로 말미암는 줄 알므로\""],["빌 3:9","\"내가 가진 의는 율법에서 난 것이 아니요 오직 그리스도를 믿음으로 말미암은 것이니\" — 그리스도의 의."]],"hubs":["H16"],"rel":[["3-12","심판대 앞에서 — 칭의의 필요."],["3-13","값없는 칭의의 두 가지."],["3-14","칭의와 성화의 구별."],["3-03","회개 — 칭의와 함께 가는 중생."]]},{"t":"c","id":"3-12","b":3,"n":12,"label":"하나님의 심판대를 바라보아야 칭의를…","title":"하나님의 심판대를 바라보아야 칭의를 진지하게 다룰 수 있다","one":"사람의 법정이 아니라 하나님의 심판대 앞에 서면, 우리의 의는 한 순간에 무너진다.","core":"칭의론의 오류는 대개 법정을 잘못 잡는 데서 온다. 칼빈은 하나님의 심판대를 잊은 신학이 사람의 잣대로 의를 재고 거짓 확신을 만든다고 지적한다. 하나님의 위엄을 생각하면 우리의 모든 의는 무너진다. 욥과 다윗과 바울과 아우구스티누스와 베르나르의 고백이 이것을 보여 준다. 그래서 그리스도인의 겸손은 자기 의에 대한 상상된 생각을 버리고 전적으로 하나님의 자비에 의지함에 있다. 바리새인과 세리의 비유가 이 모든 논의의 요약이다. 칼빈은 우리의 의를 하나님 앞에 자랑할 수 있는 사람은 아무도 없다고 결론한다.","secs":[["1","칭의에 관한 오류의 근원 — 스콜라 신학자들은 이 문제를 어떤 사람의 법정에서 다룰 것처럼 말한다."],["2-3","위선적 확신의 근원. 비유로 설명하고 훈계한다. 욥과 다윗과 바울의 증언, 아우구스티누스와 베르나르의 고백."],["4-6","행위의 의를 넘어뜨리는 또 하나의 무기 — 양심에 대한 진지한 검토와 하나님의 엄위 앞에서의 우리 자신과의 비교. 우리의 행위에 대한 상상된 의견에 빠지는 이유와, 하나님의 위엄을 고려하는 데 있는 치료. 그리스도인의 겸손은 자기 의에 대한 상상된 견해를 버리고 전적으로 하나님의 자비를 신뢰하는 데 있다."],["7-8","세리의 비유에 대한 설명. 거만함과 방심과 자신에 대한 신뢰를 버려야 한다. 이 교리의 요약 — 비록 완전한 순종이 우리 안에 없다 해도, 하나님 앞에 서는 자세가 무엇인지 정리한다."]],"vs":[["눅 18:13","\"하나님이여 불쌍히 여기소서 나는 죄인이로소이다\" — 세리의 기도."],["욥 9:2-3","\"사람이 어찌 하나님 앞에서 의롭다 하겠으며\" — 욥의 인정."],["시 130:3","\"여호와여 주께서 죄악을 지켜보신다면 주 앞에 누가 서리이까\" — 심판대의 두려움."],["사 64:6","\"우리의 모든 의는 다 더러운 옷과 같으며\" — 우리의 의의 실상."],["롬 3:19-20","\"율법의 행위로 그의 앞에 의롭다 하심을 얻을 육체가 없나니\" — 결론."]],"hubs":["H16"],"rel":[["3-11","칭의의 정의."],["3-13","값없는 칭의의 두 가지."],["3-15","공로의 자랑."]]},{"t":"c","id":"3-13","b":3,"n":13,"label":"값없는 칭의에서 살펴야 할 두 가지","title":"값없는 칭의에서 살펴야 할 두 가지","one":"칭의는 하나님의 영광을 지키고, 양심에 참된 평안을 준다.","core":"값없는 칭의 교리는 두 가지를 반드시 지켜야 한다. 첫째, 하나님이 홀로 의로우신 분으로 인정받으셔야 한다. 우리가 의롭다 하심을 받는 데 우리의 어떤 것도 보태지 않으므로 하나님의 영광이 흐려지지 않는다. 둘째, 양심이 참된 평안을 얻어야 한다. 우리의 행위에 근거한 평안은 언제든 무너지지만, 그리스도의 은혜에 근거한 평안은 흔들리지 않는다. 칼빈은 이 두 가지가 함께 서지 않으면 칭의 교리가 제대로 가르쳐진 것이 아니라고 본다. 하나님의 영광과 양심의 평안, 이 둘이 개혁파 칭의론의 시금석이다.","secs":[["1","하나님께서 홀로 의로우신 분으로 인정받으실 때 그의 영광이 훼손되지 않는다 — 성경으로 증명."],["2","자기를 자랑하는 자는 하나님을 대적하여 자랑한다 — 반론과 답, 바울과 베드로의 권위로 확증."],["3","양심의 평안은 오직 값없는 칭의로만 얻어진다 — 솔로몬의 증언, 양심 자체의 증언, 그리고 그리스도의 의만 의지한 바울의 증언."],["4","그 약속은 그리스도의 자비에 대한 믿음으로 확증된다 — 아우구스티누스와 베르나르의 확증과 앞에서 말한 것과의 일치."],["5","사도의 추가 증명과 궤변의 반박 — 두 가지 목적, 곧 하나님의 영광과 양심의 확신을 함께 지켜야 한다."]],"vs":[["롬 3:26","\"그가 의로우시고 또 예수를 믿는 자를 의롭다 하시는 이시니\" — 하나님의 의."],["고전 1:31","\"기록된 바 자랑하는 자는 주 안에서 자랑하라 함과 같게 하려 함이라\" — 자랑의 방향."],["롬 5:1-2","믿음으로 의롭다 하심을 받아 하나님과 화평을 누린다 — 양심의 평안."],["히 10:22","\"우리가 마음에 뿌림을 받아 양심의 악을 깨닫고\" — 깨끗한 양심."],["요일 3:20-21","\"우리 마음이 우리를 책망할 것이 있으면\" — 하나님 앞의 담대함."]],"hubs":["H16"],"rel":[["3-11","칭의의 정의."],["3-12","심판대 앞에서."],["3-18","행위의 의와 보상."]]},{"t":"c","id":"3-14","b":3,"n":14,"label":"칭의의 시작과 그것이 진보한다는…","title":"칭의의 시작과 그것이 진보한다는 말의 의미","one":"의롭다 하심은 한 번 주어지며, 신자의 삶 속에서는 날마다 그 의를 새롭게 붙드는 진보가 있다.","core":"칼빈은 사람을 네 부류로 나누어 검토한다. 우상숭배자, 불경건한 자, 위선자, 그리고 중생한 자다. 앞의 세 부류의 행위가 하나님 앞에서 의로울 수 없음은 분명하다. 문제는 중생한 자다. 그들의 선한 행위에도 부패가 붙어 있다. 칼빈은 한 가지 허물이 모든 의를 지울 수 있다면 사람은 행위로 의롭다 하심을 받을 수 없다고 논증한다. 그런데도 성경은 신자의 의가 진보한다고 말한다. 칼빈은 그 진보가 칭의의 근거가 아니라 은혜의 열매이며, 하나님이 그 불완전한 순종을 아버지로서 받으신다고 설명한다.","secs":[["1-4","사람은 우상숭배자, 불경건한 자, 위선자, 중생한 자 넷으로 나뉜다. 사람들 사이의 큰 차이는 하나님의 은사와 자연적 성향의 구별에서 드러난다. 모든 인간의 미덕은 마음의 불결과 목적의 결핍으로 부패한다. 그리스도 없이는 생명이 없다 — 사람의 자연적 상태, 곧 중생 전에는 모든 사람이 죄 가운데 죽었다는 성경의 묘사."],["5-8","성경의 여러 구절과, 행위의 의를 그리스도의 구속과 혼동하는 통속적 오류. 위선자와 이름뿐인 그리스도인들의 모든 행위가 정죄받을 만한 이유. 아우구스티누스와 그레고리우스의 인용."],["9-13","넷째 부류 — 중생한 자. 성령의 인도를 받아도 그들의 모든 행위에 부패가 붙어 있고, 특히 하나님 앞에 나아갈 때 그렇다. 한 가지 허물이 이전의 모든 의를 지울 수 있으므로 그들은 행위로 의롭다 하심을 받을 수 없다. 스콜라 신학자들의 궤변과 그 답 — 부분적 의라는 허구와 남는 공로로 보충한다는 허구를 반박한다."],["14-21","우리가 모든 것을 다 행한 후에도 무익한 종이라는 그리스도의 말씀. 바울의 자랑에 근거한 반론과 그 의미. 성경이 우리를 모든 행위의 신뢰에서 빼내는 방식, 우리에게 하나님 앞에서 자랑할 것이 없다는 점. 네 부류 가운데 누구도 행위로 구원을 얻는 데 자기 몫이 없다는 여섯째 답. 성도들의 자랑에 근거한 둘째 반론 — 그 자랑은 아버지께 대한 양자됨을 가리킬 뿐이다. 성도들은 행위의 공로에 아무것도 돌리지 않으며 그리스도의 의를 조금도 깎지 않는다. 신자의 선한 행위가 하나님의 복의 하위 원인이 된다는 셋째 반론에 대한 답."]],"vs":[["눅 17:10","\"우리는 무익한 종이라 우리가 하여야 할 일을 한 것뿐이라 할지니라\" — 행위의 한계."],["사 64:6","우리의 모든 의는 더러운 옷과 같다 — 중생한 자의 의도 그러하다."],["롬 7:18-21","원함은 내게 있으나 선을 행하는 것은 없도다 — 신자의 실상."],["시 143:2","\"주 앞에 산 자가 의롭다 함을 얻을 자가 없느니라\" — 다윗의 고백."],["갈 5:17","육체의 소욕은 성령을 거스르고 — 신자 안의 갈등."]],"hubs":["H16","H15"],"rel":[["3-11","칭의의 정의."],["3-15","공로의 자랑 비판."],["3-06","그리스도인의 삶 — 은혜의 열매."]]},{"t":"c","id":"3-15","b":3,"n":15,"label":"행위의 공로를 자랑하는 것은…","title":"행위의 공로를 자랑하는 것은 하나님의 영광과 우리의 구원을 모두 뒤집는다","one":"선한 행위는 하나님이 주신 선물이며, 그것으로 하나님의 은혜를 값으로 살 수는 없다.","core":"칼빈은 공로라는 말의 문제를 다룬다. 선한 행위가 하나님의 상을 받는 것은 사실이지만, 그것이 은혜를 값으로 얻는 공로라는 뜻은 아니다. 신자의 선한 행위는 하나님이 주신 것이며, 은혜로 받은 것을 은혜로 드리는 것뿐이다. 그래서 공로를 주장하면 그리스도의 공로를 흐리게 하고, 사람에게 자랑할 거리를 준다. 칼빈은 이 교리가 교리와 권면과 위로에 충분한 기초를 준다고 결론한다. 우리는 상을 바라보되 그것을 값으로 여기지 않고, 아버지의 선하심을 신뢰한다.","secs":[["1","간단히 정리한 뒤, 선한 행위가 하나님의 은총을 얻는 공로인가 하는 문제를 다룬다."],["2-3","첫째 답 — 공로라는 말의 의미를 정한다. 이 말은 행위에 부적절하게 붙지만 좋은 뜻으로 쓰일 수 있다. 둘째 답 — 먼저 부정하고, 이어서 양보한다. 행위에 상을 주실 때 무엇이 하나님께 돌려져야 하는가."],["4","집회서(
