벤 시라크)에서 나온 첫 반론, 히브리서에서 나온 둘째 반론, 그 둘에 대한 답."],["5-7","셋째이자 가장 완전한 답 — 우리를 그리스도께로, 곧 구원의 유일한 터로 되돌린다. 그리스도가 어떻게 우리의 의가 되시는가. 그리스도의 공로를 없애고 사람의 공로를 세우려는 궤변을 혐오해야 한다. 롬바르두스에게서 나온 젊은 스콜라 신학자들의 오류를 아우구스티누스와 성경으로 반박한다."],["8","결론 — 이렇게 놓인 기초가 교리와 권면과 위로에 충분하다는 점을 보이고 요약한다."]],"vs":[["딤후 1:9","\"우리를 구원하시되 우리의 행한 바로 말미암지 아니하고 오직 그의 은혜를 따라\" — 은혜의 우선성."],["롬 4:4","\"일하는 자에게는 삯을 은혜로 여기지 아니하고 빚으로 여기거니와\" — 공로와 은혜의 대비."],["고전 4:7","네가 받지 아니한 것이 무엇이 있느냐 — 모든 것이 선물."],["딛 3:5","\"우리가 행한 의로운 일로 말미암은 것이 아니요 오직 그의 긍휼을 따라\""],["빌 3:8-9","\"내가 그리스도를 위하여 모든 것을 잃어버리고 배설물로 여김은\" — 그리스도의 의만."]],"hubs":["H16","H11"],"rel":[["3-14","중생한 자의 의도 공로가 아님."],["3-17","율법과 복음의 약속."],["3-18","상과 보상의 의미."]]},{"t":"c","id":"3-16","b":3,"n":16,"label":"이 교리에 씌워진 비방에 대한 답변","title":"이 교리에 씌워진 비방에 대한 답변","one":"칭의 교리는 선한 행위를 없애지 않고, 오히려 은혜로 선한 행위를 하게 만든다.","core":"로마 가톨릭의 대표적 비방은 이것이다. '오직 믿음으로 의롭다'고 가르치면 사람들이 선한 행위를 하지 않게 되고 죄를 가볍게 여기게 된다는 것이다. 칼빈은 이 비방을 정면으로 다룬다. 칼빈의 반론은 이렇다. 우리는 행위로 구원을 얻지 않지만, 구원받은 사람은 행위를 하도록 부름받았다. 성경도 사도의 권면에서 공로를 말하지 않고 오히려 은혜와 감사를 근거로 선한 행위를 권한다. 둘째 비방은 '의롭다 하심이 너무 쉽다'는 것이다. 칼빈은 값없이 주어지는 것이 값싼 것이 아니며, 그리스도의 피가 그것을 값비싸게 만들었다고 답한다.","secs":[["1","로마 가톨릭의 비방 — 우리가 선한 행위를 없애고 죄를 권한다는 것. 첫 비방을 반박한다."],["2-3","선한 행위의 공로를 없애면 사람들이 선을 행하지 않게 된다는 추론을 반박한다. 사도들은 선한 행위를 권할 때 공로를 말하지 않았고, 오히려 공로를 배제하며 우리를 은혜로, 그리스도로 돌린다."],["4","둘째 비방과 그 추론 — 의를 얻는 일이 너무 쉬워진다는 것. 이 비방과 추론을 반박하고, 값없이 주어지는 의가 값싼 것이 아님을 밝힌다."]],"vs":[["엡 2:8-10","\"너희는 그 은혜에 의하여 믿음으로 말미암아 구원을 받았으니…… 우리는 그가 만드신 바라 그리스도 예수 안에서 선한 일을 위하여 지으심을 받은 자니\" — 은혜와 선한 행위."],["딛 3:8","\"믿은 자들은 선한 일을 힘써 하기를 원하노라\" — 구원받은 자의 열매."],["롬 6:15","\"그런즉 우리가 율법 아래 있지 아니하고 은혜 아래 있으므로 범죄하겠느냐 그럴 수 없느니라\" — 은혜와 죄."],["고후 5:14","\"그리스도의 사랑이 우리를 강권하시는도다\" — 사랑이 선을 이끈다."],["요 14:15","\"너희가 나를 사랑하면 나의 계명을 지키리라\" — 사랑과 순종."]],"hubs":["H16"],"rel":[["3-15","공로 비판."],["3-06","그리스도인의 삶."],["3-19","그리스도인의 자유와 방종의 구별."]]},{"t":"c","id":"3-17","b":3,"n":17,"label":"율법의 약속과 복음의 약속을 어떻게…","title":"율법의 약속과 복음의 약속을 어떻게 조화시킬 것인가","one":"율법의 약속은 순종을 조건으로 하지만, 그 조건을 이루시는 분도 하나님이시다.","core":"율법은 '행하라 그러면 살리라'고 약속하고, 복음은 '믿으라 그러면 구원을 얻으리라'고 약속한다. 이 둘이 모순되지 않는가. 칼빈의 답은, 율법의 약속이 조건적이되 그 조건을 우리가 이룰 수 없기에 결국 그 약속도 그리스도 안에서 성취된다는 것이다. 그래서 율법의 약속은 폐기된 것이 아니라 그리스도 안에서 참된 의미를 얻는다. 칼빈은 고넬료의 예와 야고보서의 칭의 논의, 로마서 2장의 말씀을 차례로 검토하며, 행위와 의의 관계를 정확히 가른다. 이 장은 칭의론과 율법론을 잇는 정밀한 변증이다.","secs":[["1-2","15장과 16장의 간단한 정리. 행위에 의를 돌리지 않는 이유. 상대자들이 하나님의 약속에 근거해 제시하는 논증과, 불가능성에서 오는 답의 확증, 사도와 다윗의 증언."],["3","그 약속이 왜 주어졌는지 밝혀 그 반론에 답하고, 율법의 약속과 복음의 약속을 나누는 궤변적 구별을 반박한다."],["4-6","고넬료의 예에서 나온 논증과 답 — 두 종류의 받으심을 구별한다. 첫째 종류와 스콜라의 궤변, 둘째 종류. 고넬료가 값없이 받아들여진 뒤에야 그의 선한 행위가 받아들여졌음이 분명하다. 약속이 율법적인가 복음적인가를 살펴야 한다 — 율법적 약속은 언제나 조건적이다."],["7-10","선한 행위를 의라 부르고 사람이 행위로 의롭다 하심을 받는다고 선언하는 구절들에서 나온 논증과 답 — 행위는 그 자체로 유익이 없고 우리는 그리스도로 말미암아 의롭다 하심을 받는다. 양도 논법으로 답을 확증한다. 신자의 부분적이고 불완전한 의가 어떻게 받아들여지는가. 반박의 결론."],["11-15","야고보서에서 나온 논증 — 한 사도가 다른 사도와 대립할 수 없다는 답, 다른 답들. 의롭다 하심이라는 말에 대한 또 다른 궤변 — 바울은 의의 원인을, 야고보는 그 결과를 말한다. 로마서 2:13에서 나온 논증과 그 의미, 성도들이 자기 의를 자신 있게 내세우는 구절들에서 나온 논증과 답, 성도의 길에 의와 생명을 돌리는 구절들에서 나온 마지막 논증과 답."]],"vs":[["레 18:5","\"사람이 준행하면 그로 말미암아 살리라\" — 율법의 조건적 약속."],["롬 10:5-6","율법으로 말미암는 의와 믿음으로 말미암는 의의 대조."],["갈 3:12","\"율법은 믿음에서 난 것이 아니니\" — 두 원리의 구별."],["약 2:24","\"사람이 행위로 말미암아 의롭다 함을 얻고 믿음으로만은 아니니라\" — 야고보의 강조."],["행 10:4-5","고넬료의 기도와 구제가 하나님 앞에 상달되었다 — 그러나 그도 믿음으로 받아들여졌다."],["신 27:26","\"이 율법의 모든 말씀을 지켜 행하지 아니하는 자는 저주를 받을지어다\" — 조건의 무게."]],"hubs":["H16","H07"],"rel":[["3-15","공로 비판."],["3-14","중생한 자의 의."],["2-07","율법의 목적과 쓰임."]]},{"t":"c","id":"3-18","b":3,"n":18,"label":"행위의 의를 상과 보상에서 잘못…","title":"행위의 의를 상과 보상에서 잘못 끌어내는 이유","one":"하나님이 행위에 상을 주시는 것은 공로 때문이 아니라 아버지의 자유로운 선하심 때문이다.","core":"성경은 하나님이 우리 행위에 상을 주신다고 말한다. 그렇다면 행위에 의가 있는 것인가. 칼빈은 상을 주시는 것이 공로를 인정하는 것과 다르다고 답한다. 상은 하나님이 값없이 정하신 약속에 따른 것이며, 영생은 행위의 삯이 아니라 은혜의 유업이다. 그래서 성경은 영생을 상이라 부르면서도 유업이라 부른다. 칼빈은 '너희가 들어가고자 하거든 계명을 지키라'는 그리스도의 말씀, 보물을 쌓으라는 말씀, 고난을 견디는 자들이 합당하다는 말씀을 차례로 풀며, 행위가 구원의 길이지 원인은 아니라는 구별을 세운다.","secs":[["1-2","두 가지 일반 반론 — 첫째는 풀고 설명한다. '일한다'는 말의 의미. 둘째 반론의 해결 — 행위는 구원의 원인이 아니다. 이는 상의 이름과 성격에서 드러난다."],["3-5","영생이 행위의 상이라 불리는 첫째 이유와 성경의 확증, 하나님의 작정의 협력. 다른 네 가지 이유 — 거룩함은 왕국의 길이지 그것을 얻는 원인이 아니다. 하나님께서 자기 백성의 행위에 관을 씌우신다는 반론에 대한 세 가지 답과 성경에서 오는 네 번째 답."],["6-9","하늘에 보물을 쌓으라는 첫째 특별 반론과 답, 고난을 견디는 의인들이 하늘 나라에 합당하다는 둘째 반론과 답, 바울의 세 구절에서 나온 셋째 반론과 답, '생명에 들어가려거든 계명을 지키라'는 그리스도의 말씀에서 나온 넷째 반론과 답."],["10","마지막 반론 — 믿음 자체가 행위라 불린다는 것. 답 — 믿음이 행위로서 의롭다 하시는 것이 아니다. 여기서부터 앞의 논의를 정리한다."]],"vs":[["롬 6:23","\"죄의 삯은 사망이요 하나님의 은사는 그리스도 예수 우리 주 안에 있는 영생이니라\" — 삯과 은사."],["골 3:24","\"이는 너희가 주께서 기업을 상으로 주실 줄 아노라\" — 상과 유업."],["마 19:17","\"네가 생명에 들어가려면 계명들을 지키라\" — 계명과 생명."],["딤후 4:8","\"의로운 재판장이 그 날에 내게 주실 것이니\" — 상의 근거."],["히 11:6","\"그가 하나님을 기쁘시게 하신 자들에게 상 주시는 이심을 믿어야 할지니라\" — 상과 믿음."]],"hubs":["H16"],"rel":[["3-15","공로."],["3-17","약속의 조화."],["3-06","그리스도인의 삶과 상."]]},{"t":"c","id":"3-19","b":3,"n":19,"label":"그리스도인의 자유","title":"그리스도인의 자유","one":"그리스도인의 자유는 세 부분으로 이루어진다 — 율법의 의에서 벗어남, 양심의 자발적 순종, 중간 문제의 자유.","core":"칼빈은 그리스도인의 자유를 칭의의 열매로 제시한다. 자유는 세 부분으로 이루어진다. 첫째, 신자는 자기 의를 주장하지 않고 오직 그리스도만 바라본다. 둘째, 양심이 율법의 엄격한 요구에서 벗어나 자발적으로 하나님의 뜻에 순종한다. 셋째, 중간 문제에서 자유롭다 — 먹고 마시고 절기를 지키는 일에 양심이 얽매이지 않는다. 동시에 칼빈은 이 자유가 방종이 되지 않도록, 약한 자를 배려하는 사랑의 규칙을 붙인다. 자유는 사랑의 질서 안에서만 참 자유다.","secs":[["1-3","앞 장의 칭의와 이 장의 연결. 그리스도인의 자유를 바로 아는 것이 유익하고 필요한 이유. 자유의 첫 부분 — 신자는 율법의 의를 버리고 오직 그리스도를 바라본다. 갈라디아서 전체로 확증된다."],["4-6","자유의 둘째 부분 — 양심이 율법의 멍에에서 벗어나 자발적으로 하나님의 뜻에 순종한다. 율법의 엄격한 요구에서 벗어났을 때 우리는 기쁨과 활력으로 하나님의 부르심에 응답한다. 사도로 말미암은 증명과 자유의 목적."],["7-8","자유의 셋째 부분 — 중간 문제에서의 자유로운 사용. 이 부분을 아는 것이 절망과 당혹을 없애는 데 필요하다. 로마서로 증명하고, 이 자유를 지키지 않는 사람들 — 하나님을 경멸하는 자들 — 을 다룬다."],["9-13","그리스도인의 자유의 성격과 효력 — 에피쿠로스적 오용에 반하여. 약한 자를 돌보지 않는 이들에 반하여 이 자유를 지킨다. 이 자유 교리를 실족의 문제에 적용한다 — 주는 실족과 받는 실족. 약하고 바리새적인 자가 누구인지 예와 바울의 가르침으로 증명한다. 중간 문제에 대한 적용 — 두려움 때문에 생략해서는 안 되는 필수적인 것들."],["14-16","그리스도인의 자유에 관한 오류들 반박 — 경건한 자의 양심은 인간의 전통으로 묶여서는 안 된다. 영적인 통치와 시민적 통치는 구별되어야 한다. 양심은 외적 순종과 어떤 관계에 있는가 — 선한 것과 악한 것에서, 그리고 중간 문제에서."]],"vs":[["갈 5:1","\"그리스도께서 우리를 자유롭게 하려고 자유를 주셨으니\" — 자유의 근거."],["롬 14:3","\"먹는 자는 먹지 않는 자를 업신여기지 말고\" — 중간 문제의 자유."],["고전 9:19","\"내가 모든 사람에게 자유하였으나 스스로 모든 사람에게 종이 된 것은\" — 자유와 사랑."],["고전 8:9","\"너희의 이 자유가 약한 자들에게 거치는 것이 되지 않도록 조심하라\" — 실족의 경계."],["골 2:16-17","\"먹고 마시는 것과 절기나 월삭이나 안식일을 인하여 누구든지 너희를 판단하지 못하게 하라\" — 의식의 그림자."],["벧전 2:16","\"자유를 하되 오직 자유를 악을 행하는 구실로 쓰지 말고\" — 자유의 오용 경계."]],"hubs":["H17"],"rel":[["3-11","칭의 — 자유의 근거."],["3-07","자기 부인과 사랑의 질서."],["3-10","현세의 위안과 중간 문제."],["4-10","인간의 전통이 양심을 묶는 문제"]]},{"t":"c","id":"3-20","b":3,"n":20,"label":"기도 — 믿음의 영구한 훈련","title":"기도 — 믿음의 영구한 훈련","one":"기도는 하나님이 우리에게 주신 은혜를 받는 손이며, 믿음을 날마다 훈련하는 자리다.","core":"이 장은 《기독교 강요》에서 가장 실천적인 장이다. 칼빈은 기도가 하나님이 정하신 수단이며, 우리가 그 안에서 믿음을 훈련한다고 말한다. 기도에는 네 가지 규칙이 있다. 하나님을 향한 경외, 우리의 결핍을 아는 마음, 모든 교만의 버림, 응답에 대한 확신이다. 우리는 그리스도를 통해서만 하나님께 나아간다. 칼빈은 성인들의 중보를 단호히 거부하고, 주기도문을 하나하나 해설한다. 그리고 공적 기도와 기도의 언어, 노래, 지속적인 기도를 다룬다. 기도는 신학의 결론이 아니라 신학이 사는 숨결이다.","secs":[["1-3","지금까지의 논의를 간단히 정리하고 기도의 교리로 넘어간다. 기도의 정의와 필요성과 쓰임. 하나님이 우리의 필요를 이미 아시므로 기도가 무용하다는 반론과, 기도의 제정과 목적에서 오는 답."],["4-7","기도의 첫째 규칙 — 하나님을 향한 경외와 마음의 집중. 모든 마음의 산란을 버리고 우리의 모든 정서를 진지하게 쏟아야 한다. 둘째 규칙 — 우리의 결핍을 아는 마음. 이 규칙을 어기는 형식적이고 의례적인 기도와 위선자들의 기도. 기도할 필요가 늘 같지는 않다는 반론과, 우리가 항상 기도해야 한다는 답."],["8-13","셋째 규칙 — 모든 교만의 억제. 다니엘과 다윗과 이사야와 예레미야와 바룩의 예. 교만을 누르는 유익 — 겸손한 자복과 함께 사함을 간구하게 한다. 셋째 규칙에 대한 반론과, 성도들의 자랑에 대한 답. 넷째 규칙 — 들으심에 대한 확실한 신뢰. 이 신뢰가 어떤 것인지, 이것을 터무니없다고 보는 이들의 오류, 하나님의 명령과 약속을 우리의 무가치함에 대는 방식. 경건한 자를 향한 약속들의 실현, 기도의 형식대로 되지 않았으나 응답된 예들, 이 네 규칙이 그렇게 엄격히 요구되지는 않는다는 설명."],["14-27","누구를 통하여 하나님을 부를 것인가 — 예수 그리스도. 하나님의 위엄과 우리의 처지에서 오는 근거. 처음부터 모든 신자가 그분을 통해서만 들으심을 얻었고, 그분 이후에 특히 그러하다. 그리스도를 중보자로 거부하는 자들에게 하나님의 진노가 있다. 그리스도의 중보를 가로막는 오류들 반박 — 그리스도는 구속의 중보자, 성도들은 중보자라는 주장. 하늘에 있는 성도들의 중보라는 로마 가톨릭의 허구와 그 허구의 불합리, 그 허구가 낳는 괴물 같은 오류들과 그 변명. 성인 중보를 지지하는 논증들 — 천사의 직무에서, 성경 구절에서, 영광 중의 성도들의 사랑의 성격에서, 모세의 한 구절에서, 성도의 기도가 들린다는 말에서 — 에 대한 답. 성인을 부르는 것은 불경건하다는 결론 — 하나님의 영광을 빼앗고 그리스도의 중보를 파괴한다."],["28-33","기도의 종류 — 서원, 간구, 청원, 감사와 그 연결과 끊임없는 필요. 기도의 부수적 성격 — 사적 기도와 공적 기도, 상시 기도, 정한 때, 필요할 때의 예외. 공적 기도가 드려지는 장소인 예배당과 그 올바른 사용과 남용. 말함과 노래 — 마음에서 우러나지 않으면 무익하다. 목소리의 사용은 사적 기도보다 공적 기도에 더 관련된다. 노래는 가장 오래된 것이나 보편적이지는 않다. 공적 기도는 외국어가 아니라 백성이 알아듣는 말로 드려야 한다."],["34-52","그리스도께서 가르치신 기도의 형식은 하늘 아버지의 한량없는 선하심을 보여 준다. 주기도문은 여섯 간구로 나뉘고 두 부분으로 정리된다 — 하나님의 영광과 우리의 필요. '아버지'라는 말에 담긴 뜻 — 오직 그리스도의 이름으로 기도하며 모든 의심을 버린다. 우리 죄가 아버지가 아니라 재판장으로 만든 분 앞에서 나아가지 못하게 한다는 반론과 답. 하나님이 일반적으로 '우리 아버지'라 불리시는 이유. 우리 자신과 다른 이들을 위해 특별히 기도할 수 있다. 하나님이 하늘에 계신다는 말의 의미와 세 가지 위로. 첫째 간구 — 하나님의 이름이 거룩히 여김을 받으심. 둘째 간구 — 하나님의 나라가 임하심. 셋째 간구 — 하나님의 뜻이 이루어짐. 둘째 부분의 세 간구와 그 첫째 간구에 담긴 것 — 우리의 죄가 빚이라 불리는 이유. 여섯째 간구 — 시험에 들지 않게 하시고 악에서 구하소시며. 마지막 세 간구가 보여 주는 것 — 그리스도인의 기도는 공적이어야 한다. 주기도문의 결론. 주기도문은 우리가 하나님께 구할 수 있고 구해야 할 모든 것을 담는다 — 그것을 넘어서는 자들은 세 가지로 죄를 범한다. 성도들의 예를 따라 다른 말로 기도할 수 있으나 뜻이 달라서는 안 된다. 정한 기도 시간에 관한 실천적 지침. 기도의 지속이 특히 권해지며, 하나님께 시간을 정해 주는 자들을 정죄한다. 믿음의 존귀함 — 우리는 기도 응답으로 우리에게 가장 유익한 것을 언제나 얻는다."]],"vs":[["마 6:9","\"그러므로 너희는 이렇게 기도하라 하늘에 계신 우리 아버지여 이름이 거룩히 여김을 받으시오며\" — 주기도문."],["마 7:7","\"구하라 그리하면 너희에게 주실 것이요 찾으라 그리하면 찾아낼 것이요 문을 두드리라\" — 간구의 약속."],["요 14:13-14","\"너희가 내 이름으로 무엇을 구하든지 내가 행하리니\" — 그리스도의 이름으로."],["딤전 2:5","\"하나님과 사람 사이에 한 중보자 곧 사람이신 그리스도 예수\" — 유일한 중보."],["살전 5:17","\"쉬지 말고 기도하라\" — 지속적인 기도."],["롬 8:26","\"성령께서 우리의 연약함을 도우시나니\" — 기도하는 성령."],["약 5:16","\"의인의 간구는 역사하는 힘이 큼이니라\" — 기도의 능력."]],"hubs":["H18","H13"],"rel":[["3-02","믿음 — 기도의 뿌리."],["3-19","그리스도인의 자유 — 공적 예배의 자유."],["2-15","그리스도의 제사장직과 중보."],["4-19","성인 숭배의 문제"]]},{"t":"c","id":"3-21","b":3,"n":21,"label":"영원한 선택 — 하나님께서 어떤…","title":"영원한 선택 — 하나님께서 어떤 사람을 구원하시기로 정하신 교리","one":"하나님이 어떤 사람을 구원하시기로 작정하신 것은 그의 은밀하고도 공의로운 뜻에서 온다.","core":"칼빈은 예정을 신학의 변두리가 아니라 하나님의 은혜를 바르게 이해하는 자리로 본다. 예정 교리는 하나님이 어떤 사람은 구원하시고 어떤 사람은 그대로 두시는 영원한 작정을 말한다. 이 교리는 하나님이 무엇을 하실지 미리 아시고 그에 따라 정하셨다는 뜻이 아니라, 하나님의 값없는 선택에서 온다. 칼빈은 이 교리가 하나님의 영광을 지키고, 겸손을 낳고, 구원의 확신과 양심의 평안을 준다고 말한다. 동시에 그는 지나친 호기심을 경계하고, 이 교리를 두려움의 도구로 쓰지 말라고 당부한다.","secs":[["1-2","선택과 예정의 교리 — 유익하고 필요하며 지극히 달콤하다. 이 교리를 모르면 하나님의 영광이 손상되고 겸손이 뿌리째 뽑히며 교만이 자란다. 이 교리는 구원의 확실성과 양심의 평안과 교회의 참된 기원을 세운다. 두 부류의 사람에 대한 답 — 호기심으로 캐묻는 자들. 아우구스티누스의 한 생각과 우리 구주와 솔로몬의 훈계로 확증."],["3-4","이 교리를 언급하기를 꺼리는 둘째 부류에 대한 답과, 솔로몬의 한 구절에 근거한 반론을 모세의 말로 푸는 방식. 둘째 반론 — 이 교리가 불경한 자들에게 걸림돌이 된다는 것. 답 — 다른 많은 교리도 그러하며, 하나님의 진리는 언제나 스스로를 변호한다. 셋째 반론 — 신자에게 위험하다는 것. 답 — 아우구스티누스에게도 같은 반론이 있었고, 하나님이 계시하신 것을 업신여겨서는 안 된다."],["5-7","이 교리에 대한 여러 얄팍한 반론들과 그 답 — 미리 아심을 예정의 원인으로 보는 것. 미리 아심과 예정의 설명. 예정의 원인은 하나님이 아니라 그분의 선하신 기쁘심이다. 아브라함의 후손의 값없는 선택과 다른 모든 이의 배제에서 이것이 분명하다. 아브라함의 후손 가운데서도 어떤 이는 선택되고 어떤 이는 배제된다. 사도는 그리스도 아래에서 개인에 관하여 같은 일이 이루어졌음을 보여 준다."]],"vs":[["엡 1:4-5","\"곧 창세 전에 그리스도 안에서 우리를 택하사…… 사랑 안에서 그리스도로 말미암아 우리를 예정하사\" — 창세 전의 선택."],["롬 9:11-13","\"자식들이 아직 나지도 아니하고 선악을 행하지도 아니하였으되\" — 선택의 근거는 행위가 아니다."],["롬 8:29-30","미리 아신 자들을 미리 정하시고 부르시고 의롭다 하시고 영화롭게 하셨다 — 구원의 사슬."],["말 1:2-3","\"내가 야곱을 사랑하였고 에서를 미워하였었느니라\" — 선택과 배제."],["행 13:48","\"영생을 주시기로 작정된 자는 다 믿더라\" — 작정과 믿음."],["딤후 1:9","\"창세 전에 그리스도 예수 안에서 우리에게 주신 은혜대로\" — 은혜의 작정."]],"hubs":["H19"],"rel":[["3-22","성경의 증거로 확증."],["3-23","비방에 대한 답."],["3-24","부르심으로 확증되는 선택."],["1-18","악인을 도구로 쓰시는 하나님"]]},{"t":"c","id":"3-22","b":3,"n":22,"label":"성경의 증거로 확증된 선택","title":"성경의 증거로 확증된 선택","one":"하나님의 선택은 미리 아신 공로를 근거로 하지 않고, 그의 기쁘신 뜻에서만 나온다.","core":"칼빈은 예정 교리의 근거를 성경으로만 세우려 한다. 흔한 반론은 '하나님이 장래의 공로를 미리 아시고 그에 따라 선택하신다'는 것이다. 칼빈은 로마서 9장의 야곱과 에서의 예를 들어 이 반론을 무너뜨린다. 선택은 행위 이전에, 하나님의 부르신 자의 뜻을 따라 이루어졌다. 칼빈은 아우구스티누스와 암브로시우스, 아퀴나스와 근대 신학자들의 반론을 차례로 검토하고, 유기는 하나님의 공의로운 뜻에 근거한다고 결론한다. 이 장은 예정론의 성경적 기초를 가장 조밀하게 다진다.","secs":[["1-3","하나님이 장래의 공로를 미리 아시고 그에 따라 선택하신다고 생각하는 이들과, 하나님이 어떤 이는 선택하고 어떤 이를 지나치시는 것을 불평하는 이들을 모두 반박한다 — 확실한 논증과 아우구스티누스의 증언. 누가 선택되는가, 언제, 누구 안에서, 무엇을 위하여, 어떤 이유로. 이유는 하나님의 기쁘신 뜻이며, 그 뜻이 선택을 지배하므로 지나간 행위도 장래의 행위도 고려되지 않는다."],["4-7","로마서의 놀라운 논의로 증명한다 — 그 논의의 범위와 방법. 미리 아심을 주장하는 이들은 사도가 선택이 특별하고 전적으로 은혜로 말미암았다고 주장할 때 반박된다. 변명의 논파와 사도 논의의 요약과 분석. 은혜로운 선택의 효력은 오직 믿는 자들에게 미친다는 예외와 세 가지 답 — 이 미리 아심은 사변적이지 않고 실제적이다. 그리스도의 말씀으로 증명하고, 유다에 관한 반론을 다룬다."],["8-11","고대 교부들에서 나온 반론과 아우구스티누스와 암브로시우스의 답. 아퀴나스에서 나온 반론과 답. 더 근대의 저술가들에서 나온 반론과 답 — 모순되어 보이는 구절들의 조화, 많은 이가 부름받고 적은 이가 택함받는 이유, 말씀과 믿음의 상호 동의에 근거한 반론과 그 해결. 유기에 대한 견해 — 그것은 하나님의 의로운 뜻에 근거한다."]],"vs":[["롬 9:15-16","\"내가 긍휼히 여길 자를 긍휼히 여기고 불쌍히 여길 자를 불쌍히 여기리라\" — 하나님의 주권적 자비."],["롬 9:18","\"그런즉 하나님이 자기의 원하는 자에게 긍휼을 베풀고 원하는 자를 완악하게 하시느니라\" — 자비와 완악하게 하심."],["롬 11:5-6","\"은혜로 택하신 자가 있으니 은혜로 된 것이면 행위로 말미암지 않음이니라\" — 은혜의 배타성."],["요 6:37","\"아버지께서 내게 주시는 자는 다 내게로 올 것이요\" — 주신 자."],["요 10:29","\"내 아버지께서 내게 주신 자들은 만물보다 크시니\" — 보호의 확실성."]],"hubs":["H19"],"rel":[["3-21","예정 교리의 유익과 반론."],["3-23","비방에 대한 답."],["3-24","부르심 — 선택의 나타남."]]},{"t":"c","id":"3-23","b":3,"n":23,"label":"예정 교리에 늘 씌워지는 비방에…","title":"예정 교리에 늘 씌워지는 비방에 대한 답","one":"유기는 하나님의 의로운 뜻에 근거하며, 하나님이 죄의 저자가 아니시다.","core":"예정 교리에 대한 반론은 늘 같은 자리로 돌아온다. 하나님이 유기하신다면 그것이 불공평하고, 죄의 저자가 되며, 사람이 죄를 지을 수밖에 없다는 것이다. 칼빈은 하나님이 사람에게 아무 빚도 지지 않으시며, 유기된 자는 자기 죄로 멸망한다고 답한다. 하나님은 악을 허락하시고 사용하시되 그 저자는 아니시다. 칼빈은 또한 이 교리가 어떻게 설교되어야 하는지, 목회적 지침을 제시한다. 예정은 호기심의 대상이 아니라 경건의 양식이며, 목회자는 그것을 신중하고 경건하게 다루어야 한다.","secs":[["1-5","유기를 부정하는 이들의 오류 — 선택은 유기에 반대되는 것이다. 유기를 부정하는 자들은 주제넘게 하나님의 비밀을 캔다. 첫 반론 — 자기 잘못 없이 멸망하도록 작정된 자들에게 하나님이 부당하게 진노하신다는 것. 답 — 하나님은 사람에게 어떤 빚도 지지 않으시며, 죄로 부패한 자에 대한 그의 미움은 지극히 공의롭다. 유기된 자들의 완악함은 그들 자신의 것이다. 유기된 자가 죄를 범하도록 미리 정하셨다는 예외와 사도의 말씀 해명. 아우구스티누스의 권위로 답을 확증한다. 예정으로 필연이 된 죄를 하나님이 전가하셔서는 안 된다는 반론에 대한 답."],["6-14","하나님이 아담이 타락으로 멸망하도록 정하지 않으셨다는 반론과 여러 이유로 반박. 악인이 하나님의 허락으로 멸망하는 것이지 그의 뜻으로 멸망하는 것이 아니라는 반론과 답. 예정에 따르면 하나님이 사람을 외모로 취하시는 자가 된다는 반론과 답. 죄인들이 똑같이 벌받아야 하나님의 공의가 공평하다는 반론과 답. 예정 교리가 지나친 확신과 불경건을 낳는다는 반론과 여러 답. 이 교리는 침묵하지 말고 설교되어야 한다. 사람들에게 어떻게 설교하고 전해야 하는가. 아우구스티누스에게서 온 정통 예정 교리의 요약."]],"vs":[["롬 9:20-21","\"토기장이가 진흙 한 덩이로 하나는 귀히 쓸 그릇을, 하나는 천히 쓸 그릇을 만들 권한이 없느냐\" — 주권."],["롬 9:22-23","진노의 그릇과 긍휼의 그릇 — 유기와 선택."],["딤후 2:20","\"큰 집에는 금과 은 그릇뿐 아니라 나무와 질그릇도 있어\" — 그릇의 비유."],["고전 15:10","\"나는 나의 부르심을 받은 모든 사람 중에 가장 작은 자보다 더 작은 자이나\" — 은혜로 된 것."],["마 11:25-26","\"아버지여 이것이 주의 뜻대로 이루어졌나이다\" — 하나님의 기뻐하시는 뜻."]],"hubs":["H19"],"rel":[["3-21","예정 교리."],["3-22","성경의 증거."],["3-24","부르심과 유기."],["1-18","악의 문제"]]},{"t":"c","id":"3-24","b":3,"n":24,"label":"선택은 하나님의 부르심으로…","title":"선택은 하나님의 부르심으로 확증되고, 유기된 자는 자기 죄로 멸망한다","one":"선택은 은밀하지만 효과적인 부르심으로 드러나며, 신자는 그 부르심에서 자기 선택의 확신을 얻는다.","core":"칼빈은 예정이 우리의 호기심을 채우는 교리가 아니라 신앙의 확신을 세우는 교리임을 보인다. 선택은 은밀한 하나님의 작정이지만, 효과적인 부르심으로 나타난다. 그래서 신자는 자기가 그리스도를 믿는 그 믿음에서 자기 선택의 증거를 본다. 그리스도가 선택의 거울이다. 칼빈은 성도가 넘어질 수 있다는 두려움, 많은 이가 부름받고 적은 이가 택함받는다는 말씀, 유다에 관한 문제를 차례로 다루며 신자의 확신이 무너지지 않게 한다. 그리고 유기된 자들이 자기 죄로 멸망하는 과정을 설명한다. 이 장은 예정론의 목회적 결론이다.","secs":[["1-3","하나님의 선택은 은밀하지만 효과적인 부르심으로 나타난다. 그 부르심의 성격과, 선택이 그 부르심에서 어떻게 확증되는가. 부르심이 값없다는 증명 — 그 성격과 베푸시는 방식, 하나님의 말씀, 그리고 부름받은 자들의 형편. 택한 자의 부르심에 관한 순수한 교리를 오해하는 이들 — 사람의 의지에 너무 많은 것을 돌리는 자들과 다른 이들."],["4-11","하나님이 주시는 확신을 사탄의 공격에서 변호한다. 그리스도가 이 부르심과 선택의 터이시며, 그분만 의지하지 않는 자는 자기 선택을 확신할 수 없다. 우리 선택의 또 다른 안전은 목자이신 그리스도의 보호하심이다. 택한 것처럼 보이는 자가 때로 넘어진다는 반론과 답, 그리고 바울이 안심하지 말라고 권하는 듯한 구절의 해명. 많은 이가 부름받고 적은 이가 택함받는다는 말씀의 해명 — 두 가지 부름. 유다 외에는 잃은 자가 없다는 말씀의 해명과 확신에 반대하는 반론의 논파. 확신에 반대하려 제시된 구절들과 그 예들의 해명."],["12-17","유기된 자들 — 하나님은 그들에게 복음을 들을 기회를 주지 않으시거나, 듣게 하시되 복음이 그들의 완악함에 부딪혀 열매를 맺지 못하게 하신다. 이에 대해 다른 이유를 댈 수 없고, 다만 그들이 멸망에 합당한 그릇으로 준비되었을 뿐이다. 하나님이 유기된 자를 왜 눈멀게 하시는가 — 두 가지 답과 성경의 확증. 유기에 대한 반론 — 에스겔의 구절에서 나온 것과 그 구절의 바른 이해, 바울의 구절에서 나온 둘째 반론과 그 의미, 셋째와 넷째 반론, 하나님 안에 두 가지 뜻이 있는 듯 보인다는 다섯째 반론과 답. 결론."]],"vs":[["엡 1:4","\"곧 창세 전에 그리스도 안에서 우리를 택하사\" — 그리스도 안에서의 선택."],["요 10:28","\"내가 그들에게 영생을 주노니 영원히 멸망하지 아니할 것이요\" — 견딤의 확실성."],["롬 8:30","\"미리 정하신 그들을 또한 부르시고\" — 부르심으로 나타나는 선택."],["고후 13:5","\"너희가 믿음 안에 있는가 너희 자신을 시험하고\" — 자기 확인."],["마 22:14","\"청함을 받은 자는 많되 택함을 입은 자는 적으니라\" — 두 가지 부름."],["요 6:65","\"내 아버지께서 허락하지 아니하시면 아무도 내게 올 수 없으니\" — 오는 것도 허락."]],"hubs":["H19","H12"],"rel":[["3-21","예정."],["3-22","성경의 증거."],["3-23","비방에 대한 답."],["3-02","믿음 — 선택의 증거."]]},{"t":"c","id":"3-25","b":3,"n":25,"label":"최후의 부활","title":"최후의 부활","one":"그리스도께서 다시 오실 때 죽은 자들이 몸으로 부활하여 심판을 받고, 택한 자는 영원한 행복에 들어간다.","core":"3권의 마지막은 부활과 종말이다. 칼빈은 부활 신앙이 그리스도인의 소망의 완성이라고 말한다. 부활에 대한 반론은 오래되었다 — 원자론자, 사두개인, 천년왕국론자, 죽음이 사람을 통째로 소멸시킨다고 보는 자들, 새 몸을 준다고 보는 자들. 칼빈은 하나님의 전능하심과 자연의 유비로 부활을 변증한다. 마른 뼈 환상이 그 증거다. 악인도 부활하여 심판을 받는다. 그리고 마지막으로 택한 자의 영원한 행복과 유기된 자의 영원한 비참을 다룬다. 부활은 그리스도인의 삶 전체를 앞에서 당기는 소망이다.","secs":[["1-3","우리의 부르심에서 넘어지지 않으려면 우리 구주의 마지막 오심에 대한 복된 소망으로 살아야 한다. 최후의 부활에서 택한 자에게 예비된 완전한 행복은 철학자들이 알지 못한 것이다. 최후의 부활 교리의 진리와 필요성 — 이를 확신하기 위해 하나님이 주신 증거들."],["4","하나님은 전능하시므로 죽은 자를 일으키실 수 있다. 자연의 과정으로 설명되는 부활과 마른 뼈의 환상."],["5-9","부활 교리에 대한 반론들 반박 — 무신론자, 사두개인, 천년왕국론자. 죽음이 사람 전체를 소멸시킨다고 상상하는 사색가들과 그 반박, 죽은 자의 상태와 영혼의 불멸. 새 몸이 주어진다는 약한 자들과 마니교도의 주장에 대한 반박과 여러 증거로 확증. 악인도 부활하는가 — 그렇다. 악인이 부활하는 이유와, 부활이 의인에게만 약속된 듯 말하는 이유."],["10-12","영원한 행복 — 그 탁월함은 우리의 능력을 뛰어넘는다. 지켜야 할 규칙들. 쓸데없이 머리를 아프게 하는 질문들을 피하면서도 유익한 질문들에 답한다. 택한 자의 행복과 마찬가지로 유기된 자의 비참도 한량없고 끝이 없다 — 그리스도께서 말씀하신 방식에 대한 설명."]],"vs":[["고전 15:20-22","\"그리스도께서 죽은 자 가운데서 다시 살아나사 잠자는 자들의 첫 열매가 되셨도다\" — 부활의 첫 열매."],["고전 15:52-53","\"나팔 소리가 나매 죽은 자들이 썩지 아니할 것으로 다시 살아나고\" — 마지막 나팔."],["요 5:28-29","\"무덤 속에 있는 자가 다 그의 음성을 들을 때가 오나니\" — 모든 자의 부활."],["빌 3:21","\"그가 만물을 자기에게 복종하게 하실 수 있는 자의 역사로 우리의 낮은 몸을 자기 영광의 몸의 형체와 같이 변하게 하시리라\""],["벧후 3:13","\"우리는 그의 약속대로 의가 있는 곳인 새 하늘과 새 땅을 바라보도다\""],["계 21:4","\"모든 눈물을 그 눈에서 닦아 주시니 다시 사망이 없고 애통하는 것이나 곡하는 것이나 아픈 것이 다시 있지 아니하리니\" — 영원한 행복."]],"hubs":["H20","H15"],"rel":[["3-09","장래 생명에 대한 묵상."],["2-16","그리스도의 부활과 승천."],["4-17","성찬 — 부활의 소망과의 연결"]]},{"t":"c","id":"4-01","b":4,"n":1,"label":"참된 교회와 그 연합을 지켜야 할…","title":"참된 교회와 그 연합을 지켜야 할 의무","one":"교회는 모든 경건한 자의 어머니이며, 말씀의 사역과 성례가 있는 곳에 참 교회의 표지가 있다.","core":"4권은 그리스도께서 우리를 자기와 연합시키시는 외적 방편을 다룬다. 칼빈은 교회를 신앙의 대상이 아니라 사랑과 연합의 대상으로 제시한다. 사도신경이 ‘교회를 믿는다’고 말할 때 그것은 교회를 신뢰한다는 뜻이 아니라, 하나님이 세우신 교회의 실재를 고백한다는 뜻이다. 교회는 우리의 어머니이며, 그 밖에는 구원이 없다. 그러나 교회는 눈에 보이는 곳에 존재하며, 말씀의 사역과 성례의 시행이라는 표지로 분별된다. 그 표지가 있는 한 우리는 교회를 떠나서는 안 된다. 이 장은 교회론의 기초이며, 무조건적 이탈과 무비판적 잔류를 동시에 경계한다.","secs":[["1-3","교회를 다루는 이유 — 하나님은 믿음과 선한 질서에 필요한 모든 것을 교회에 맡기셨다. 사도신경의 ‘교회’ 조항을 어떻게 이해해야 하는가, ‘성도의 교통’이 무엇을 뜻하는가, 그것이 성도들 사이의 여러 은사나 시민적 질서와 모순되지 않는가."],["4-6","교회가 어머니라 불리는 것은 그를 아는 일이 얼마나 필요한지를 보여 준다 — 교회 밖에는 구원이 없다. 하나님은 우리를 믿음 안에서 기르는 사역을 교회에 맡기셨다. 교회의 사역은 효력이 있으나 성령 없이 되는 것이 아니다."],["7-11","교회의 표지 — 교회는 어떤 점에서 보이지 않는가, 어떤 점에서 보이는가. 하나님만이 자기 백성을 아신다. 그러나 하나님은 자기 자녀를 분별할 표지를 주셨다 — 곧 말씀의 사역과 그리스도께서 제정하신 성례의 시행이다. 이 표지가 있는 교회를 떠나서는 안 되며, 그렇게 하는 자는 배교자요 탈주자다. 사탄이 이 표지를 지우거나 우리를 교회에서 떼어 놓으려 애쓰므로 표지를 더 세심히 살펴야 한다."],["12-19","여섯 가지 반론과 답 — 공적 신앙고백에 얼마간 부패가 있다는 것, 어떤 신자들의 부도덕한 삶, 교회의 상태에 대한 불만, 그 밖의 반론들. 고린도 교회와 갈라디아 교회의 형편에서 오는 답. 이 반론들의 기원과 분열주의자들의 초상. 그리스도와 신실한 종들의 예 — 그리스도와 사도들의 시대와 그 직후의 교회의 모습."],["20-27","다섯째 반론 — 죄의 용서를 받은 뒤 다시 범한 자들을 교회가 받아들여서는 안 된다는 노바티안파와 재세례파의 주장. 답 — 죄의 용서로 신자는 계속 교회 안에 머물 수 있다. 교회의 열쇠는 바로 이 유익을 위해 주어졌다. 주님의 비유와 구약의 여러 예, 예레미야와 에스겔과 솔로몬의 말씀, 그리고 제사의 예로 답한다. 신약의 예들, 일반적 원리와 사도신경의 배열. 고의로 범한 죄가 용서를 배제하는가 하는 반론."]],"vs":[["마 16:18","\"이 반석 위에 내 교회를 세우리니 음부의 권세가 이기지 못하리라\" — 교회의 기초."],["엡 4:11-13","그가 혹은 사도로, 혹은 선지자로, 혹은 목사와 교사로 주셨다 — 교회의 사역."],["마 18:20","\"두세 사람이 내 이름으로 모인 곳에는 나도 그들 중에 있느니라\" — 모임의 약속."],["행 2:42","저희가 사도의 가르침을 받아 서로 교제하며 떡을 떼며 기도하기를 힘썼다 — 교회의 표지."],["요 10:16","\"이 우리에 들지 아니한 다른 양들이 있어\" — 한 무리, 한 목자."],["고후 6:16","\"너희는 살아 계신 하나님의 성전이라\" — 교회의 정체."]],"hubs":["H21"],"rel":[["4-02","거짓 교회와 참 교회의 구별."],["4-03","교회의 교사와 목사 — 말씀 사역의 구조."],["4-12","권징 — 교회가 죄를 다루는 방식."],["4-14","성례 — 교회의 둘째 표지."]]},{"t":"c","id":"4-02","b":4,"n":2,"label":"거짓 교회와 참 교회의 비교","title":"거짓 교회와 참 교회의 비교","one":"말씀이 없는 곳에 교회가 없으며, 교회라는 이름은 말씀의 자리에 있는 곳에만 붙는다.","core":"참 교회의 표지가 말씀과 성례라면, 그 표지가 없는 곳은 교회라 부를 수 없다. 칼빈은 로마 가톨릭의 교회를 이 기준으로 평가한다. 그는 신랄하게 말한다. 말씀의 사역이 사라지고 미사라는 우상이 그 자리에 앉은 곳에 교회가 있을 수 없다. 다만 칼빈은 신중하다. 교황 아래에도 하나님의 택한 자들이 남아 있을 수 있고, 그렇기에 우리는 그들을 무조건 정죄하지 않는다. 그러나 교회라는 이름을 그 제도에 인정할 수는 없다. 이 장은 개혁파가 로마와의 관계를 끊은 이유를 교회론적으로 설명한다.","secs":[["1-3","앞 장의 정리와 이 장의 주제 — 거짓과 거짓됨이 어디에 있는가. 이 거짓됨이 교황청 아래에 만연하므로 교황청은 교회가 아니다. 그런데도 로마 가톨릭은 자기 교회를 높이고 우리가 분열했다고 비난한다. 이 증명을 성경의 예와 이성과 아우구스티누스의 권위로 확증한다."],["4-6","로마 가톨릭이 무엇을 내세우든 하나님의 말씀이 나타나지 않는 곳에는 교회가 없다. 개인적 계승을 내세우는 반론과 이단·분열이라는 고발을 성경과 아우구스티누스로 반박한다. 키프리아누스의 권위로 확증하며, 로마 가톨릭의 저주는 아무 효력이 없다."],["7-10","로마 가톨릭의 교회들은 미신과 우상숭배로 떨어져 나간 이스라엘의 회당과 같은 처지에 있다. 그 이스라엘 교회들의 성격. 그러므로 로마 가톨릭이 우리를 자기 교회의 교제로 강제하려는 것은 부당하다 — 그들의 두 가지 요구와 그에 대한 답."],["11-12","교황청을 정당히 교회라 부를 수는 없으나, 그리스도의 원수 자신의 뜻에도 불구하고 그 안에 어떤 교회들이 남아 있다. 그 지배 아래에서도 어떤 종류의 교회들이 있었으나, 그것으로 교황청에 교회라는 이름을 인정하지는 않는다."]],"vs":[["마 7:15","\"거짓 선지자들을 삼가라 양의 옷을 입고 너희에게 나아오나\" — 분별의 필요."],["요 10:4-5","양은 목자의 음성을 알고 낯선 자의 음성을 따르지 않는다 — 말씀의 표지."],["롬 10:17","믿음은 들음에서 난다 — 말씀 없는 곳에 믿음도 교회도 없다."],["계 18:4","\"내 백성아 거기서 나와 그녀의 죄에 참여하지 말라\" — 거짓 교회에서 나오라."],["왕상 18:21","\"너희가 어느 때까지 두 사이에서 머뭇거리겠느냐\" — 엘리야의 물음."]],"hubs":["H21"],"rel":[["4-01","참 교회의 표지."],["4-05","로마 교회 정치의 부패."],["4-06","수위권 주장의 문제."]]},{"t":"c","id":"4-03","b":4,"n":3,"label":"교회의 교사와 목사들 — 그 택함과…","title":"교회의 교사와 목사들 — 그 택함과 직무","one":"하나님은 사람의 사역으로 교회를 다스리시며, 목사의 직분은 말씀과 성례를 맡은 부르심이다.","core":"하나님이 교회를 다스리시는 방식은 사람의 사역을 통해서다. 칼빈은 이것이 하나님의 겸손하심(하강)을 보여 준다고 말한다. 하나님은 직접 말씀하실 수 있지만 사람의 입을 통해 말씀하시기를 기뻐하셨다. 목사의 직분은 사도·선지자·복음 전하는 자·목사·교사로 나뉘며, 이 가운데 사도와 선지자는 일시적이고 목사와 교사는 교회에 항존한다. 감독·장로·목사는 성경에서 같은 직분을 가리키는 말이며, 집사는 구제와 봉사의 직분이다. 이 장은 장로교 정치의 성경적 근거를 놓는다.","secs":[["1-3","이 장의 요약. 하나님이 교회를 다스리실 때 사람의 사역을 쓰시는 이유 — 그의 겸손하심(하강)을 나타내시고, 우리를 사랑하시며, 우리의 연약함을 붙드시기 위함. 사람의 사역이 교회 전체에 가장 유익하다. 그 유익들. 이 직분이 얼마나 존귀한 이름으로 불리는지, 그 필요성이 많은 예로 세워진다."],["4-9","교회의 직분자들 — 사도·선지자·복음 전하는 자·목사·교사. 복음 전하는 자의 직분을 사도의 직분과 함께 볼 때, 사도에 목사가 대응하고 선지자에 교사가 대응한다. 사도에게 그러하였듯 목사에게도 말씀 전파와 성례 시행이 맡겨졌다. 정상적인 경우 목사마다 한 교회가 주어져야 하나, 적절한 경우에는 변경될 수 있다. 감독·장로·목사·사역자는 사도들이 같은 뜻으로 쓴 말이며, 어떤 기능은 일시적이다. 집사의 구별 — 어떤 이는 구제를 맡고 어떤 이는 가난한 자를 돌본다."],["10-16","교회 직분자의 안수와 부르심 — 외적 부르심과 내적 부르심의 두 가지. 누가 세워져야 하는가, 어떤 방식으로 세워지는가, 누가 세우는가. 사도들이 그리스도께만 택함받은 이유, 그리고 다른 직분자의 부르심과 택함. 정규 목사는 다른 목사들에 의해 지명된다. 목사의 택함은 한 사람에게 속하지 않고 다른 목사들이 주재하며 백성이 동의하고 승인한다. 교회 직분자의 안수 형식 — 명백한 규례는 하나뿐이다. 안수의 의미."]],"vs":[["엡 4:11-12","\"그가 혹은 사도로, 혹은 선지자로, 혹은 복음 전하는 자로, 혹은 목사와 교사로 주셨으니\" — 직분의 목록."],["딤전 3:1-2","\"사람이 감독의 직분을 얻으려 함은 선한 일을 사모한다 함이라\" — 감독의 자격."],["딛 1:5","\"각 성에 장로들을 세우되\" — 장로의 세움."],["행 6:3","\"너희 가운데서 성령과 지혜가 충만하여 칭찬받는 사람 일곱을 택하라\" — 집사의 세움."],["히 5:4","\"아무도 이 영광을 스스로 취하지 않고 아론과 같이 하나님의 부르심을 받은 자라야 할지니라\" — 부르심의 필요."],["마 28:19-20","가서 모든 민족을 제자로 삼아 세례를 베풀고 가르치라 — 직무의 내용."]],"hubs":["H22"],"rel":[["4-04","원시 교회의 정치 형태."],["4-05","그 정치가 무너진 과정."],["4-12","권징 — 장로의 통치 직무."],["4-01","교회의 표지로서의 말씀 사역."]]},{"t":"c","id":"4-04","b":4,"n":4,"label":"원시 교회의 상태와 교황 이전의…","title":"원시 교회의 상태와 교황 이전의 정치 형태","one":"초대 교회는 감독과 장로의 평등한 회(consistory)로 다스렸고, 계층적 위계는 뒤에 생겼다.","core":"칼빈은 교황 이전의 교회 정치를 역사적으로 살핀다. 초대 교회에는 한 사람이 주재하는 관행이 있었으나, 그것은 질서를 위한 것이지 지배권이 아니었다. 감독과 장로는 본질에서 같은 직분이었고, 대주교와 총대주교 같은 칭호는 매우 드물게 쓰였다. 집사는 구제와 봉사를 맡았고, 교회 재산은 가난한 자와 목회자의 생계와 건물 유지에 쓰였다. 사역자의 택함에서 백성의 자유가 유지되었고, 안수는 기도와 함께 하는 단순한 예식이었다. 이 장은 후대의 위계 제도가 성경이나 초대 교회의 관행에서 온 것이 아님을 보여 주려는 역사적 논증이다.","secs":[["1-4","원시 교회의 정치 방식 — 하나님의 말씀의 규칙에 모든 점에서 일치하지는 않았다. 첫째, 질서를 지키기 위해 감독이 장로들 곧 목사들 위에 주재했다. 감독의 직무. 감독과 장로의 직무는 초대 교회에서 엄격히 지켜졌다. 대주교와 총대주교 — 거의 쓰이지 않았고, 어떤 목적으로 제정되었는가. 위계라는 이름은 부적절하며 성경에서 쓰이지 않는다."],["5-9","집사 — 초대 교회에서 둘째 위계의 사역자들, 그 본래의 직무, 감독이 그 감독자였다. 부제와 그 밖의 하위 직분. 교회 재산이 어떻게 분배되었는가 — 가난한 자의 부양, 사역자에 대한 마땅한 공급, 교회 건물의 유지. 처음에는 자유롭고 자발적이었고, 뒤에 교회 수입이 네 갈래로 나뉘었다. 교회의 일꾼(클레리키) — 문지기와 촛불지는 훈련의 성격을 지닌 예식의 이름이었다."],["10-15","사역자의 부르심 — 시간이 흐르면서 생긴 오류. 감독의 안수에서 백성의 자유가 유지되었다. 뒤에 무리의 경솔한 방종을 막기 위해 한계가 도입되었다. 이 선거 방식이 오래 지속되었다 — 그레고리우스의 증언과 그라티아누스 교령집의 문제. 고대 교회의 안수 형식과 그 점진적 변화."]],"vs":[["빌 1:1","\"그리스도 예수 안에 있는 모든 성도와 함께 있는 감독들과 집사들에게\" — 감독과 집사의 병렬."],["행 20:17","바울이 에베소에서 장로들을 불러 — 장로와 감독의 동일성."],["딛 1:5-7","장로를 세우라 하시고 이어 감독이라 부르신다 — 같은 직분."],["딤전 3:8","\"이와 같이 집사들도 정중하고\" — 집사의 자격."],["벧전 5:1-3","\"하나님의 양 무리를 치되 억지로 하지 말고\" — 목사의 태도."]],"hubs":["H22"],"rel":[["4-03","직분의 성경적 근거."],["4-05","그 정치의 타락."],["4-06","로마 수위권의 문제."]]},{"t":"c","id":"4-05","b":4,"n":5,"label":"고대의 교회 정치가 교황의 폭정으로…","title":"고대의 교회 정치가 교황의 폭정으로 완전히 무너졌다","one":"교황 아래에서 감독은 목사가 아니라 군주가 되었고, 교회의 재산과 직분은 사유물이 되었다.","core":"이 장은 교황 아래에서 교회 정치가 어떻게 변질되었는지를 고발한다. 감독은 교리를 살피지 않고 세습과 매매로 세워지고, 백성의 선택권은 사라졌다. 한 사람이 여러 교회를 맡고, 장로와 집사의 직분은 이름만 남았다. 교회 재산은 가난한 자를 돕는 데서 사라져 성직자의 사유물이 되었다. 칼빈은 이 모습이 고대 교회의 규범과 얼마나 다른지 보여 주며, 그레고리우스와 베르나르의 고발을 인용한다. 이 장은 종교개혁의 교회 개혁 요구가 단순한 반감이 아니라 교회의 본래 모습을 회복하려는 것이었음을 보여 준다.","secs":[["1-3","교황 아래에서 감독으로 세워지는 자들이 누구이며 어떤 사람들인가 — 교리를 살피지 않고, 자격을 보지 않는다. 백성의 선택권이 빼앗겼다 — 레오와 키프리아누스와 공의회가 그것을 유지했음에도. 그렇다면 정당한(canonic) 선거란 있을 수 없다. 둘째 반론에 대한 더 자세한 답 — 백성과 감독과 군주들의 오류를 드러낸다."],["4-7","교황 아래에서 장로와 집사의 택함이 없다 — 다른 목적으로 안수되기 때문이며, 사도의 규례에 어긋나기 때문이다. 이 부패에 대한 반박, 안수의 올바른 목적, 시험과 그 밖에 필요한 것들. 성직록 부여라는 둘째 부패와 그 남용. 한 사람이 다섯 내지 여섯 교회 위에 세워지는 가장 수치스러운 부패 — 많은 공의회가 그것을 심하게 정죄했다."],["8-13","직분이 어떻게 수행되는가 — 장로들 가운데 설 자리가 없는 수도사들. 수혜자(beneficiaries)와 품꾼으로 나뉜 장로들, 그리고 그 종류들. 교회에서 아무 직무도 수행하지 않는 한량한 사제에게 수혜자라는 이름이 붙은 부당함. 교구를 떠난 감독과 교구장들이 빈 이름으로 자랑하는 모습. 이 악의 씨앗은 그레고리우스 시대에도 있었고, 그는 품꾼들을 강하게 규탄했으며 베르나르는 더 날카롭게 꾸짖었다. 교황 아래의 최고 통치는 서술한 바와 같다. 이른바 교회의 사역자라는 자들의 우스꽝스러운 주장과 답."],["14-19","그들의 수치스러운 도덕 — 고대의 규례에 따르면 파문이나 면직을 당하지 않을 자가 거의 없다. 교황 아래에는 참된 집사의 직분이 없고 그 그림자만 남았다. 사제의 권력 행사에 생긴 부패. 참된 집사들이 관리하던 교회 재산을 감독과 수도원장들이 빼앗아 가난한 자를 해쳤다. 이 강도질에 대한 신성모독적 변명과 답 — 왕들이 그리스도께 절하는 것, 테오도시우스, 암브로시우스의 말. 교회를 장식한다는 또 다른 변명과 답. 집사의 직분이 교황청에 의해 완전히 전복되었다는 결론."]],"vs":[["딤전 5:17","\"잘 다스리는 장로들은 배나 존경할 자로 알되\" — 장로의 직무."],["벧전 5:2","\"너희 중에 있는 하나님의 양 무리를 치되\" — 목사의 본분."],["겔 34:2-3","\"화 있을진저 이스라엘의 목자라…… 너희가 기름을 먹고 양의 털을 입었도다\" — 목자를 꾸짖는 말씀."],["행 20:28","\"하나님이 자기 피로 사신 교회를 보살피라\" — 교회의 주인."],["마 10:8","\"너희가 거저 받았으니 거저 주라\" — 값없이 섬기는 원리."]],"hubs":["H22"],"rel":[["4-04","초대 교회의 정치."],["4-06","수위권과 그 부패."],["4-07","교황권의 성장사."],["4-12","권징의 상실."]]},{"t":"c","id":"4-06","b":4,"n":6,"label":"로마 교회의 수위권","title":"로마 교회의 수위권","one":"베드로의 우위에서 교황의 수위권을 끌어내는 논증은 성경도 역사도 뒷받침하지 않는다.","core":"로마 가톨릭은 베드로가 로마의 첫 감독이었으니 그 후계자인 교황이 교회의 머리라는 논증을 편다. 칼빈은 이를 단계별로 무너뜨린다. 첫째, 성경은 베드로에게 다른 사도들 위의 권위를 주지 않았다. 둘째, 베드로가 로마의 감독이었다는 증거는 없다. 셋째, 설령 그렇다 해도 로마 교회의 수위권은 따라오지 않는다. 넷째, 그리스도만이 교회의 머리시다. 칼빈은 교회의 통일이 한 사람의 지상 대리자 없이도 유지될 수 있다고 말한다. 초대 교회도 로마에 수위권을 주지 않았다. 이 장은 교황권의 성경적 근거를 정면으로 다룬다.","secs":[["1-5","간단한 정리와, 수위권을 아직 다루지 않은 이유. 로마 가톨릭이 수위권을 교회의 결속으로 제시한다. 문제 제기 — 유대인의 대제사장 직분에서 증명하려는 시도와 두 가지 답. 신약에서 수위권의 근거를 찾는 논증과 그 답 — 열쇠는 베드로뿐 아니라 다른 사도들에게도 주어졌다. 키프리아누스의 구절들로 다른 두 논증에 답한다."],["6-9","‘이 반석 위에’라는 말에서 교회가 베드로 위에 세워졌다는 논증에 대한 답과 성경 구절로 확증. 베드로가 어떤 점에서 우위가 있었다 해도 로마 주교의 수위권을 증명하지 못한다. 시민 통치와 교회 통치는 구별되어야 하고, 교회의 머리는 오직 그리스도시다. 그러한 직무상의 머리가 여전히 필요하다는 논증에 대한 답."],["10-13","바울이 교회를 그릴 때 그러한 직무상의 머리를 언급하지 않는다는 점. 베드로가 직무상의 머리였다 해도 교황이 그러하다는 결론이 나오지 않는다 — 바울이 베드로를 책망한 일에 근거한 논증. 로마 가톨릭의 가설을 따르면 수위권은 안디옥 교회에 속한다. 그 가설의 부조리."],["14-17","베드로는 로마의 감독이 아니었다. 같은 주제의 계속. 지상의 최고 머리 없이는 교회의 통일이 유지될 수 없다는 논증과, 세 가지 이유를 든 답. 교회의 통일에 관한 초대 시대의 견해 — 로마 교회에 어떤 수위권도 돌리지 않았다. 그리스도가 유일한 머리이심."]],"vs":[["마 16:18-19","\"너는 베드로라…… 내가 천국 열쇠를 네게 주리니\" — 수위권 논증의 근거, 그리고 그 한계."],["갈 2:11","\"게바가 안디옥에 이르렀을 때에 책망 받을 일이 있기로\" — 베드로도 책망받았다."],["엡 5:23","\"그리스도는 몸 곧 교회의 구원자시니\" — 교회의 머리."],["골 1:18","\"그는 몸인 교회의 머리시라\" — 유일한 머리."],["고전 3:11","\"그 터는 예수 그리스도밖에 누구도 놓을 수 없느니라\" — 유일한 터."],["마 23:8-10","\"너희는 랍비라 칭함을 받지 말라 너희 선생은 하나이요\" — 위계에 대한 경고."]],"hubs":["H22"],"rel":[["4-07","교황권의 역사적 성장."],["4-03","목사의 직분은 대리자가 아님."],["4-09","공의회의 권위와 교황."]]},{"t":"c","id":"4-07","b":4,"n":7,"label":"로마 교황권의 시작과 성장","title":"로마 교황권의 시작과 성장","one":"교황권은 니케아 공의회 이후의 서서히 자란 관행에서 출발해, 결국 그리스도의 통치를 대신하려는 체제가 되었다.","core":"이 장은 교황권의 역사를 다섯 단계로 추적한다. 니케아 공의회에서 로마 주교가 주재했으나 그것은 특별한 형편 때문이었다. 초대 교회는 로마 주교에게 수위권이라는 칭호를 주지 않았다. 그레고리우스는 콘스탄티노플 주교가 그 칭호를 주장할 때 격렬히 반대했다. 그러나 차츰 로마 교회의 야심이 자라, 직무를 넘어 권력을 주장했고, 결국 교황이 그리스도의 대리자라는 주장으로 정점에 이르렀다. 칼빈은 이 과정에서 교황이 적그리스도라는 단호한 판단까지 간다. 이 장은 개혁파의 교황 이해를 가장 강하게 보여 준다.","secs":[["1-4","교황권의 시작을 니케아 공의회로 본다. 칼케돈 공의회에서 로마 주교가 주재한 것은 특별한 형편 때문이며, 같은 권리가 계속되지 않았다. 고대 교부들은 로마 주교에게 수위권이라는 칭호를 주지 않았다. 그레고리우스는 콘스탄티노플 주교가 그 칭호를 요구할 때 격렬히 반대했고 자기에게는 주장하지 않았다."],["5-13","로마 교회가 수위권을 얻으려 한 야심 찬 시도 — 감독 안수, 공의회 소집, 논쟁 판결 등 로마 주교의 권한은 자기 경계 안에 머물렀다. 그들이 다른 감독을 징계했다면 자기들도 징계받았다. 지방 공의회를 소집할 권리는 자기 경계 밖에 없었다. 로마에 대한 상소는 다른 감독들이 인정하지 않았고, 프랑스와 아프리카의 감독들이 강하게 반대했다. 다른 교회에 대한 관할권이 없었음을 역사로 증명한다. 조작된 교령서신은 이렇게 찬탈한 관할권을 지탱하지 못한다. 그레고리우스 시대에 로마 주교의 권위가 넓어졌으나 그것은 다른 감독을 돕는 데 머물렀다. 그렇게 자발적으로 주어진 관할권의 범위조차 그레고리우스가 더 중요한 직무를 방해한다고 반대했다."],["14-22","대주교들의 경계를 정하는 데서 교황의 권력이 커진 과정. 로마 교회와 콘스탄티노플 교회 사이의 서열 다툼과 로마의 교만과 야심. 콘스탄티노플 주교가 로마 주교의 수위권을 빼앗으려 한 여러 시도. 포카스가 황제를 죽이고 로마에 수위권을 주었다. 교황의 폭정이 곧 세워졌고, 베르나르의 통렬한 탄식. 그레고리우스 시대 이후 로마 교회의 달라진 모습. 로마가 지금 요구하는 것을 옛사람들은 인정하지 않았다 — 그레고리우스 9세와 마르티누스의 허구. 키프리아누스와 공의회와 역사의 반대를 말할 것도 없이, 지금의 주장은 그레고리우스 자신에 의해 정죄되었다. 그레고리우스와 베르나르가 하소연한 남용은 지금 커지고 승인되었다."],["23-30","교황권 주장에 대한 가장 중요한 답 — 교황은 그리스도께서 세우신 제도가 아니다. 그리스도의 제도에 호소한 두 번째 확증. 반대로 교리와 생활에서 — 다니엘과 바울의 증거로 교황이 적그리스도임을 증명한다. 로마는 예전에 첫 번째 교회였다 해도 이제 수위권을 주장할 수 없다 — 특히 로마 교회의 비천한 처지와 관련하여. 교황들의 개인적 성격과 그들 가운데 몇 사람이 가진 불경건한 견해. 요한 22세가 영혼의 불멸에 관하여 이단이었으므로 그 이름은 교황 명단에서 지워져야 한다. 어떤 로마 주교들은 무신론자이거나 종교의 맹세한 원수였다. 그들의 부도덕한 삶, 추기경들과 로마 성직자들의 행태. 추기경들은 옛적에 로마 교회의 장로에 불과했고 감독들보다 훨씬 아래였다 — 그런데 지금은 아무 권위도 없다."]],"vs":[["마 23:9","\"땅에 있는 자를 아버지라 하지 말라\" — 영적 아버지라는 칭호의 문제."],["살후 2:4","\"그는 대적하는 자라 하나님의 성전에 앉아 자기를 보여 하나님이라 하느니라\" — 적그리스도의 표지."],["단 7:25","\"지극히 높으신 자를 대적하며 그 성도들을 괴롭게 할 것이며\" — 참람한 권세."],["요일 2:18","적그리스도가 오리라는 것을 들었는데 지금도 많은 적그리스도가 있다 — 분별."],["골 1:18","\"그는 몸인 교회의 머리시라\" — 그리스도만 머리."]],"hubs":["H22"],"rel":[["4-06","수위권 논증의 반박."],["4-05","교회 정치의 타락."],["4-09","공의회 — 교황보다 높은 권위."],["4-02","거짓 교회와 참 교회."]]},{"t":"c","id":"4-08","b":4,"n":8,"label":"교회가 신앙의 조항에 대하여 가지는…","title":"교회가 신앙의 조항에 대하여 가지는 권력","one":"교회는 믿음의 조항을 새로 만들 권력이 없고, 오직 성경에 맡겨진 것을 지키고 가르칠 뿐이다.","core":"교회의 권위는 하나님의 말씀을 전하는 자리에서만 참되다. 칼빈은 모세와 선지자와 사도와 그리스도 자신의 경우를 들어, 사역자의 권위가 그 사람에게 있지 않고 그의 직무와 말씀에 있음을 보인다. 교회는 성경의 기록에 매여 있으며, 선지자와 사도가 가르친 것 밖의 것을 가르칠 수 없다. 그러므로 공의회가 성경에 없는 새 교리를 만들 수 있다는 주장은 성경의 권위를 뒤집는 것이다. 칼빈은 교회가 모든 진리로 인도된다는 약속, 성경의 부족을 전통으로 채운다는 주장, 마태복음 18장의 말씀, 유아세례와 니케아 신조의 용어 같은 반론들을 차례로 다룬다.","secs":[["1-4","교회의 표지와 정치를 다룬 뒤 교회의 권력을 다룬다. 교회 직분자에게 주어진 권위와 권력은 그들 자신에게가 아니라 그들의 직무에 주어졌다 — 모세의 경우, 선지자들의 경우, 사도들과 그리스도 자신의 경우."],["5-9","교회는 기록된 하나님의 말씀에 매인다. 그리스도가 교회의 유일한 스승이시며, 사역자는 그의 입에서 말씀을 받아야 한다. 둘째 가르침의 방식 — 율법과 선지자. 선지자들은 교리에서 모세의 해석자였다. 마지막으로 성육신하신 그리스도께서 친히 나타난 가르침 — 이 시대에 붙은 여러 이름이 그것이 풍성함을 보여 준다. 선지자와 사도의 글에 담긴 것 밖의 것은 교회에서 가르칠 수 없다. 사도들도, 사도 직후의 사람들도, 교회 전체도 이 한계를 넘을 수 없다."],["10-13","로마의 폭군들은 다른 교리를 가르쳤다 — 공의회는 오류를 범할 수 없으므로 새 교리를 만들어도 된다는 것. 교회의 권위를 지지하는 로마의 논증들에 답한다 — 교회가 모든 진리로 인도된다는 것, 그 밖의 답변들."],["14-16","전통으로 기록된 말씀의 부족을 채워야 한다는 논증과 답. 마태복음 18:17에 근거한 논증과 답. 유아세례와 니케아 공의회의 동일본질이라는 용어에 근거한 반론과 답 — 교회는 새로운 교리를 만들지 않았고, 성경의 의미를 지킨 것이다."]],"vs":[["딤후 3:16-17","\"모든 성경은 하나님의 감동으로 된 것으로 교훈과 책망과 바르게 함과 의로 교육하기에 유익하니\" — 성경의 충족성."],["계 22:18-19","\"만일 누구든지 이것들 외에 더하면…… 더할 것이요\" — 더하고 빼는 것에 대한 경고."],["갈 1:8","\"다른 복음을 전하면 저주를 받을지어다\" — 복음의 경계."],["마 28:20","\"내가 너희에게 분부한 모든 것을 가르쳐 지키게 하라\" — 가르침의 내용."],["요 16:13","성령이 너희를 모든 진리 가운데로 인도하시리라 — 성령의 인도와 말씀."],["행 20:27","\"하나님의 모든 뜻을 가르쳐 알게 하였노라\" — 바울의 사역."]],"hubs":["H22","H02"],"rel":[["4-09","공의회의 권위."],["4-10","인간의 전통과 법."],["1-07","성경의 권위."],["2-02","교회가 성경에 매인다는 원리"]]},{"t":"c","id":"4-09","b":4,"n":9,"label":"공의회와 그 권위","title":"공의회와 그 권위","one":"공의회의 권위는 성경과 일치할 때만 참되며, 공의회도 틀릴 수 있다.","core":"칼빈은 공의회를 무조건 부정하지 않는다. 공의회는 성경의 판단 아래에서 교회의 유익을 위해 유용한 제도다. 그러나 공의회가 오류를 범할 수 없다는 주장은 받아들일 수 없다. 교회의 목자들도 사람이며, 성경은 후대 교회에도 거짓 교사들이 일어날 것을 예고한다. 실제로 공의회는 서로 모순되는 결정을 내렸고, 니케아와 칼케돈의 순수한 공의회에서도 오류가 있었다. 그래서 공의회의 결정은 성경과 일치할 때 받고, 어긋날 때는 거부한다. 이 장은 교회 권위의 상대성을 가장 선명하게 밝힌다.","secs":[["1-2","공의회의 참된 성격과 그 권위의 근원. 그리스도의 이름으로 모인다는 것의 의미."],["3-7","목사와 공의회 안에 진리가 있지 않다면 교회에 진리가 남지 않는다는 반론과, 선지자들의 예로 답한다. 신약의 구절들도 우리 시대가 같은 악에 종속될 것임을 보여 준다. 자칭 목사가 다 목사는 아니다. 총회가 교회를 대표한다는 반론과, 성경의 구절들을 들어 그 부조리를 보인다. 신약에서 같은 취지의 구절들."],["8-12","공의회는 성경과 일치하는 한에서만 권위를 가진다 — 아우구스티누스의 증언, 니케아·콘스탄티노플·에베소·칼케돈 공의회의 경우. 공의회의 상충되는 결정들 — 하나님의 진리와 일치하는 것은 받고, 어긋나는 것은 거부한다. 비교적 순수했던 공의회들의 오류와 그 네 가지 원인, 니케아 공의회의 예, 칼케돈 공의회의 예, 지방 공의회의 같은 오류. 로마 가톨릭의 회피와 세 가지 답. 교회의 교리 문제에 관한 권력 논의의 결론."],["13-14","교회가 성경을 해석하는 권력 — 해석의 근원은 어디인가. 로마 가톨릭이 자기 폭정을 세우려 한 뻔뻔한 시도와, 성경에 어긋나는 것을 그들의 권위로 승인한 일에 대한 반박."]],"vs":[["마 18:20","\"두세 사람이 내 이름으로 모인 곳에는 나도 그들 중에 있느니라\" — 공의회의 약속의 한계."],["행 15:28","\"성령과 우리는 이 요긴한 것들 외에는 아무 짐도 너희에게 지우지 아니하는 것이 좋은 줄 알았노니\" — 예루살렘 공의회의 겸손."],["갈 2:11-14","베드로도 그릇 행하여 책망받았다 — 사도도 흔들린다."],["딤후 4:3-4","\"때가 이르리니 사람이 바른 교훈을 받지 아니하며\" — 후대의 배도 예고."],["살후 2:11","\"이러므로 하나님이 미혹의 역사를 그들에게 보내사\" — 미혹의 가능성."]],"hubs":["H22","H02"],"rel":[["4-08","교회의 교리 권위."],["4-07","교황권과 공의회의 관계."],["1-07","성경의 권위."]]},{"t":"c","id":"4-10","b":4,"n":10,"label":"법을 만들 권력 — 교황과 그를…","title":"법을 만들 권력 — 교황과 그를 따르는 자들의 잔인함","one":"하나님만이 양심의 입법자이시므로, 교회가 성경에 없는 법으로 양심을 묶을 수 없다.","core":"이 장은 교회의 입법권에 대한 가장 긴 논의다. 칼빈은 양심의 정의부터 세운다. 양심은 사람이 하나님 앞에서 자기의 의무를 아는 인식이며, 하나님만 그 주인이시다. 따라서 교회가 성경에 없는 것을 신앙의 필수로 만들어 양심을 묶는 것은 폭정이다. 칼빈은 로마 가톨릭의 여러 전통이 하나님의 말씀을 무효화하고, 미신을 낳고, 그 수가 지나쳐 견딜 수 없다고 지적한다. 그러나 그는 모든 교회적 질서를 부정하지 않는다. 예배의 덕과 질서를 위한 규정은 정당하며, 다만 그것이 양심을 결박하는 법이 아니라 사랑의 질서여야 한다.","secs":[["1-6","교회가 법을 제정하는 권력 — 이것이 인간의 전통의 근원이 되었다. 이 전통들의 불경건. 많은 로마 가톨릭 전통이 지키기 어려울 뿐 아니라 불가능하다. 논의를 편하게 하기 위해 양심의 본성을 정의해야 한다. 양심의 정의와 그 예들. 바울이 양심을 위하여 관원에게 복종하라고 한 가르침이 로마의 양심 결박 교리를 지지하지 않는다."],["7-13","문제 정리와 결정의 간단한 방식. 삶의 완전한 규칙은 율법에 있다 — 하나님만이 우리의 유일한 입법자이시다. 교황의 전통은 하나님의 말씀과 모순된다. 의식에 관한 전통들의 불경건 — 참 예배 대신 미신을 세웠고, 그것으로 하나님의 계명을 무효화했다. 어떤 의식들은 무용하고 유치하며, 그 끝없는 다양함이 유대교를 불러들인다. 유대교와 이교에서 빌려온 의식들의 부조리. 그 지나친 수가 아우구스티누스의 정죄를 받았다."],["14-22","교회에 끼친 해악과 그 변명의 불가함. 미신을 미혹하며, 구경거리와 주술로 쓰이고, 이익을 위해 팔린다. 이런 모든 전통에 같은 반론이 적용된다. 전통을 옹호하는 논증과 그 답, 사도와 장로들의 예루살렘 결정에 근거한 논증과 그 해석. 사도 시대의 단순한 성찬 시행과 복잡해진 의식의 대조, 성수 사용의 예. 로마 가톨릭의 어떤 것들은 약한 형제를 위해 한때 용납될 수 있다. 로마의 전통을 지키는 것은 그리스도인의 자유와 어긋나고 양심을 고문하며 하나님을 모욕한다."],["23-32","종교에서 인간의 모든 발명은 하나님을 기쁘시게 하지 못한다 — 그 이유, 사무엘과 마노아의 예에서 나온 논증과 답. 그리스도가 이런 짐을 지라고 하셨다는 논증과 답. 합법적인 교회의 질서 — 그 기초는 모든 것이 덕과 질서 있게 되어야 한다는 일반 원칙이다. 모든 교회 질서는 이 기준으로 시험되어야 한다. 바울이 말한 ‘단정히 하고 질서 있게’의 의미. 로마의 의식에는 단정함이 없다 — 참된 단정함의 묘사와 그리스도인의 덕과 질서의 예. 하나님의 권위에 근거하고 성경에서 나오지 않으면 어떤 질서도 단정하지 않다. 그렇게 세워진 규정은 무시하거나 업신여기지 말아야 한다. 이런 규정에 관하여 지켜야 할 주의점들."]],"vs":[["골 2:20-23","\"너희가 어찌하여 세상에 사는 것과 같이 규례를 받느냐…… 이런 것들은 자의적 숭배와 겸손과 몸을 괴롭게 하는 데는 지혜로운 모양이 있으나\" — 인간의 규례."],["마 15:9","\"사람의 계명으로 교훈을 삼아 가르치니 나를 헛되이 경배하는도다\" — 전통의 위험."],["갈 5:1","\"그리스도께서 우리를 자유롭게 하려고 자유를 주셨으니\" — 양심의 자유."],["약 4:12","\"입법자와 재판관은 한 분이라\" — 유일한 입법자."],["고전 10:31-33","\"단정히 하고 질서 있게\"를 넘어 이웃의 유익을 구하라 — 질서의 목적."],["골 2:16-17","그림자에 불과한 의식 — 그리스도가 실체."]],"hubs":["H22","H17"],"rel":[["4-08","교회의 교리 권위."],["4-09","공의회."],["4-19","그리스도인의 자유."],["4-12","권징 — 바른 교회 질서."]]},{"t":"c","id":"4-11","b":4,"n":11,"label":"교회의 관할권과 그 남용 — 교황…","title":"교회의 관할권과 그 남용 — 교황 아래의 사법권","one":"교회의 관할권은 영적인 것이며, 교황은 그것을 세상 권력으로 바꾸어 놓았다.","core":"교회에는 두 가지 권력이 있다. 말씀을 전하는 권력과, 죄를 다루는 관할권이다. 칼빈은 이 관할권이 본래 영적인 성격의 것이며, 그 목적은 죄를 바로잡고 교회의 거룩을 지키는 데 있다고 말한다. 그런데 교황 아래에서 이 권력은 세상 통치로 변질되었다. 성직자는 세금을 걷고 재판을 하며 군대를 이끌었고, 콘스탄티누스의 기증이라는 허구로 세상 권력을 정당화했다. 칼빈은 초대 교회가 세상 권력과 거리를 둔 모습과 대조한다. 교회의 권력은 영혼을 다스리는 권력이며, 검을 들지 않는다.","secs":[["1-5","관할권에 관한 교회의 권력 — 그 필요성과 기원과 성격. 영적인 권력은 하나님의 말씀과 양심을 다룬다. 둘째 견해 — 교회가 권징으로 매고 푸는 방식, 교황 아래에서 열쇠의 남용. 영구한 파문의 권징, 시민 권력과 교회 권력의 구별. 파문의 권징이 영구하다는 확증 — 황제들과 그리스도인 치하에서 바르게 질서 지어졌다. 초대 교회의 교회 관할권의 목적과 쓰임 — 영적 권력은 세상 권력과 완전히 구별되었다."],["6-11","영적 권력은 한 개인에 의해 행사되지 않고 합법적인 회의 의해 행사되었다. 점진적 변화 — 먼저 성직자들이, 다음에 감독들이 그 권리를 자기 사무관들에게 넘기고 영적 관할권을 세상 재판으로 바꾸었다. 교황의 권력은 이로써 논파된다. 그리스도는 말씀의 사역자들이 시민 통치와 세상일에 관여하지 않기를 바라셨다. 로마의 반론들 — 외적 영화로 그리스도의 영광이 드러난다는 것, 그것이 직무를 방해하지 않는다는 것 — 에 대한 답. 교황 폭정의 시작과 점진적 진행의 원인 — 호기심, 야심, 폭력, 그리고 불법의 신비와 적그리스도의 사탄적 격노."],["12-16","콘스탄티누스의 기증이라는 허구의 무익함. 로마 주교들이 어떤 경로로 제국의 위엄에 이르렀는가 — 힐데브란트가 그 창시자다. 로마와 다른 영토를 어떻게 점령했는가 — 수치스러운 약탈. 시민 관할권에서 면제된다는 요구와, 초대 교회의 절제와의 대조. 초대 감독들은 세상의 침해에 굳게 맞서면서 무엇을 목표로 삼았는가."]],"vs":[["요 18:36","\"내 나라는 이 세상에 속한 것이 아니라\" — 그리스도의 나라."],["고후 10:4","\"우리의 싸우는 무기는 육신에 속한 것이 아니요\" — 영적 무기."],["마 20:25-26","\"이방인의 집권자들이 저희를 임의로 주관하고…… 너희 중에는 그렇지 않을지니\" — 권력의 성격."],["벧전 5:3","\"맡은 자들에게 주장하는 자세를 하지 말고\" — 목자의 태도."],["딤후 2:4","\"군사로 다니는 자는 자기 생활에 얽매이는 자가 하나도 없나니\" — 사역자의 거리."]],"hubs":["H22","H23"],"rel":[["4-12","권징의 바른 시행."],["4-10","인간의 법과 양심."],["4-07","교황권의 성장."]]},{"t":"c","id":"4-12","b":4,"n":12,"label":"교회의 권징과 그 주요 목적","title":"교회의 권징과 그 주요 목적","one":"권징은 그리스도의 몸을 거룩하게 지키고, 죄인을 회복시키고, 교회의 명예를 지키기 위해 주어졌다.","core":"권징은 열쇠의 권세가 구체적으로 쓰이는 자리다. 칼빈은 그 단계를 세 가지로 제시한다 — 사적 권면, 증인 앞의 책망, 그리고 파문이다. 권징의 목적은 세 가지다. 첫째, 악한 자가 그리스도의 식탁에 나아와 그리스도를 모욕하지 못하게 한다. 둘째, 선한 자가 악한 자와 섞여 부패하지 않게 한다. 셋째, 죄인이 회개하도록 이끈다. 칼빈은 권징이 지나치게 엄격해서도, 지나치게 느슨해서도 안 된다고 강조한다. 이 장에는 금식과 사제의 독신에 대한 논의도 함께 담겨 있다. 권징은 사랑과 겸손으로 행사되어야 한다.","secs":[["1-6","열쇠의 권력, 곧 교회의 공적 권징 — 그 필요성과 큰 유익. 그 여러 단계 — 사적 권면, 증인 앞의 책망, 파문. 잘못의 정도에 따른 구별과 두 종류의 징계 절차. 잘못과 악한 행위의 구별 — 후자는 더 엄하게 벌해야 한다. 권징의 목적 — 악한 자가 성찬에 나아와 그리스도를 모욕하지 못하게 하고, 선한 자가 부패하지 않게 하며, 죄인이 회개하도록. 공적 죄와 은밀한 죄가 어떻게 다루어져야 하는가, 경한 죄와 중한 죄."],["7-13","권징에서 sovereign도 예외가 아니다 — 누가 어떤 방식으로 행사해야 하는가. 어떤 정신으로 권징을 행사해야 하는가, 초대 그리스도인들이 지나치게 엄격했던 점. 절제는 교회 전체뿐 아니라 각 지체에게도 요구된다. 매고 푸는 것에 관한 그리스도의 말씀을 다르게 이해하면 왜곡된다 — 아나테마와 그 밖의 표현의 구별. 목회자들뿐 아니라 개인들도 지나친 엄격을 피해야 한다. 도나투스파가 이 점에서 크게 그릇되었고, 오늘의 재세례파도 그렇다. 개인이 아니라 대다수의 백성이 그릇되었을 때 특히 절제해야 한다."],["14-21","공적 권징의 둘째 부분 — 금식, 기도와 다른 거룩한 훈련. 신자들이 이것을 사용한 방식. 금식의 세 가지 목적 — 첫째는 특히 사적 금식에 관련된다. 둘째와 셋째 목적. 어떤 큰 위급이 있을 때 목회자들이 공적 금식과 기도를 정한다. 율법 아래에서의 예들. 금식은 세 가지로 이루어진다 — 때, 음식의 성질, 절제된 사용. 미신을 막기 위해 강조해야 할 세 가지 — 마음을 찢고 옷을 찢지 말라, 금식이 공로가 아니라는 것 등. 이런 지나침 때문에 사순절 준수가 세워졌고, 이 미신적 준수는 반박된다. 뒤에 음식 선택을 규제하는 법이 만들어졌고, 예로니모 시대에도 여러 남용이 있었다. 성직자와 관련된 권징의 둘째 부분 — 그 성격과 옛적에 얼마나 엄격했는가. 사제의 독신 — 로마 가톨릭이 교회 권징의 온 힘을 여기에 두는 문제, 그 불경한 폭정. 독신을 옹호하는 논증들과 답 — 동정이 결혼보다 우월하다는 논증도 포함된다. 독신 논의의 결론 — 이 오류를 모든 고대 저술가가 옹호하지는 않았다."]],"vs":[["마 18:15-17","\"네 형제가 죄를 범하거든 가서 너와 그 사람과만 상대하여 권고하라\" — 권징의 단계."],["고전 5:5","\"이런 자를 사탄에게 내주었으니 이는 육신은 멸하고 영은 주 예수의 날에 구원을 얻게 하려 함이라\" — 파문의 목적."],["고후 2:7","\"그런즉 너희는 그를 용서하여 위로하라\" — 회복의 목적."],["마 18:18","\"무엇이든지 너희가 땅에서 매면 하늘에서도 매일 것이요\" — 열쇠의 권세."],["살후 3:14-15","\"그를 원수 같이 여기지 말고 형제 같이 권면하라\" — 태도."],["마 6:16-18","\"금식할 때에 너희는 외식하는 자들과 같이 슬픈 기색을 내지 말라\" — 금식의 태도."]],"hubs":["H23"],"rel":[["4-11","관할권 — 권징의 근거."],["4-01","교회의 거룩."],["4-04","장로의 통치 직무."],["4-13","서원 — 양심을 묶는 문제"]]},{"t":"c","id":"4-13","b":4,"n":13,"label":"서원과 그 엉킴 — 경솔하게 서원한…","title":"서원과 그 엉킴 — 경솔하게 서원한 것이 만든 문제","one":"서원은 하나님이 받으실 만한 것이어야 하며, 경솔한 서원은 양심을 옭아매는 올무가 된다.","core":"서원은 자발적으로 하나님께 무언가를 드리겠다고 약속하는 일이다. 칼빈은 서원의 세 요소를 검토한다. 누구에게 하는가, 서원하는 우리가 누구인가, 어떤 의도로 하는가. 서원은 하나님께 하는 것이므로 하나님의 말씀에 어긋날 수 없고, 우리의 능력과 부르심을 넘어설 수 없으며, 경건과 사랑의 목적을 가져야 한다. 로마 가톨릭의 수도사 서원은 이 세 기준에서 무너진다. 그것은 하나님이 명하지 않으신 삶의 형태를 구원의 필수로 만들어 양심을 묶는다. 이 장은 그리스도인의 자유가 서원에서 어떻게 지켜져야 하는지 보여 준다.","secs":[["1-5","서원의 성격에 관한 일반 원칙. 이교도뿐 아니라 그리스도인들의 미신적 오류. 서원에서 고려할 세 가지 — 첫째, 서원은 누구에게 하는가, 곧 하나님께 한다. 하나님께서 받지 않으실 것은 서원할 수 없다. 둘째, 우리는 누구인가 — 우리의 힘을 재고 부르심을 살펴야 한다. 로마 가톨릭의 두려운 오류들. 셋째, 어떤 의도로 서원하는가 — 서원의 네 가지 목적, 그 가운데 둘은 하나님께, 둘은 사람에게 관련된다. 미래에 관련된 서원의 목적."],["6-9","서원에 관한 일반 교리 — 그리스도인의 공통된 서원, 곧 세례에서의 서원. 이 서원은 거룩하고 유익하다. 특별한 서원들. 서원에 관한 미신이 크게 만연한 이유. 수도사의 서원 — 고대 수도원과 근대 수도원의 대조. 아우구스티누스의 고대 수도사 초상."],["10-16","근대 수도사의 타락 — 경솔한 엄격, 게으름, 거짓된 완전의 자랑. 수도적 완전이라는 관념의 반박과 그것을 옹호하는 논증들. 수도적 서원을 둘째 세례(재세례)로 보는 부조리. 수도사의 부패한 풍습. 고대 수도원의 결함들."],["17-21","수도사 서원에 대한 일반적 반박. 서원이 양심을 묶는가 — 이 질문에 답한다. 수도사의 신분을 버리고 정직하게 살아가는 이들이 신의를 저버렸다고 부당하게 고발당하는 이유 — 그 고발이 부당한 이유들."]],"vs":[["전 5:4-5","\"네가 하나님께 서원하였거든 갚기를 더디게 하지 말라…… 서원하고 갚지 아니하는 것보다\" — 서원의 무게."],["신 23:21-23","\"네 하나님 여호와께 서원하였거든 갚기를 더디게 하지 말라\" — 서원의 의무."],["마 15:5-6","\"너희는 말하기를 무릇 내가 아버지나 어머니에게 드릴 것을 하나님께 드리면\" — 서원으로 계명을 무효화함."],["민 30:2","\"사람이 여호와께 서원하였거나 결심하고 서약하였으면 깨뜨리지 말고\" — 서원의 구속력."],["골 2:23","\"이런 것들은 자의적 숭배와 겸손과 몸을 괴롭게 하는 데 지혜로운 모양이 있으나\" — 인간이 만든 경건."]],"hubs":["H17","H23"],"rel":[["4-10","인간의 전통과 양심."],["4-19","그리스도인의 자유."],["4-12","권징과 교회의 질서."]]},{"t":"c","id":"4-14","b":4,"n":14,"label":"성례 일반 — 성례란 무엇인가","title":"성례 일반 — 성례란 무엇인가","one":"성례는 하나님이 우리에게 주신 약속의 인이며, 말씀과 함께 있을 때 성례가 된다.","core":"성례는 하나님이 우리의 믿음을 돕기 위해 주신 눈에 보이는 표지다. 칼빈은 성례를 말씀의 부속물로 규정한다. 말씀 없는 의식은 성례가 아니며, 성례는 하나님의 약속을 가시적으로 인치는 일이다. 성례에는 저절로 작용하는 은밀한 힘이 없다. 성례의 효력은 성령의 내적 사역에서 온다. 이 점에서 칼빈은 성례를 단순한 표지로 보는 견해와, 성례에 은혜를 붙여 놓는 견해를 함께 경계한다. 구약의 성례와 신약의 성례는 모두 그리스도를 가리키며, 본질에서 같다. 다만 신약의 성례는 더 밝고 풍성하다.","secs":[["1-8","성례 일반 — 성례의 정의와 성례라는 말의 의미. 하나님이 왜 성례로 그의 약속을 인치시는가. 성례가 완전하려면 요소와 함께 말씀이 있어야 한다 — 말씀과 약속을 요소에서 떼어 놓으려는 이들의 오류. 성례가 왜 언약의 표지라 불리는가. 악인이 받아도 표지이지만, 은혜의 표지는 믿는 자에게만 해당된다는 견해에 대한 반론과 답."],["9-16","성례 안에 은밀한 힘이 없다 — 그 모든 효력은 성령의 내적 사역에 달려 있다. 반론에 대한 답과 비유. 말씀의 선포로 믿음이 자라는 방식. 성례가 우리 믿음을 확증하는 방식과 한계. 성례를 단순한 표지로 보는 견해의 반박, 성례에 너무 많은 것을 돌리는 견해의 반박과 아우구스티누스의 증거로 확증. 앞의 견해들에 대한 더 자세한 설명."],["17-26","성례가 바르게 시행될 때 그 요소는 언제나 현존한다. 성례라는 말의 넓은 의미. 교회의 보통 성례와 그 필요성. 구약과 신약의 성례 — 두 성례의 목적은 같다, 곧 우리를 그리스도께로 인도하는 것. 구약의 성례에서 이것이 분명하고 신약의 성례에서도 분명하다. 구약과 신약의 차이에 관한 스콜라의 불경한 교리와 그 반론들에 대한 답. 신약의 성례를 초대 신학자들이 지나치게 높인 경우와 그 의미의 설명."]],"vs":[["창 17:11","\"너희는 내 언약을 지키라\"와 할례의 표지 — 언약의 인."],["마 28:19-20","세례를 베풀고 가르치라 — 말씀과 성례의 결합."],["고전 10:1-4","조상들이 다 구름 아래 있고 바다 가운데로 지나며 — 구약의 성례."],["골 2:11-12","그리스도 안에서 손으로 하지 않은 할례를 받았으니 — 구약과 신약의 연속."],["롬 4:11","아브라함이 믿음의 의의 표로 할례를 받았다 — 성례의 성격."],["막 16:16","\"믿고 세례를 받는 사람은 구원을 얻을 것이요\" — 성례와 믿음."]],"hubs":["H24","H08"],"rel":[["4-15","세례."],["4-17","성찬."],["1-07","말씀의 권위 — 성례의 근거."],["4-19","오성례 비판."]]},{"t":"c","id":"4-15","b":4,"n":15,"label":"세례","title":"세례","one":"세례는 그리스도와의 연합과 죄의 씻음과 죽음과 부활에의 참여를 인치는 표지다.","core":"세례는 우리가 그리스도와 연합하여 그의 죽으심과 부활에 참여하고, 죄 씻음을 입었다는 것을 인치는 표지다. 칼빈은 세례의 세 가지 유익을 말한다. 첫째, 죄의 용서가 우리에게 인쳐진다. 둘째, 우리의 죽임과 새 삶이 그리스도 안에 있다는 것이 보여진다. 셋째, 우리가 그리스도의 몸에 접붙여졌다는 확신이 주어진다. 이 유익은 세례의 순간에만 국한되지 않고 전 생애에 걸쳐 사용된다. 칼빈은 세례를 받은 뒤 범죄한 자들이 다시 세례를 받아야 한다는 재세례파의 주장을 반박하고, 세례의 효력이 시행하는 자의 인격에 달려 있지 않다는 점도 밝힌다.","secs":[["1-4","세례의 정의와 그 일차적 목적 — 세 가지로 이루어진다. 첫째, 죄의 용서를 증거하는 것과 이를 증명하는 성경 구절들. 용서는 과거의 죄뿐 아니라 장래의 죄에도 미친다 — 이는 방종의 구실이 될 수 없다. 이 점을 오해하는 이들에 대한 반박. 첫 중생에서 세례로 받는 용서가 뒤의 죄에는 적용되지 않는다는 통속적 견해에 대한 답."],["5-13","세례의 또 다른 유익 — 우리의 죽임과 그리스도 안의 새 삶을 보여 준다. 우리가 그리스도의 몸에 접붙여졌다는 확신을 주는 마지막 유익. 세례 요한의 사역이 뒤에 맡겨진 사역과 같다는 점, 그리고 그리스도의 부활 이후 성령의 은사가 더 풍성히 부어졌다는 사실이 이것을 부정하지 않는다. 우리가 말한 죽임과 씻음은 이스라엘 백성에게도 예표되었다. 어떤 이들이 오래전에 가르쳤고 지금도 주장하는 교리가 왜 거짓인지 이제 분명하다 — 세례는 단번에 죄를 씻는 것이 아니라, 거듭남의 상태를 인치는 것이다. 세례는 사람들 앞에서의 우리의 신앙 고백이기도 하다. 세례의 목적이 설명된 이상, 그 효력에 관한 많은 문제가 풀린다. 고넬료의 예 — 그는 성령의 은사를 먼저 받은 뒤 세례를 받았다. 세례가 시행하는 자의 손으로 평가되어서는 안 된다는 점."],["14-19","세례 이후 여러 해 동안의 신앙을 무엇으로 보는가 하는 질문에 답한다. 바울이 다시 세례를 베푼 듯 보이는 문제에 대한 답 — 그것은 세례의 반복이 아니라 유대적 세례와의 구별이다. 세례의 힘과 위엄과 유익과 목적은 이제 충분히 밝혀졌다."]],"vs":[["마 28:19","\"모든 민족을 제자로 삼아 아버지와 아들과 성령의 이름으로 세례를 베풀고\" — 세례의 명령."],["행 2:38","\"회개하고 너희 각 사람이 예수 그리스도의 이름으로 세례를 받아\" — 세례와 회개."],["롬 6:3-4","\"우리가 그의 죽으심과 합하여 세례를 받음으로 그와 함께 장사되었나니\" — 죽음과 부활의 참여."],["갈 3:27","\"누구든지 그리스도와 합하기 위하여 세례를 받은 자는 그리스도로 옷 입었느니라\" — 그리스도와의 연합."],["벧전 3:21","\"세례는…… 예수 그리스도의 부활하심으로 말미암아 선한 양심이 하나님을 향하여 찾아가는 것이라\" — 세례의 의미."],["딛 3:5","\"중생의 씻음과 성령의 새롭게 하심으로\" — 씻음의 표지."]],"hubs":["H25"],"rel":[["4-14","성례 일반."],["4-16","유아세례."],["4-03","회개."],["4-17","성찬 — 성례의 다른 하나"]]},{"t":"c","id":"4-16","b":4,"n":16,"label":"유아세례 — 그리스도의 제정과…","title":"유아세례 — 그리스도의 제정과 표지의 성격에 일치한다","one":"언약의 자녀에게는 표지가 붙는다 — 구약의 할례가 신약의 세례로 이어졌다.","core":"유아세례는 언약 신학에서 나온다. 하나님이 아브라함과 맺은 언약은 그 자녀에게까지 미쳤고, 그 언약의 표지인 할례가 아이들에게 베풀어졌다. 세례가 할례를 대신하는 표지라면, 언약의 자녀에게 세례를 베푸는 것은 자연스럽다. 칼빈은 이 논증을 중심으로 유아세례를 변증한다. 그는 성경이 아이들을 그리스도의 나라에서 제외하지 않는다는 점, 그리스도가 아이들을 축복하신 일, 사도들이 가정 전체에 세례를 베푼 일을 증거로 든다. 그리고 반대자들의 논증을 조목조목 반박한다.","secs":[["1-6","유아세례 — 이 문제를 검토하는 것이 필요하고 유익하며, 유아세례는 하나님께서 세우신 것이다. 약속을 고려함으로 증명된다 — 약속이 유아세례의 성격과 타당성을 설명한다. 물이라는 표지에 붙은 약속은 할례의 제정에서 가장 잘 드러난다. 할례와 세례의 약속과 그 표지된 실제는 하나이며 같다 — 외적 예식의 차이만 있다. 그러므로 그리스도인 부모의 자녀의 세례는 유대인 자녀의 할례만큼 타당하다. 아브라함과 맺은 언약에 근거한 유아세례의 논증과 반론, 그리고 세대를 이어가는 언약의 성격. 그리스도가 아이들을 초청하신 일에 근거한 논증과 반론."],["7-9","사도들이 유아에게 세례를 베풀지 않았다는 반론과 답, 유아세례가 새로운 것이라는 반론과 답. 유아세례의 두 가지 쓰임과 유익 — 부모에 관한 것과 세례받은 자녀에 관한 것."],["10-16","유아세례를 공격하는 이들의 논증들을 다룬다. 할례가 문자적 표지였다면 세례도 그렇게 보아야 한다. 그들이 말하는 자녀라는 개념의 차이 — 구약 아래 아브라함의 자녀와 다른 민족의 자녀. 그리스도 부활 이후 왕국의 경계가 넓어졌음에도 이 논증이 유효한가. 로마서의 한 구절 — 모든 사람이 죄를 범하였다는 말에서 나온 반론. 아브라함의 후손에게 주어진 약속의 가치와 그 무게. 세례와 할례 사이에 그들이 끌어내는 구별들은 우스꽝스럽고 근거가 없다."]],"vs":[["창 17:7","\"내가 나와 너 및 네 후손을 영구히 두려고 너와 네 후손에게 언약을 세우리라\" — 언약의 세대성."],["행 2:39","\"이 약속은 너희와 너희 자녀와 모든 먼 데 사람에게도 주신 것이라\" — 자녀에게 주어진 약속."],["막 10:14","\"어린 아이들이 내게 오는 것을 용납하고 금하지 말라 하나님의 나라가 이런 자의 것이니라\" — 아이들을 향한 초청."],["행 16:15","\"저와 그 집이 다 세례를 받고\" — 가정 세례."],["골 2:11-12","할례와 세례의 연결 — 손으로 하지 않은 할례."],["고전 7:14","\"그러하지 아니하면 너희 자녀는 부정하리니 그러나 이제는 거룩하니라\" — 언약의 자녀."]],"hubs":["H25","H08"],"rel":[["4-15","세례 — 그 본질."],["2-10","구약과 신약의 유사성."],["2-08","제2계명과 언약의 표지."]]},{"t":"c","id":"4-17","b":4,"n":17,"label":"주의 만찬과 그것이 주는 유익","title":"주의 만찬과 그것이 주는 유익","one":"주의 만찬에서 그리스도는 그의 몸과 피를 영적으로 참으로 나누어 주시며, 우리는 믿음으로 그를 받는다.","core":"이 장은 《기독교 강요》에서 가장 긴 성찬론이다. 칼빈은 성찬의 표지와 그 뜻을 설명하고, 성찬의 유익이 무엇인지 밝힌다. 성찬에서 그리스도는 우리에게 자신을 주시며, 우리는 성령의 사역으로 그리스도의 몸과 피를 영적으로 참으로 받는다. 칼빈은 두 가지 오류를 함께 배격한다. 한쪽은 화체설과 공재설이 성찬의 표지를 그리스도의 몸 자체로 만드는 오류이고, 다른 쪽은 성찬을 단순한 기념으로 축소하는 오류다. 칼빈의 강조는 영적이지만 실제적인 임재다. 그리고 그는 성찬을 합당하게 받는 준비와 자주 나아갈 것을 권한다.","secs":[["1-4","그리스도께서 성찬을 세우신 이유와 이 성례를 아는 것이 얼마나 필요한지. 표지 — 왜 떡과 포도주를 쓰셨는가. 이 성례가 경건한 자에게 주는 여러 쓰임과 유익. 주의 만찬이 구속의 큰 복과 그리스도 자신을 보여 준다는 점이 세우신 말씀에서 분명하다. 이 성례의 주요 부분."],["5-11","생명의 떡이신 그리스도를 우리가 어떻게 받아야 하는가 — 피해야 할 두 가지 허물. 그 받음은 몸과 피에 대한 실제적 참여여야 한다. 아우구스티누스와 크리소스토무스의 권위로 확증. 육과 피를 언급하지 않고 이를 영적 교통으로만 인정하는 것으로는 충분하지 않다. 설명을 위해 세 가지를 관찰한다 — 그리스도 밖에는 생명이 전혀 없다, 그리스도는 두 방면에서 생명을 가지신다, 그리고 이 생명이 우리에게 어떻게 전달되는가. 키릴루스와 일상의 예로 확증하고, 그리스도의 살이 어떻게 생명을 주는지, 우리의 교통의 성격을 설명한다. 장소의 거리는 아무 장애도 되지 못한다 — 성찬에서 그것은 빈 상징이 아니라 사도가 증언한 대로 참으로 제시된다."],["12-18","성찬의 두 부분 — 몸의 표지와 영적 실제. 로마 가톨릭의 화체설 검토와 반박. 화체설이 낳은 많은 미신. 화체설이 왜 성경과 고대의 동의에 반하여 고안되었는가, 성별(축사)이 일종의 주술로 쓰인 점. 공재설에 대한 반박과 편재 개념이 나온 경위. 이 편재는 그리스도의 두 성품을 혼동한다. 공재설에 따르는 부조리들과 정통 견해의 정직한 설명."],["19-34","성찬에서 그리스도의 참된 임재의 성격 — 그리스도의 몸과 피와의 참되고 실질적인 교통. 이 견해를 그들의 비방에서 변호하고, 제정의 말씀을 그들의 회피에 반대하여 설명한다. 표지에 표지된 것의 이름이 붙는 이유. ‘이것은 내 몸이라’는 말에 근거한 반론의 논파와 여러 반론들의 답 — 여기서 하나님의 전능을 문제 삼는 것은 아니다. 정통 견해는 그리스도의 몸의 실재와 우리 구주의 말씀으로 더 확증된다. 편재론자들의 궤변, 가시적·불가시적 임재라는 회피, 교부들의 권위가 이 오류들을 지지하지 않는다는 점 — 아우구스티누스는 이에 반대한다. 불가시적 임재의 반박 — 터툴리안과 그리스도의 말씀에서. 편재에 대한 여러 논증. 화체설·공재설·편재론의 상상된 임재와 정통 교리의 대조. 우리 구주의 참 임재의 성격 — 그 방식은 헤아릴 수 없다. 그리스도의 피와 살에 참여하는 것은 영적이지 구두적(입으로 먹는)이 아니지만 실제적이다. 스콜라의 견해와 아우구스티누스의 견해를 비교하며 악인이 어떻게 그리스도의 몸을 먹는가. 성찬 표지에 대한 숭배의 부조리 — 그리스도와 니케아 공의회, 고대 관습, 그리고 성경으로 정죄된다. 이 숭배는 성례의 본성과 제정에 어긋난다."],["35-50","성찬을 제정하신 목적들. 성례의 참된 성격과 로마의 시행의 대조. 주의 식탁에 합당하지 않게 나아가는 것의 성격과 그 큰 위험, 그리고 진지한 자기 검토라는 적절한 치료. 로마 가톨릭이 도입한 거짓 검토의 반박. 그리스도인의 검토의 성격. 성찬 시행의 외적 의식 — 많은 것이 무관하다. 자주 나아가야 할 의무 — 초대 교회의 관행과 교회 법규로 증명된다. 아우구스티누스 시대의 잦은 성찬과 크리소스토무스의 무관심에 대한 꾸짖음. 일 년에 한 번 나아가라는 교황의 명령은 저주할 만한 발명이다. 한 가지만으로 나누어 주는 것은 사탄의 발명이며, 로마의 변명을 반박한다. 초대 교회 관행의 추가 논의와 결론."]],"vs":[["고전 11:23-26","\"내가 너희에게 전한 것은 주께 받은 것이니…… 나를 기념하라\" — 제정의 말씀."],["고전 10:16","\"축복하는 바 축복의 잔은 그리스도의 피에 참여함이 아니며\" — 실제적 교통."],["요 6:53-56","\"내 살을 먹고 내 피를 마시는 자는 영생을 가졌고\" — 살과 피의 참여."],["마 26:26-28","\"이것을 받아 먹으라 이것은 내 몸이니라\" — 성찬의 표지."],["고전 11:28","\"사람은 자기를 살피고 그 후에야 이 떡을 먹고 이 잔을 마실지니\" — 자기 검토."],["요 6:63","\"살리는 것은 영이니 육은 무익하니라\" — 영적이면서 실제적인 받음."]],"hubs":["H26","H12"],"rel":[["4-14","성례 일반."],["4-18","미사 — 이 성찬의 왜곡."],["2-15","그리스도의 제사장직."],["3-25","부활의 소망과 성찬"]]},{"t":"c","id":"4-18","b":4,"n":18,"label":"로마의 미사 — 그것이 그리스도의…","title":"로마의 미사 — 그것이 그리스도의 죽으심을 모독하는 이유","one":"미사는 그리스도의 유일한 제사를 반복하는 제사가 되어, 그리스도의 십자가를 무효로 만든다.","core":"칼빈은 미사를 성찬의 가장 큰 대립물로 본다. 미사는 그리스도의 제사를 반복하고, 사제를 제사장으로 세우고, 제단을 세우고, 그리스도의 죽으심을 기억하는 대신 그것을 다시 행한다. 이것은 히브리서가 말하는 그리스도의 단번 제사를 뒤집는다. 칼빈은 다섯 가지 불경건을 지적한다. 사제를 제사장으로 대신 세우는 것, 십자가에 제단을 세우는 것, 죽으심의 기억을 없애는 것, 죽으심의 유익을 빼앗는 것, 주의 만찬을 폐하는 것. 그리고 사적인 미사, 유사(有司)의 미사도 함께 지적한다. 이 장은 종교개혁의 성찬 논쟁을 이끈 핵심이다.","secs":[["1-4","주의 만찬에 대항하여 세워진 모든 가증한 것 중 으뜸은 교황의 미사다 — 그 묘사. 미사의 다섯 가지 불경건 가운데 첫째, 유일한 제사장이신 그리스도를 대신하여 사제를 세우는 견딜 수 없는 신성모독. 미사의 두 번째 불경건 — 제단을 세움으로 그리스도의 십자가를 넘어뜨린다. 이에 대한 반론과 답."],["5-9","미사의 세 번째 불경건 — 그리스도의 죽으심에 대한 기억을 없애고 그리스도를 다시 십자가에 못 박는다. 네 번째 — 그리스도의 죽으심의 유익을 빼앗는다. 다섯 번째 — 주의 만찬을 폐한다. 주의 만찬에서는 아버지가 우리에게 그리스도를 주시지만, 미사에서는 사제가 그리스도를 아버지께 드린다. 미사의 기원. 사적인 미사는 주의 만찬의 불경한 모독이다. 이 가증한 일은 순수했던 교회에 알려지지 않았고, 하나님의 말씀에 근거가 없다."],["10-20","일부 고대 저술가들이 만찬을 제사라 부르지만 로마 가톨릭처럼 속죄의 제사는 아니다. 일부 고대 저술가들이 율법의 그림자에 지나치게 기울었다. 모세의 제사와 주의 만찬 — 감사의 제사라 불리는 것 — 사이에 큰 구별이 있어야 한다. 제사와 제사장이라는 말, 제사의 여러 종류 — 속죄의 제사와 감사의 제사. 속죄의 제사는 그리스도밖에 없다. 주의 만찬은 정당히 속죄의 제사라 불릴 수 없고, 교황의 미사는 더욱 그렇다. 그들의 허무함은 플라톤도 반박했다. 감사의 제사에는 모든 경건과 사랑의 직무가 속하며, 이 제사는 속죄의 성격을 갖지 않는다. 기도와 감사와 다른 경건의 훈련도 제사라 불리며, 그 뜻에서 주의 만찬이 감사의 제사라 불린다. 결론과 미사에 붙은 이름들. 세례와 주의 만찬에 관하여 가져야 할 견해의 정리. 그리스도인은 이 두 성례로 만족해야 하며, 사람이 정한 성례는 이 둘을 폐한다."]],"vs":[["히 9:26","\"그가 여러 번 자기를 제물로 드려야 하였을 것이나 이제는 자기를 한 번 드려 죄를 없애시고\" — 단번 제사."],["히 10:10","\"이 뜻을 따라 예수 그리스도의 몸을 단번에 드리심으로 말미암아 우리가 거룩함을 얻었노라\" — 단번의 성취."],["히 10:12","\"그는 한 영원한 제사를 드리시고 하나님 우편에 앉으셨으니\" — 완성된 제사."],["고전 11:26","\"너희가 이 떡을 먹으며 이 잔을 마실 때마다 주의 죽으심을 그가 오실 때까지 전하는 것이니라\" — 기념과 선포."],["마 26:28","\"이것은 죄 사함을 얻게 하려고 많은 사람을 위하여 흘리는 바 나의 피 곧 언약의 피니라\" — 한 번의 언약의 피."]],"hubs":["H26","H11"],"rel":[["4-17","주의 만찬의 참된 성격."],["4-19","오성례 비판."],["2-15","그리스도의 제사장직."],["3-04","그리스도의 유일한 만족"]]},{"t":"c","id":"4-19","b":4,"n":19,"label":"오성례 — 그 잘못된 주장과 근거","title":"오성례 — 그 잘못된 주장과 근거","one":"성례는 그리스도께서 세우신 것만 성례이며, 견진·고해·병자·신품·혼배는 성경의 근거가 없다.","core":"로마 가톨릭은 성례를 일곱 가지로 늘렸다. 칼빈은 그 다섯 가지가 성례일 수 없는 이유를 하나하나 밝힌다. 첫째, 성례는 그리스도께서 세우신 것이어야 하는데 이 다섯은 그리스도께서 세우신 것이 아니다. 둘째, 성례는 하나님이 주시는 약속의 표지여야 하는데 이들은 그렇지 않다. 셋째, 이들은 신약의 성례처럼 교회에 항존하는 것이 아니다. 칼빈은 견진, 고해, 병자 성사, 신품, 혼배를 차례로 검토한다. 특히 혼배를 성례로 만드는 것이 결혼을 어떻게 왜곡하는지 지적한다. 이 장은 개혁파 성례론의 경계를 분명히 한다.","secs":[["1-3","세례와 주의 만찬에 관한 논의와 이 논의의 연결. 사람이 성례를 세울 수 없다는 불경건. 성례와 다른 의식 사이의 구별을 지켜야 할 필요. 일곱 성례는 교회 저술가들에게 없다 — 아우구스티누스가 대표로서 인정한 것은 둘뿐이다."],["4-13","견진 — 고대의 성격, 곧 안수의 예식. 뒤에 도입된 이런 종류의 견진은 거짓으로 성례라 불린다. 견진을 옹호하는 로마의 논증과 답 — 그리스도의 예로 확증하려는 것, 그들의 기름을 구원의 기름이라 부르는 부조리와 불경건. 세례가 견진 없이는 완전하지 않다는 논증, 견진 없이는 온전한 그리스도인이 될 수 없다는 논증, 견진의 기름이 세례보다 뛰어나다는 논증과 그 답. 견진이 더 큰 효력이 있다는 논증. 고대 관행에서 나온 논증과 아우구스티누스의 견해. 고대의 견진은 매우 칭찬할 만하며 오늘날 교회에 회복되어야 한다."],["14-17","고해 — 로마의 신학자들의 혼란스럽고 부조리한 언어. 고대의 안수, 그리고 그것이 성례가 된 경위. 고해를 성례라 여기는 근거에 관한 로마 가톨릭 내부의 불일치. 사제의 사죄를 성례라 부르는 것이 고해를 성례라 부르는 것보다 그럴듯하다. 고해는 참으로 성례가 아니다 — 회개의 성례는 세례다."],["18-21","병자 성사 — 그것에 대한 설명, 야고보서의 말씀에 근거가 없다. 이 기름을 성례로 만드는 근거가 성경의 다른 상징들보다 나을 것이 없다. 이 기름부음이 성령께 드리는 모욕. 그리스도께서 세우지 않았으므로 성례일 수 없다. 야고보가 명한 기름부음과 로마의 기름부음 사이에는 아무 대응도 없다."],["22-33","교회의 직분(신품) — 두 가지 논의점과 그 부조리. 교회의 직분이 성례인가. 사역자들을 그리스도의 동료로 만들려는 모욕. 이 직분들의 대부분은 아무 확정된 직무도 함축하지 않는 빈 이름이다 — 로마의 구마사제. 삭발의 부조리. 삭발의 유대화된 성격, 바울이 서원 때문에 머리를 깎은 이유. 아우구스티누스가 전하는 성직 삭발의 기원과 문지기·독서자 등을 성별하는 우스꽝스러운 예식. 이른바 성품(성직)이라 불리는 높은 등급 — 사역자를 제사장으로 볼 때 그리스도께 드리는 모욕. 그리스도께서 사도들에게 숨을 불어넣으신 일을 우스꽝스럽게 흉내 내는 것, 기름부음의 부조리, 로마의 안수와 서품의 부조리, 집사 서품의 우스꽝스러운 형식, 부제."],["34-37","혼배는 성례가 아니다. 결혼이 성례라는 생각을 지지하는 성경의 말씀이 없다. 결혼이 성례라는 관념의 기원. 결혼에 대한 이 오해에서 나온 실제적 남용과 결론."]],"vs":[["엡 5:32","\"이 비밀이 크도다 나는 그리스도와 교회에 대하여 말하노라\" — 혼배를 성례로 만드는 근거로 쓰이지만 그 뜻은 다르다."],["약 5:14","\"병든 자가 있으면 교회의 장로들을 청할 것이요\" — 병자 성사의 근거로 쓰이지만 성례가 아니다."],["마 28:19","그리스도께서 세우신 성례는 세례와 만찬뿐이다 — 제정의 기준."],["행 8:17","사도들이 손을 얹어 성령을 받게 하였다 — 견진의 기원으로 쓰이지만 성례는 아니다."],["딤전 3:1","감독의 직분은 선한 일이나 성례가 아니다 — 직분의 성격."]],"hubs":["H24","H22"],"rel":[["4-14","성례 일반."],["4-15","세례."],["4-17","성찬."],["4-04","고해와 회개의 문제"]]},{"t":"c","id":"4-20","b":4,"n":20,"label":"시민 정부","title":"시민 정부","one":"국가는 하나님의 질서이며, 관원의 직무와 시민의 복종과 하나님께 대한 복종의 우선순위를 다룬다.","core":"《기독교 강요》의 마지막 장은 시민 정부다. 칼빈은 재세례파가 국가를 그리스도인에게 합당하지 않다고 보는 것을 반박한다. 국가는 하나님이 세우신 질서이며, 관원은 하나님의 사자다. 칼빈은 정부의 세 형태를 말하며 어느 것이 절대적으로 최선인지는 말할 수 없다고 신중하게 답한다. 관원의 첫째 직무는 참된 경건과 예배를 지키는 것이다. 그리고 법과 재판, 전쟁과 세금의 문제를 다룬다. 마지막으로 시민의 복종을 말하며, 하나님께 불순종하라고 명하는 권세에는 복종하지 않는다는 한계를 세운다. 이 장은 개혁파 정치 신학의 출발점이다.","secs":[["1-3","전체 작업의 마지막 부분 — 시민 정부의 제정. 그것을 다루는 것이 필요한 이유 — 재세례파를 반박하고, 군주들의 아첨꾼을 반박하고, 하나님께 감사를 일으키기 위함. 시민 정부는 그리스도인의 자유와 반대되지 않는다. 시민 정부는 그리스도의 영적 나라와 구별되어야 한다. 재세례파의 반론 — 시민 정부는 그리스도인에게 합당하지 않다, 그리스도의 신앙고백과 정면으로 배치된다. 답. 그 답의 확증과 논의의 세 갈래 — 법, 관원, 백성."],["4-8","관원의 직무가 하나님의 승인을 받았다 — 그들은 신이라 불린다, 하나님의 지혜로 세워졌다, 경건한 관원들의 예. 시민 정부는 유대인에게만 주어졌고 그리스도인에게는 아니다라는 반론과 답. 관원의 신적 임명과 이것이 관원 자신에게 주는 영향. 이 고려가 재세례파의 격노를 눌러야 한다. 세 가지 정부 형태 — 군주정, 귀족정, 민주정. 어느 것이 최선인지 단정할 수 없다."],["9-13","관원의 직무 — 첫째 관심은 그리스도교와 참된 경건을 지키는 것이다. 이것이 증명된다. 재세례파의 반론과 답. 전쟁의 합법성. 전쟁이 합법적이라는 가르침이 성경에 없다는 반론과 답. 공세와 세입을 거두는 권리."],["14-21","법 — 그 유용성, 필요성, 형태, 권위, 구성, 그리고 그 범위. 하나님의 율법의 도덕적 부분과 국가 법의 관계. 법의 종류와 정도."],["22-32","백성 — 그들이 관원에게 지는 존중과 복종, 그리고 복종의 한계. 사도들의 권면. 순종이 어디까지 미치는가 — 하나님께 불순종하라고 명하는 권세에 대해서는 복종하지 않는다는 한계와 그 근거."]],"vs":[["롬 13:1-2","\"각 사람은 위에 있는 권세들에게 복종하라 권세는 하나님으로부터 나지 않음이 없나니\" — 권세의 기원."],["롬 13:3-4","\"권세는 하나님의 사역자라\" — 관원의 직무."],["벧전 2:13-14","\"인간에 세운 모든 제도를 주를 위하여 순복하되\" — 복종의 근거."],["행 5:29","\"사람보다 하나님께 순종하는 것이 마땅하니라\" — 복종의 한계."],["딤전 2:1-2","\"임금들과 높은 지위에 있는 모든 사람을 위하여 기도하라\" — 기도의 의무."],["마 22:21","\"가이사의 것은 가이사에게, 하나님의 것은 하나님께 바치라\" — 두 영역."]],"hubs":["H27"],"rel":[["4-11","영적 관할권과 세상 권력의 구별."],["4-19","그리스도인의 자유 — 양심과 시민 질서."],["1-16","섭리와 하나님의 통치"]]},{"t":"h","id":"H01","num":1,"label":"하나님을 아는 지식","title":"하나님을 아는 지식","short":"참 지혜의 두 부분","core":"칼빈 신학의 출발점은 하나님을 아는 지식과 사람을 아는 지식의 연결이다. 하나님을 아는 지식은 정보가 아니라 경외이며, 그 경외는 예배와 순종으로 나타난다. 이 지식의 씨앗은 모든 사람의 마음에 심어져 있으나, 사람은 진리를 억누르고 우상을 세워 그것을 부패시킨다. 그래서 참 지식은 성경 안에서만 온전해지고, 그 성경의 하나님은 자신을 영으로 계시하시며 어떤 형상으로도 대체될 수 없으신 분이다. 하나님을 아는 지식은 결국 누구에게 예배를 드리는가의 문제로 귀결된다.","points":["참된 지혜 = 하나님을 아는 지식 + 우리 자신을 아는 지식. 이 둘은 서로를 낳는다.","하나님을 안다는 것은 그분의 속성을 아는 데 그치지 않고 경외와 신뢰와 예배로 이어진다.","하나님을 아는 씨앗은 본성에 있으나, 사람은 진리를 불의로 억누르고 우상을 세운다.","하나님은 영이시므로 가시적 형상으로 표현될 수 없고, 오직 그분께만 종교적 예배가 돌려진다.","성경이 가리키는 하나님은 창조의 일하심이 증언하는 그 하나님이시며, 그분이 우리 하나님이 되신다."],"keyrefs":[["1.1","1-3절","지혜의 두 부분"],["1.2","1-2절","지식의 정의와 경외"],["1.3","1-3절","마음에 심긴 신 지식"],["1.5","1-15절","창조의 극장"],["1.11","1-16절","형상과 우상"],["1.12","1-3절","오직 하나님만 예배"]],"links":["H02","H05","H07"],"subs":["H02","H05","H07"]},{"t":"h","id":"H02","num":2,"label":"계시와 성경","title":"계시와 성경","short":"말씀의 권위","core":"칼빈은 자연 계시의 충분함을 부정하지 않는다. 창조는 하나님을 넉넉히 보여 준다. 그러나 우리의 눈이 어두워 그것만으로는 창조주께 바른 지식으로 나아가지 못하므로, 하나님은 말씀을 기록으로 주셨다. 성경의 권위는 교회의 승인에서 오지 않고 성령의 내적 증거에서 온다. 성경은 그 자체의 위엄과 예언의 성취와 순교의 역사로도 신뢰할 만하지만, 그 확신은 성령이 마음에 인치실 때 생긴다. 성령과 성경은 떨어질 수 없으며, 성경 밖의 새로운 계시를 내세우는 열광주의는 경건의 근본을 무너뜨린다. 교회의 교리 권위도 공의회도 성경 아래에 있다.","points":["창조 계시는 분명하지만 충분하지 않아 성경의 안내가 필요하다.","성경의 권위는 교회의 결정이 아니라 성령의 내적 증거로 확정된다.","성경의 신뢰성은 이성 앞에서도 변증되지만, 궁극적 확신의 근거는 성령이다.","성령을 성경에서 떼어 놓는 열광주의는 성경의 모든 근거를 뽑아 버린다.","교회의 교리 권위와 공의회의 결정은 성경과 일치하는 한에서만 권위를 가진다."],"keyrefs":[["1.6","1-4절","성경의 필요"],["1.7","1-5절","성령의 증거"],["1.8","1-13절","신뢰성의 증거"],["1.9","1-3절","열광주의 반박"],["4.8","1-16절","교회의 교리 권위"],["4.9","1-14절","공의회"]],"links":["H12","H22"],"subs":["H12","H22"]},{"t":"h","id":"H03","num":3,"label":"삼위일체","title":"삼위일체","short":"한 본질, 세 위격","core":"칼빈은 삼위일체를 사변적 주제가 아니라 성경이 처음부터 가르친 진리로 다룬다. 하나님은 한 본질이시며, 그 본질은 나뉘지 않고, 그 안에 아버지와 아들과 성령 세 위격이 영원히 계신다. '위격'이라는 말은 성경의 어휘는 아니지만 성경의 진리를 지키기 위해 교회가 정당하게 사용한 용어다. 아들은 아버지의 영원한 말씀이시므로 영원하신 하나님이시고, 성령은 창조하시고 살리시며 성도를 인치시는 하나님이시다. 세 위격은 구별되지만 나뉘지 않으며, 그 구별은 하나님의 완전한 통일을 깨지 않는다. 칼빈은 아리우스파와 세르베투스를 반박하면서도, 인간의 유추로 신비를 설명하려는 시도를 경계한다.","points":["하나님은 한 본질 안에 세 위격으로 계신다 — 세 하나님이 아니시며 본질이 나뉘지 않는다.","아들은 아버지의 영원한 말씀(로고스)이시므로 창세 전부터 하나님이시다.","성령은 창조와 생명과 예언과 성도의 인치심의 주체이시며 하나님이시다.","위격의 구별은 본질의 분할이 아니며, 세 위격은 서로를 배제하지 않고 한 하나님을 이룬다.","삼위일체는 투쟁이 아니라 우리의 구원이 세 위격의 함께하시는 일임을 보여 주는 교리다."],"keyrefs":[["1.13","1-6절","본질과 위격의 정의"],["1.13","7-13절","아들의 영원한 신성"],["1.13","14-15절","성령의 신성"],["1.13","16-20절","삼위일체의 정통 교리"],["1.13","21-29절","반삼위일체 논박"]],"links":["H01","H09","H12"],"subs":["H01","H09","H12"]},{"t":"h","id":"H04","num":4,"label":"창조와 섭리","title":"창조와 섭리","short":"만물의 근원과 통치","core":"하나님은 세상을 지으시고 손을 떼신 분이 아니라, 지금도 붙드시고 다스리시는 분이다. 칼빈은 창조 기사와 천사의 세계를 통해 참 하나님을 거짓 신들과 구별하고, 섭리로 만물과 그 각 부분을 통치하시는 하나님을 증언한다. 섭리는 막연한 일반 원리가 아니라 개별 사건과 개별 사람에게 미치는 특별한 통치다. 우연은 우리의 시각일 뿐 하나님의 확정된 작정 밖에 있지 않다. 그리고 하나님은 악인의 행위까지 도구로 쓰시되 그 죄의 저자가 아니시다. 섭리 교리는 사람의 계획과 책임을 없애지 않고, 오히려 염려를 벗어 놓고 하나님을 신뢰하게 한다.","points":["창조는 하나님 홀로 하신 일이며, 세상은 여섯 날의 순서로 지어졌다.","하나님은 창조 뒤에도 만물을 붙드시고 그 각 부분을 다스리신다 — 특별 섭리.","섭리는 수단으로, 수단 없이, 수단을 거슬러서도 일하시며, 사람의 계획과 모순되지 않는다.","우연은 우리의 시각이며, 모든 일은 하나님의 확정된 작정 안에 있다.","하나님은 악인을 도구로 쓰시지만 죄의 저자가 아니시다 — 그 뜻과 악인의 뜻은 구별된다."],"keyrefs":[["1.14","1-22절","창조와 천사"],["1.15","1-8절","사람의 창조"],["1.16","1-9절","계속되는 보존과 통치"],["1.17","1-14절","섭리의 사용"],["1.18","1-4절","악인의 도구성"]],"links":["H05","H15"],"subs":["H05","H15"]},{"t":"h","id":"H05","num":5,"label":"타락과 원죄","title":"타락과 원죄","short":"아담 안에서의 부패","core":"아담의 배교로 온 인류가 저주 아래 떨어졌다. 칼빈은 이 부패가 모방으로 전해진 것이 아니라 출생으로 전해진다고 말한다. 원죄는 유전하는 본성의 부패이며, 그것이 우리를 하나님의 진노 아래 두고 마음의 모든 기능을 더럽힌다. 사람은 하나님을 알 만한 것을 알면서도 억누르고, 자기를 변호하려 든다. 원죄 교리는 사람을 비하하려는 것이 아니라, 은혜가 얼마나 철저히 필요한지를 보여 준다. 그리고 이 부패는 창조된 본성 자체가 아니라 본성에 덧붙은 것이므로, 하나님이 죄의 저자가 되지 않으신다.","points":["아담의 한 범죄로 인류 전체가 죄와 사망 아래 들어갔다.","원죄는 첫 죄의 모방이 아니라 유전하는 본성의 부패다.","부패는 영혼의 모든 기능, 곧 지성과 의지와 마음에 미친다.","그러나 이 부패는 창조된 본성이 아니라 덧붙은 성질이므로 하나님은 죄의 저자가 아니시다."],"keyrefs":[["2.1","1-11절","원죄의 정의와 유전"],["2.2","1-27절","의지의 상실"],["2.3","1-14절","전적 부패"],["3.14","1-12절","중생한 자에게 남은 부패"]],"links":["H01","H06","H04"],"subs":["H01","H06","H04"]},{"t":"h","id":"H06","num":6,"label":"자유의지와 은혜","title":"자유의지와 은혜","short":"죄의 종에서 은혜의 종으로","core":"칼빈은 자유의지 논쟁을 사람의 존엄이 아니라 구원의 주도권 문제로 다룬다. 타락한 사람에게 의지 자체는 남아 있으나 선을 택할 참된 자유는 없다. 사람의 지성은 땅의 일과 기술에서는 놀라운 능력을 보이지만, 하늘의 일에서는 스스로 빛을 내지 못한다. 의지는 억지로가 아니라 자원해서 죄를 선택하므로, 죄의 종이 된 것은 부자연스러운 일이 아니라 자기 본성에 맞는 일이다. 하나님께로 돌이키는 첫 마음부터 끝까지 은혜의 일이다. 그러나 은혜는 의지를 없애지 않고 새롭게 하여 참으로 의지하게 한다.","points":["타락한 사람에게 의지는 있으나 선을 향한 자유는 없다.","지성은 땅의 일에서 능력을 보이나 하늘의 일에서는 조명 없이 눈멀어 있다.","죄에 묶인 것은 필연이면서도 자발적이다 — 그래서 책임이 남는다.","돌이킴의 시작과 계속과 완성이 모두 은혜의 일이다.","은혜는 의지를 파괴하지 않고 새롭게 하여 기꺼이 순종하게 한다."],"keyrefs":[["2.2","1-27절","자유의지 논의"],["2.3","5-14절","필연과 자발성"],["2.4","1-8절","마음에 역사하시는 하나님"],["2.5","6-19절","논거 반박"]],"links":["H05","H12"],"subs":["H05","H12"]},{"t":"h","id":"H07","num":7,"label":"율법과 십계명","title":"율법과 십계명","short":"죄를 깨닫고 그리스도로 인도","core":"율법은 구원의 사다리가 아니라 그리스도를 가리키는 그림자이며, 우리를 그리스도께로 몰아가는 교사다. 칼빈은 도덕법의 세 가지 쓰임을 제시한다. 첫째는 죄를 깨닫게 하는 거울의 쓰임, 둘째는 악을 억제하는 쓰임, 셋째는 택한 자를 가르쳐 날마다 하나님의 뜻 안에서 자라게 하는 쓰임이다. 십계명은 하나님 사랑과 이웃 사랑의 두 돌판이며, 그 요구는 행위뿐 아니라 마음의 동기까지 미친다. 계명은 하나의 극단을 말할 때 반대편도 함께 명하거나 금한다. 율법의 저주만 그리스도 안에서 끝났고, 율법은 폐하지 않았다.","points":["율법의 목적은 율법으로 구원하는 것이 아니라 그리스도 안의 소망을 살리는 것이다.","도덕법의 세 쓰임 — 죄를 깨닫게 함, 악을 억제함, 신자를 가르침.","십계명은 두 돌판, 곧 하나님 사랑과 이웃 사랑으로 요약된다.","계명의 요구는 외적 행위를 넘어 마음의 정욕까지 미친다.","율법의 저주는 그리스도 안에서 끝났으나, 도덕법의 규범은 남아 있다."],"keyrefs":[["2.7","3-13절","율법의 세 쓰임"],["2.8","6-12절","해석의 세 규칙"],["2.8","16-50절","십계명 해설"],["2.8","51-59절","율법의 끝과 이웃"]],"links":["H08","H16","H17"],"subs":["H08","H16","H17"]},{"t":"h","id":"H08","num":8,"label":"구약과 신약의 연속성","title":"구약과 신약의 연속성","short":"하나의 언약, 다른 관리","core":"구약과 신약을 끊어 놓는 이들에게 칼빈은 두 언약의 본질적 일치를 말한다. 두 언약 모두 영생의 소망을 약속했고, 하나님의 자비 위에 세워졌고, 그리스도의 중보로 확증되었다. 구약의 성도들도 그리스도의 날을 보았다. 다만 그 보임이 흐릿했고, 복음에서는 그리스도가 몸으로 오셔서 온전히 나타나셨다. 두 언약의 차이는 실질이 아니라 관리 방식에 있다 — 미성숙과 성숙, 그림자와 실체, 문자와 영, 종과 자유, 한 민족과 모든 민족. 이 연속성 위에서 유아세례와 언약의 신학이 선다.","points":["두 언약은 본질에서 하나이며, 모두 하나님의 자비와 그리스도의 중보 위에 섰다.","구약 성도들도 그리스도의 날을 보았으나 흐릿하게 보았다.","차이는 실질이 아니라 관리 방식에 있다 — 미성숙, 그림자, 문자, 종, 한 민족.","언약은 세대를 이어 자녀에게 미친다 — 유아세례의 근거."],"keyrefs":[["2.9","1-5절","율법 아래의 그리스도"],["2.10","1-23절","유사성의 증거"],["2.11","1-14절","다섯 가지 차이"],["4.16","1-16절","언약의 자녀와 유아세례"]],"links":["H07","H25"],"subs":["H07","H25"]},{"t":"h","id":"H09","num":9,"label":"그리스도의 위격","title":"그리스도의 위격","short":"참 하나님, 참 사람","core":"중보자는 하나님과 사람 사이에 서서 양쪽에 속해야 한다. 그가 사람이 되지 않으면 우리의 형제가 되어 우리를 대신할 수 없고, 하나님이 아니시면 우리를 화목하게 할 능력이 없다. 그래서 그리스도는 우리의 육신을 입으시고 참 사람이 되셨으며, 동시에 영원하신 하나님이시다. 두 성품은 한 인격 안에서 섞이지도 나뉘지도 않는다. 칼빈은 마니교와 마르키온(참 인성 부정), 네스토리우스(인격 분리), 유티케스(성품 혼합), 세르베투스를 함께 배격한다. 이 교리는 사변적 정밀함이 아니라 우리 구원의 확실성에 봉사한다.","points":["중보자는 하나님이시며 사람이셔야 한다 — 하나님의 작정에 따른 필요.","그리스도는 참 사람의 본질을 입으셨고, 그 인성은 우리와 같되 죄가 없으시다.","한 인격 안의 두 성품은 섞이지도 나뉘지도 않는다 — 위격적 연합.","성육신은 우리를 하나님의 자녀로 삼으시기 위한 하나님의 자기 낮춤이다."],"keyrefs":[["2.12","1-7절","성육신의 필요"],["2.13","1-4절","참 인성"],["2.14","1-8절","두 성품과 한 인격"]],"links":["H10","H11","H03"],"subs":["H10","H11","H03"]},{"t":"h","id":"H10","num":10,"label":"그리스도의 삼중직","title":"그리스도의 삼중직","short":"선지자·왕·제사장","core":"그리스도는 이름뿐인 구주가 아니라 실제로 우리를 구원하시는 분이며, 그 구원은 세 직무로 이루어진다. 선지자로서 그는 하나님의 뜻을 온전히 계시하시고 우리를 가르치신다. 왕으로서 그는 성령으로 우리를 다스리시고 보호하시며 마침내 승리하신다. 제사장으로서 그는 자신을 제물로 드려 화목제물이 되시고 지금도 우리를 위하여 간구하신다. 기름 부음은 이 세 직무에 함께 관련되며, 그리스도인의 왕 같은 제사장 됨도 여기서 나온다. 세 직무를 알지 못하면 그리스도는 여전히 이름으로만 알려진 분이 된다.","points":["선지자직 — 하나님의 뜻을 온전히 계시하시고 가르치신다.","왕직 — 성령으로 다스리시고 보호하시며 영원한 나라를 세우신다.","제사장직 — 자신을 드려 화목제물이 되시고 지금도 간구하신다.","그리스도인의 왕 같은 제사장 됨은 이 삼중직에 참여하는 신분이다."],"keyrefs":[["2.15","1-6절","삼중직 전체"],["2.16","5-16절","제사장직의 실현"],["3.20","14-27절","중보와 우리의 기도"]],"links":["H09","H11","H18"],"subs":["H09","H11","H18"]},{"t":"h","id":"H11","num":11,"label":"속죄와 중보","title":"속죄와 중보","short":"우리를 대신하신 분","core":"그리스도의 구속은 그의 사역 전체를 아우른다. 그는 우리 대신 저주를 받으시고, 우리의 죄를 지고 십자가에서 하나님께 버린 바 되는 극한까지 내려가셨다. 칼빈은 '음부에 내려가셨다'는 조항을 그리스도가 우리 대신 당하신 지옥의 고통으로 해석하며, 그것을 큰 위로의 근거로 삼는다. 부활은 우리의 의를 회복하시고, 승천은 우리를 위하여 길을 여시며, 우편에 앉으심은 그가 우리를 위하여 통치하시고 간구하심을 뜻한다. 그리고 그리스도는 우리를 위하여 은혜와 구원을 값없이 얻으셨다. 이 공로는 하나님의 값없는 사랑에서 나온 것이므로, 우리의 자랑이 아니라 하나님의 약속의 근거가 된다.","points":["그리스도는 우리 대신 저주가 되시고 죄를 지셨다 — 우리의 의가 되게 하심.","음부 강하는 우리 대신 당하신 지옥의 고통이며, 큰 위로의 근거다.","부활과 승천과 우편에 앉으심은 우리의 의와 길과 통치를 이룬다.","그리스도는 우리를 위하여 은혜와 구원을 참으로 얻으셨다 — 그러나 그것은 값없는 사랑에서 나온 공로다."],"keyrefs":[["2.16","5-12절","십자가와 음부 강하"],["2.16","13-18절","부활·승천·재림"],["2.17","1-6절","그리스도의 공로"],["2.6","1-4절","그리스도 밖에는 구원이 없다"]],"links":["H09","H10","H16"],"subs":["H09","H10","H16"]},{"t":"h","id":"H12","num":12,"label":"성령과 내적 증거","title":"성령과 내적 증거","short":"말씀을 인치시는 성령","core":"성령은 그리스도와 우리를 묶는 끈이며, 그리스도의 모든 유익은 성령의 은밀한 사역으로 우리 것이 된다. 성령은 성경의 권위를 우리 마음에 인치시고, 믿음을 일으키시고, 양자의 증거를 마음에 주신다. 그래서 신앙의 확실성은 우리의 이성이 아니라 성령의 증거에서 온다. 그러나 성령은 말씀과 떨어져 일하지 않으신다. 말씀 없는 성령 체험을 내세우는 것은 사탄의 속임수를 분별하지 못하게 한다. 성령은 또한 성례와 기도 안에서 우리와 함께 일하신다.","points":["성령은 그리스도와 우리를 연합시키는 끈이다.","성경의 권위와 확실성은 성령의 내적 증거로 인쳐진다.","성령은 믿음과 양자의 증거와 성화를 일으키신다.","성령은 결코 기록된 말씀에서 떨어져 일하지 않으신다."],"keyrefs":[["3.1","1-4절","성령의 적용"],["1.7","1-5절","성경의 인치심"],["1.9","1-3절","말씀과 성령"],["4.14","9-16절","성례의 효력과 성령"]],"links":["H02","H03","H13"],"subs":["H02","H03","H13"]},{"t":"h","id":"H13","num":13,"label":"믿음","title":"믿음","short":"확실한 지식과 신뢰","core":"믿음은 맹목적 순종이 아니라 하나님의 선하신 뜻을 아는 지식이며, 그 지식은 마음에 인쳐진 확실한 신뢰다. 믿음은 성령이 일으키시는 것이므로 그 확실성은 우리의 이성에서 오지 않는다. 믿음은 하나님의 약속 위에 서고, 그 약속의 중심은 그리스도다. 그래서 믿음은 의심과 싸우며 자란다. 참 믿음에도 두려움과 흔들림이 있지만, 택한 자의 믿음은 끝내 넘어지지 않는다. 소망은 믿음에 inseparable하게 따르는 동반자이며, 칭의는 이 믿음으로 그리스도를 붙드는 것이다.","points":["믿음은 암묵적 순종이 아니라 하나님의 뜻을 아는 확실한 지식이다.","그 확실성은 우리의 이성이 아니라 성령의 증거에서 온다.","믿음은 그리스도 안에서 주어진 은혜의 약속을 붙든다.","참 믿음은 의심과 싸우고 흔들리지만 끝내 넘어지지 않는다.","소망은 믿음에 따르며, 믿음과 소망은 서로를 붙든다."],"keyrefs":[["3.2","2-5절","암묵적 신앙 반박"],["3.2","14-20절","믿음의 정의"],["3.2","21-27절","두려움과 싸움"],["3.2","41-43절","믿음과 소망"]],"links":["H12","H16","H18"],"subs":["H12","H16","H18"]},{"t":"h","id":"H14","num":14,"label":"회개","title":"회개","short":"삶의 돌이킴","core":"회개는 믿음에서 나오지만 믿음과 같지는 않다. 회개는 하나님께로 돌이키는 삶의 변화이며, 하나님을 경외함에서 나오고, 육신의 죽임과 영의 살림으로 이루어진다. 그것은 한순간에 완성되지 않고 평생 계속된다. 회개는 값싼 후회가 아니라 은혜가 사람을 실제로 바꾸는 사건이며, 그 열매는 근신과 분개와 사모함과 열심과 삶의 순결로 나타난다. 칼빈은 스콜라 신학의 고해·만족·면죄부 제도를 이 회개의 자리에 놓인 인간의 장치로 보고, 그것이 그리스도의 은혜를 흐린다고 비판한다.","points":["회개는 믿음에서 나오는 삶의 돌이킴이며, 평생 계속된다.","회개의 세 요소 — 돌이킴, 하나님 경외, 육신의 죽임과 영의 살림.","회개의 열매는 경건과 사랑과 순결로 나타난다.","고해·만족·면죄부는 성경의 회개를 왜곡한 제도이며, 그리스도의 은혜를 흐린다."],"keyrefs":[["3.3","5-9절","회개의 정의"],["3.3","15-20절","회개의 열매"],["3.4","1-39절","스콜라 고해 비판"],["3.5","1-10절","면죄부와 연옥"]],"links":["H15","H16","H23"],"subs":["H15","H16","H23"]},{"t":"h","id":"H15","num":15,"label":"중생과 성화","title":"중생과 성화","short":"새로워진 삶","core":"중생은 하나님이 우리를 새롭게 하시는 일이며, 그 열매가 성화다. 칼빈은 그리스도인의 삶을 중생의 필연적 결과로 다룬다. 그 삶의 요약은 자기 부인이며, 하나님의 영광과 이웃의 유익을 구하는 것이다. 자기 부인은 십자가를 지는 훈련과 장래 생명에 대한 묵상으로 이어지고, 현세의 위안을 감사로 누리는 절제로 균형을 잡는다. 성화는 완전하지 않다. 신자 안에는 여전히 부패가 남아 있고, 그래서 날마다 회개한다. 그러나 성화는 은혜의 확실한 열매이며, 그 열매로 우리는 자기 구원을 이루어 간다.","points":["중생은 새롭게 하시는 하나님의 일이며, 성화는 그 열매다.","그리스도인의 삶의 요약은 자기 부인이다.","십자가와 장래 생명에 대한 묵상이 자기 부인을 구체화한다.","현세의 위안은 감사로 누리되 하나님을 가로막지 않게 한다.","성화는 완전하지 않으며, 신자 안에는 여전히 부패가 남아 있다."],"keyrefs":[["3.6","1-5절","거룩으로의 부르심"],["3.7","1-10절","자기 부인"],["3.8","1-11절","십자가"],["3.9","1-6절","장래 생명"],["3.10","1-6절","현세의 사용"]],"links":["H14","H17","H20"],"subs":["H14","H17","H20"]},{"t":"h","id":"H16","num":16,"label":"칭의","title":"칭의","short":"오직 믿음, 오직 그리스도","core":"의롭다 하심은 죄인의 죄를 사하시고 그리스도의 의를 전가하여 하나님 앞에 의롭다고 선언하시는 일이다. 그것은 우리 안에 의의 성질을 넣어 주시는 것이 아니라, 그리스도에게서 의를 받아 전가받는 것이다. 그래서 칭의는 오직 믿음으로, 오직 그리스도로 이루어진다. 칼빈은 오시안더의 본질적 의와 스콜라의 행위 혼합을 함께 반박한다. 칭의는 하나님의 영광을 지키고 양심에 참된 평안을 준다. 율법의 약속과 복음의 약속은 이 지점에서 조화된다. 행위에 상을 주시는 것은 공로 때문이 아니라 아버지의 자유로운 선하심 때문이다.","points":["칭의는 죄를 사하시고 그리스도의 의를 전가하여 의롭다 선언하시는 일이다.","의는 우리 안에 실체로 들어오는 것이 아니라 그리스도에게서 전가된다.","칭의는 하나님의 영광과 양심의 평안, 이 두 가지를 함께 세운다.","율법의 약속과 복음의 약속은 그리스도 안에서 조화된다.","행위에 상을 주시는 것은 공로가 아니라 아버지의 자유로운 선하심 때문이다."],"keyrefs":[["3.11","1-4절","용어의 정의"],["3.11","5-12절","오시안더 반박"],["3.13","1-5절","두 가지 목적"],["3.17","1-15절","약속의 조화"]],"links":["H11","H13","H07"],"subs":["H11","H13","H07"]},{"t":"h","id":"H17","num":17,"label":"그리스도인의 자유","title":"그리스도인의 자유","short":"양심의 자유","core":"그리스도인의 자유는 칭의의 열매다. 그것은 세 부분으로 이루어진다. 첫째, 신자는 자기 의를 주장하지 않고 오직 그리스도만 바라본다. 둘째, 양심이 율법의 엄격한 요구에서 벗어나 자발적으로 하나님의 뜻에 순종한다. 셋째, 중간 문제에서 자유롭다 — 먹고 마시고 절기를 지키는 일에 양심이 얽매이지 않는다. 그러나 이 자유는 방종이 아니다. 자유는 약한 자를 배려하는 사랑의 질서 안에서만 참 자유다. 인간의 전통은 양심을 묶지 못하며, 서원도 마찬가지다.","points":["자유의 첫 부분 — 자기 의를 버리고 그리스도만 바라본다.","자유의 둘째 부분 — 양심이 율법의 요구에서 벗어나 자발적으로 순종한다.","자유의 셋째 부분 — 중간 문제에서 양심이 얽매이지 않는다.","자유는 사랑의 질서 안에서 쓰여야 하며, 약한 자를 배려해야 한다.","인간의 전통과 경솔한 서원은 양심을 묶지 못한다."],"keyrefs":[["3.19","1-8절","자유의 세 부분"],["3.19","9-13절","오용과 실족"],["3.19","14-16절","양심과 시민 질서"],["4.13","1-21절","서원의 문제"]],"links":["H07","H16","H23"],"subs":["H07","H16","H23"]},{"t":"h","id":"H18","num":18,"label":"기도","title":"기도","short":"믿음의 영구한 훈련","core":"기도는 하나님이 정하신 수단이며, 우리가 그 안에서 믿음을 훈련하는 자리다. 기도에는 네 가지 규칙이 있다 — 하나님을 향한 경외, 우리의 결핍을 아는 마음, 모든 교만의 버림, 응답에 대한 확신이다. 우리는 그리스도를 통해서만 하나님께 나아간다. 성인들의 중보는 그리스도의 유일한 중보를 흐리므로 거부된다. 주기도문은 우리가 하나님께 구할 수 있고 구해야 할 모든 것을 담고 있다. 기도는 신학의 결론이 아니라 신학이 사는 숨결이며, 공적 기도와 사적 기도가 함께 있어야 한다.","points":["기도는 은혜를 받는 손이며, 믿음을 훈련하는 수단이다.","기도의 네 규칙 — 경외, 결핍의 인식, 교만의 버림, 응답의 확신.","우리는 그리스도를 통해서만 하나님께 나아간다 — 성인 중보는 거부된다.","주기도문은 모든 기도의 본이며, 그 안에 구할 모든 것이 담겨 있다.","기도는 지속되어야 하며, 사적 기도와 공적 기도가 함께 있어야 한다."],"keyrefs":[["3.20","4-13절","네 가지 규칙"],["3.20","14-27절","그리스도의 중보"],["3.20","34-49절","주기도문 해설"],["3.20","50-52절","지속적 기도"]],"links":["H13","H10"],"subs":["H13","H10"]},{"t":"h","id":"H19","num":19,"label":"예정과 선택","title":"예정과 선택","short":"은혜의 주권","core":"예정은 하나님이 어떤 사람은 구원하시고 어떤 사람은 그대로 두시는 영원한 작정이다. 이 교리는 하나님이 장래의 공로를 미리 아시고 그에 따라 정하셨다는 뜻이 아니라, 하나님의 값없는 선택에서 온다. 칼빈은 이 교리가 하나님의 영광을 지키고 겸손을 낳고 구원의 확신과 양심의 평안을 준다고 말한다. 동시에 그는 지나친 호기심을 경계한다. 선택은 은밀하지만 효과적인 부르심으로 나타나고, 신자는 자기 믿음에서 그 증거를 본다. 유기된 자는 자기 죄로 멸망한다. 이 교리는 호기심의 대상이 아니라 경건의 양식이다.","points":["예정은 값없는 하나님의 작정이며, 장래의 공로에 근거하지 않는다.","이 교리는 하나님의 영광과 겸손과 구원의 확신을 세운다.","선택은 은밀하지만 효과적인 부르심으로 나타난다.","유기된 자는 자기 죄로 멸망하며, 하나님은 죄의 저자가 아니시다.","이 교리는 호기심의 대상이 아니라 경건의 양식으로 가르쳐야 한다."],"keyrefs":[["3.21","1-7절","교리의 유익"],["3.22","1-11절","성경의 증거"],["3.23","1-14절","비방에 대한 답"],["3.24","1-17절","부르심과 유기"]],"links":["H12","H13"],"subs":["H12","H13"]},{"t":"h","id":"H20","num":20,"label":"최후 부활과 종말","title":"최후 부활과 종말","short":"소망의 완성","core":"부활 신앙은 그리스도인의 소망의 완성이다. 그리스도께서 다시 오실 때 죽은 자들이 몸으로 부활하고, 택한 자는 영원한 행복에 들어가며 유기된 자는 영원한 비참에 들어간다. 칼빈은 부활을 하나님의 전능하심과 자연의 유비로 변증하며, 마른 뼈 환상을 그 증거로 든다. 부활은 현세의 삶을 경멸하게 하는 것이 아니라, 현세를 상대화하고 하늘의 소망으로 살게 한다. 장래 생명에 대한 묵상은 고난의 방향을 정해 준다. 이 소망이 없으면 그리스도인의 삶은 이 세상에 갇힌다.","points":["그리스도께서 다시 오실 때 죽은 자들이 몸으로 부활한다.","부활은 하나님의 전능하심에 근거하며, 마른 뼈 환상이 그 증거다.","택한 자의 행복과 유기된 자의 비참은 모두 끝이 없다.","부활의 소망은 현세를 상대화하고 고난에 방향을 준다."],"keyrefs":[["3.25","1-9절","부활의 진리"],["3.25","10-12절","영원한 행복과 비참"],["3.9","1-6절","장래 생명에 대한 묵상"],["2.16","13-18절","그리스도의 재림"]],"links":["H15","H11"],"subs":["H15","H11"]},{"t":"h","id":"H21","num":21,"label":"참된 교회와 표지","title":"참된 교회와 표지","short":"말씀과 성례가 있는 곳","core":"교회는 모든 경건한 자의 어머니이며, 그 밖에는 구원이 없다. 그러나 교회는 눈에 보이는 곳에 존재하며, 말씀의 사역과 성례의 시행이라는 표지로 분별된다. 그 표지가 있는 한 우리는 교회를 떠나서는 안 된다. 교회의 신앙고백에 얼마간 부패가 있고 구성원의 삶이 온전하지 않더라도, 그것만으로 교회를 떠날 수는 없다. 반대로 말씀이 사라지고 우상이 그 자리에 앉은 곳은 교회라 부를 수 없다. 이 두 원리가 개혁파 교회론의 균형이다 — 무조건적 이탈도, 무비판적 잔류도 아니다.","points":["교회는 성도의 어머니이며, 그 밖에는 구원이 없다.","참 교회의 표지는 말씀의 사역과 성례의 시행이다.","표지가 있는 한 교회를 떠나서는 안 된다 — 부패만으로 이탈할 수 없다.","말씀이 사라진 곳은 교회라 부를 수 없다."],"keyrefs":[["4.1","4-11절","어머니와 표지"],["4.1","12-19절","이탈에 대한 반론"],["4.2","1-6절","거짓 교회와 참 교회"],["4.2","7-12절","교회라는 이름의 한계"]],"links":["H22","H23","H24"],"subs":["H22","H23","H24"]},{"t":"h","id":"H22","num":22,"label":"교회의 직분과 권위","title":"교회의 직분과 권위","short":"말씀을 맡은 사역","core":"하나님은 사람의 사역으로 교회를 다스리시기를 기뻐하셨다. 목사의 직분은 말씀과 성례를 맡은 부르심이며, 사도·선지자·복음 전하는 자·목사·교사로 나뉜다. 감독·장로·목사는 성경에서 같은 직분을 가리키고, 집사는 구제와 봉사의 직분이다. 교회의 권위는 성경을 새로 만드는 권력이 아니라 성경에 맡겨진 것을 지키고 가르치는 권위다. 공의회도 성경과 일치할 때만 권위를 가진다. 교황의 수위권은 성경도 역사도 뒷받침하지 않는다. 교회의 관할권은 영적인 것이며 세상 권력이 아니다.","points":["하나님은 사람의 사역으로 교회를 다스리신다 — 목사의 직분.","감독·장로·목사는 같은 직분이며, 집사는 구제와 봉사다.","교회의 권위는 성경에 매여 있으며, 새 교리를 만들 수 없다.","공의회도 성경과 일치할 때만 권위를 가진다.","교황의 수위권은 성경과 역사의 근거가 없고, 교회의 관할권은 영적이다."],"keyrefs":[["4.3","1-9절","직분의 종류"],["4.4","1-9절","초대 교회의 정치"],["4.6","1-17절","수위권 반박"],["4.9","8-12절","공의회의 한계"],["4.11","1-11절","관할권의 성격"]],"links":["H02","H21","H23"],"subs":["H02","H21","H23"]},{"t":"h","id":"H23","num":23,"label":"교회의 권징","title":"교회의 권징","short":"거룩을 지키는 사랑","core":"권징은 열쇠의 권세가 구체적으로 쓰이는 자리다. 그 단계는 사적 권면, 증인 앞의 책망, 그리고 파문이다. 권징의 목적은 세 가지다 — 악한 자가 그리스도의 식탁에 나아와 그리스도를 모욕하지 못하게 하고, 선한 자가 부패하지 않게 하며, 죄인이 회개하도록 이끄는 것이다. 권징은 지나치게 엄격해서도 느슨해서도 안 되며, 사랑과 겸손으로 행사되어야 한다. 회복이 목적이므로 파문은 끝이 아니라 과정이다. 이 권징이 무너지면 교회의 거룩도 무너진다.","points":["권징의 단계 — 사적 권면, 증인 앞의 책망, 파문.","권징의 세 목적 — 그리스도의 모욕 방지, 교회의 순결, 죄인의 회복.","권징은 사랑과 겸손으로 행사되어야 하며, 회복이 목적이다.","권징의 상실은 교회의 거룩의 상실이다."],"keyrefs":[["4.12","1-6절","권징의 단계와 목적"],["4.12","7-13절","태도와 절제"],["4.11","1-5절","관할권의 근거"],["3.4","15-24절","고해와 열쇠의 남용"]],"links":["H22","H21","H14"],"subs":["H22","H21","H14"]},{"t":"h","id":"H24","num":24,"label":"성례 일반","title":"성례 일반","short":"약속의 보이는 인","core":"성례는 하나님이 우리의 믿음을 돕기 위해 주신 눈에 보이는 표지이며, 말씀의 부속물이다. 말씀 없는 의식은 성례가 아니며, 성례는 하나님의 약속을 가시적으로 인치는 일이다. 성례에는 저절로 작용하는 은밀한 힘이 없고, 그 효력은 성령의 내적 사역에서 온다. 그래서 칼빈은 성례를 단순한 표지로 보는 견해와 성례에 은혜를 붙여 놓는 견해를 함께 경계한다. 구약의 성례와 신약의 성례는 모두 그리스도를 가리키며 본질에서 같고, 다만 신약의 성례가 더 밝고 풍성하다. 그리스도께서 세우신 성례는 세례와 성찬 둘뿐이다.","points":["성례는 말씀에 붙은 보이는 표지이며, 말씀 없는 의식은 성례가 아니다.","성례의 효력은 성령의 내적 사역에 달려 있다.","구약과 신약의 성례는 본질에서 같고, 모두 그리스도를 가리킨다.","그리스도께서 세우신 성례는 세례와 성찬 둘뿐이다."],"keyrefs":[["4.14","1-8절","성례의 정의"],["4.14","9-16절","효력과 성령"],["4.14","17-26절","구약과 신약의 성례"],["4.19","1-3절","사람이 성례를 세울 수 없다"]],"links":["H25","H26","H08","H12"],"subs":["H25","H26","H08","H12"]},{"t":"h","id":"H25","num":25,"label":"세례","title":"세례","short":"그리스도와의 연합","core":"세례는 그리스도와의 연합과 죄의 씻음과 죽음과 부활에의 참여를 인치는 표지다. 그 유익은 세 가지다 — 죄의 용서가 인쳐지고, 우리의 죽임과 새 삶이 그리스도 안에 있음이 보여지고, 우리가 그리스도의 몸에 접붙여졌다는 확신이 주어진다. 이 유익은 세례의 순간에 국한되지 않고 전 생애에 걸쳐 사용된다. 세례의 효력은 시행하는 자의 인격에 달려 있지 않다. 언약의 자녀에게 세례를 베푸는 유아세례는 할례가 언약의 자녀에게 주어졌던 것과 같은 근거 위에 선다.","points":["세례는 그리스도와의 연합과 죄의 씻음을 인친다.","세례의 유익은 세례의 순간이 아니라 전 생애에 걸쳐 사용된다.","세례의 효력은 시행자의 인격에 달려 있지 않다.","언약의 자녀에게 세례를 베푸는 것은 할례와 같은 근거 위에 선다."],"keyrefs":[["4.15","1-4절","죄의 씻음"],["4.15","5-13절","죽임과 새 삶"],["4.15","14-19절","세례의 반복 문제"],["4.16","1-16절","유아세례"]],"links":["H24","H26","H08"],"subs":["H24","H26","H08"]},{"t":"h","id":"H26","num":26,"label":"성찬","title":"성찬","short":"그리스도의 몸과 피","core":"주의 만찬에서 그리스도는 그의 몸과 피를 영적으로 참으로 나누어 주시며, 우리는 믿음으로 그를 받는다. 성찬의 표지는 떡과 포도주이고, 그 실제는 그리스도 자신과 그의 구속의 복이다. 칼빈은 두 오류를 함께 배격한다. 화체설과 공재설은 표지를 그리스도의 몸 자체로 만들고, 다른 한쪽은 성찬을 단순한 기념으로 축소한다. 칼빈의 강조는 영적이지만 실제적인 임재다. 성찬은 합당하게 받아야 하며, 자주 나아가야 한다. 로마의 미사는 그리스도의 단번 제사를 반복하여 십자가를 무효로 만든다.","points":["성찬에서 그리스도는 그의 몸과 피를 영적으로 참으로 나누어 주신다.","표지는 떡과 포도주이며, 실제는 그리스도 자신이다.","화체설과 공재설, 그리고 단순 기념설이 모두 배격된다.","성찬은 합당하게, 자주 받아야 한다.","미사는 그리스도의 단번 제사를 반복하여 십자가를 무효로 만든다."],"keyrefs":[["4.17","1-11절","성찬의 제정과 유익"],["4.17","19-34절","참된 임재"],["4.17","35-50절","합당한 참여와 빈도"],["4.18","1-9절","미사의 불경건"]],"links":["H24","H25","H11"],"subs":["H24","H25","H11"]},{"t":"h","id":"H27","num":27,"label":"시민정부와 국가","title":"시민정부와 국가","short":"하나님의 질서로서의 국가","core":"국가는 하나님이 세우신 질서이며, 관원은 하나님의 사자다. 칼빈은 재세례파가 국가를 그리스도인에게 합당하지 않다고 보는 것을 반박한다. 정부의 형태는 여러 가지가 있을 수 있고, 어느 것이 절대적으로 최선인지는 단정할 수 없다. 관원의 첫째 직무는 참된 경건과 예배를 지키는 것이다. 시민은 관원에게 복종하되, 하나님께 불순종하라고 명하는 권세에는 복종하지 않는다. 영적인 통치와 시민적 통치는 구별되어야 하며, 이 구별 위에서 그리스도인의 자유와 시민의 의무가 함께 선다.","points":["국가는 하나님이 세우신 질서이며, 관원은 하나님의 사자다.","정부의 형태는 여러 가지가 있을 수 있고, 하나로 단정할 수 없다.","관원의 첫째 직무는 참된 경건과 예배를 지키는 것이다.","시민은 복종하되, 하나님께 불순종을 명하는 권세에는 복종하지 않는다.","영적 통치와 시민 통치는 구별되어야 한다."],"keyrefs":[["4.20","1-8절","국가의 필요와 형태"],["4.20","9-13절","관원의 직무"],["4.20","14-21절","법과 재판"],["4.20","22-32절","복종과 그 한계"],["4.11","1-5절","두 권력의 구별"]],"links":["H17","H22"],"subs":["H17","H22"]},{"t":"b","id":"B1","b":1,"label":"1권 · 하나님을 아는 지식","title":"1권 · 하나님을 아는 지식","color":"#4E8FD9","chapters":["1-01","1-02","1-03","1-04","1-05","1-06","1-07","1-08","1-09","1-10","1-11","1-12","1-13","1-14","1-15","1-16","1-17","1-18"]},{"t":"b","id":"B2","b":2,"label":"2권 · 그리스도 안의 구속","title":"2권 · 그리스도 안의 구속","color":"#D9694C","chapters":["2-01","2-02","2-03","2-04","2-05","2-06","2-07","2-08","2-09","2-10","2-11","2-12","2-13","2-14","2-15","2-16","2-17"]},{"t":"b","id":"B3","b":3,"label":"3권 · 은혜를 받는 방식","title":"3권 · 은혜를 받는 방식","color":"#63A66B","chapters":["3-01","3-02","3-03","3-04","3-05","3-06","3-07","3-08","3-09","3-10","3-11","3-12","3-13","3-14","3-15","3-16","3-17","3-18","3-19","3-20","3-21","3-22","3-23","3-24","3-25"]},{"t":"b","id":"B4","b":4,"label":"4권 · 교회와 외적 방편","title":"4권 · 교회와 외적 방편","color":"#B48AE0","chapters":["4-01","4-02","4-03","4-04","4-05","4-06","4-07","4-08","4-09","4-10","4-11","4-12","4-13","4-14","4-15","4-16","4-17","4-18","4-19","4-20"]},{"t":"r","id":"ROOT","label":"기독교 강요","title":"《기독교 강요》 1559년 최종판"}],"links":[[0,80,0],[0,84,0],[0,1,1],[0,2,1],[0,14,1],[0,107,2],[1,80,0],[1,9,1],[1,12,1],[1,107,2],[2,80,0],[2,84,0],[2,3,1],[2,4,1],[2,5,1],[2,107,2],[3,80,0],[3,84,0],[3,10,1],[3,15,1],[3,107,2],[4,83,0],[4,80,0],[4,5,1],[4,13,1],[4,107,2],[5,81,0],[5,6,1],[5,7,1],[5,107,2],[6,81,0],[6,91,0],[6,7,1],[6,8,1],[6,8,1],[6,107,2],[7,81,0],[7,91,0],[7,8,1],[7,107,2],[8,81,0],[8,91,0],[8,35,1],[8,107,2],[9,80,0],[9,82,0],[9,11,1],[9
