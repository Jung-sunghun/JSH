(function(){
var P=JSON.parse(document.getElementById('payload').textContent);
var NODES=P.nodes, LINKS=P.links, BOOKS=P.books, HC=P.hubcolor;
var n=NODES.length,i;
var adj=[];for(i=0;i<n;i++)adj.push([]);
LINKS.forEach(function(l){adj[l[0]].push([l[1],l[2]]);adj[l[1]].push([l[0],l[2]]);});
var idxOf={};NODES.forEach(function(x,k){idxOf[x.id]=k;});

/* ---------- layout ---------- */
var HUBN=0;NODES.forEach(function(x){if(x.t==='h')HUBN++;});
NODES.forEach(function(x){
  if(x.t==='r'){x.x=0;x.y=0;x.r=15;}
  else if(x.t==='b'){var a=(-135+(x.b-1)*90)*Math.PI/180;
    x.x=Math.cos(a)*168;x.y=Math.sin(a)*168;x.r=12.5;}
  else if(x.t==='h'){var ang=(-90+(x.num-1)*(360/HUBN))*Math.PI/180;
    var rr=(x.num%2)?352:314;
    x.x=Math.cos(ang)*rr;x.y=Math.sin(ang)*rr;x.r=6.4;}
});
var byBook={1:[],2:[],3:[],4:[]};
NODES.forEach(function(x){if(x.t==='c')byBook[x.b].push(x);});
[1,2,3,4].forEach(function(b){
  var arr=byBook[b], base=(-135+(b-1)*90);
  var span=82, start=base-span/2;
  arr.forEach(function(x,k){
    var f=(k+0.5)/arr.length;
    var ang=(start+span*f)*Math.PI/180;
    var rad=(k%2)?566:505;
    x.x=Math.cos(ang)*rad;x.y=Math.sin(ang)*rad;x.r=3.3;
  });
});

var cv=document.getElementById('cv'),ctx=cv.getContext('2d',{alpha:false});
var W=0,H=0,DPR=1,view={s:0.4,tx:0,ty:0,dirty:true};
var visBook={1:true,2:true,3:true,4:true},visHub=true;
/* 검색 상태 — qOn이면 qHit(검색에 걸린 장·허브)와 qCtx(그 장에 붙은 주제 허브)만 그린다 */
var qOn=false,qHit={},qCtx={};
function resize(){DPR=Math.min(window.devicePixelRatio||1,2.5);W=cv.clientWidth;H=cv.clientHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);view.dirty=true;}

function visible(x){
  if(qOn)return !!(qHit[x.i]||qCtx[x.i]);
  if(x.t==='c')return !!visBook[x.b];
  if(x.t==='b')return !!visBook[x.b];
  if(x.t==='h')return !!visHub;
  return true;
}
function colorOf(x){
  if(x.t==='c'||x.t==='b')return BOOKS[String(x.b)].color;
  if(x.t==='h')return HC;
  return '#e8eef6';
}
function applyVis(){NODES.forEach(function(x){x.hidden=!visible(x);});view.dirty=true;updateStat();}
function contentLeft(){var c=0;NODES.forEach(function(x){if(!x.hidden&&(x.t==='c'||x.t==='h'))c++;});return c>0;}

function draw(){
  view.dirty=false;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#0b0f14';ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2+view.tx,H/2+view.ty);ctx.scale(view.s,view.s);
  var halfW=W/2/view.s+60,halfH=H/2/view.s+60;
  var cx=-view.tx/view.s,cy=-view.ty/view.s;
  var x0=cx-halfW,x1=cx+halfW,y0=cy-halfH,y1=cy+halfH,k,l,m,o;
  /* 권별 구역 띠·기준 원 (검색 중에는 숨겨 결과만 또렷하게) */
  if(!qOn){
  for(i=1;i<=4;i++){
    var base=(-135+(i-1)*90), half=82/2;
    var a0=(base-half)*Math.PI/180, a1=(base+half)*Math.PI/180;
    ctx.beginPath();ctx.arc(0,0,574,a0+0.02,a1-0.02);
    ctx.strokeStyle=BOOKS[String(i)].color;ctx.globalAlpha=0.22;ctx.lineWidth=11;
    ctx.lineCap='round';ctx.stroke();ctx.globalAlpha=1;ctx.lineCap='butt';
  }
  ctx.lineWidth=1/Math.max(view.s,.01);
  var rings=[[168,'권'],[318,'장']];
  for(i=0;i<rings.length;i++){ctx.beginPath();ctx.arc(0,0,rings[i][0],0,6.2832);
    ctx.strokeStyle='rgba(120,140,165,.08)';ctx.stroke();}
  }
  /* 링크 */
  var groups={},tot=0;
  for(i=0;i<LINKS.length;i++){
    l=LINKS[i];var A=NODES[l[0]],B=NODES[l[1]];
    if(A.hidden||B.hidden)continue;
    if(!(A.x>x0&&A.x<x1&&A.y>y0&&A.y<y1)&&!(B.x>x0&&B.x<x1&&B.y>y0&&B.y<y1))continue;
    (groups[l[2]]||(groups[l[2]]=[])).push(A.x,A.y,B.x,B.y);tot++;
  }
  var style={0:'rgba(122,152,182,',1:'rgba(96,126,156,',2:'rgba(70,96,124,',3:'rgba(210,170,80,',4:'rgba(120,140,165,'};
  var al={0:0.115,1:0.20,2:0.22,3:0.16,4:0.30};
  if(qOn)al={0:0.55,1:0.45,2:0.30,3:0.55,4:0.30};
  ctx.lineWidth=qOn?Math.max(.7,1.3/view.s):Math.max(.4,.8/view.s);
  for(k in groups){
    var g=groups[k];
    ctx.strokeStyle=(style[k]||style[0])+al[k]+')';
    ctx.beginPath();
    for(var z=0;z<g.length;z+=4){ctx.moveTo(g[z],g[z+1]);ctx.lineTo(g[z+2],g[z+3]);}
    ctx.stroke();
  }
  /* 장 노드 — 권별 묶음 */
  var buckets={};
  for(i=0;i<NODES.length;i++){
    o=NODES[i];if(o.hidden||o.t!=='c')continue;
    if(o.x<x0||o.x>x1||o.y<y0||o.y>y1)continue;
    (buckets[o.b]||(buckets[o.b]=[])).push(o);
  }
  for(k in buckets){
    var arr=buckets[k];
    ctx.fillStyle=BOOKS[k].color;ctx.globalAlpha=.92;
    var w0=Math.max(1.4,3.2/view.s);
    for(i=0;i<arr.length;i++){o=arr[i];ctx.beginPath();ctx.arc(o.x,o.y,w0,0,6.2832);ctx.fill();}
    ctx.globalAlpha=1;
    /* 검색 결과 장은 흰 점으로 강조 */
    if(qOn){
      ctx.fillStyle='#ffffff';ctx.globalAlpha=.97;
      for(i=0;i<arr.length;i++){o=arr[i];if(!qHit[o.i])continue;
        ctx.beginPath();ctx.arc(o.x,o.y,Math.max(2.6,4.2/view.s),0,6.2832);ctx.fill();}
      ctx.globalAlpha=1;
      ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=Math.max(.9,1.3/view.s);
      for(i=0;i<arr.length;i++){o=arr[i];if(!qHit[o.i])continue;
        ctx.beginPath();ctx.arc(o.x,o.y,Math.max(5,7.2/view.s),0,6.2832);ctx.stroke();}
    }
  }
  /* 허브·권·뿌리 */
  var labels=[];
  for(i=0;i<NODES.length;i++){
    o=NODES[i];if(o.hidden||o.t==='c')continue;
    if(o.x<x0||o.x>x1||o.y<y0||o.y>y1)continue;
    var r=o.r*(o.t==='b'?1.35:1);
    ctx.beginPath();ctx.arc(o.x,o.y,r,0,6.2832);
    ctx.fillStyle=colorOf(o);ctx.fill();
    ctx.lineWidth=1.3/view.s;ctx.strokeStyle=o.t==='h'?'rgba(255,244,210,.75)':'rgba(255,255,255,.8)';ctx.stroke();
    if(o.i===selected){ctx.beginPath();ctx.arc(o.x,o.y,r+5/view.s,0,6.2832);
      ctx.strokeStyle='#ffffff';ctx.lineWidth=2/view.s;ctx.stroke();}
    labels.push(o);
  }
  if(selected>=0&&NODES[selected].t==='c'){
    o=NODES[selected];
    if(!(o.x<x0||o.x>x1||o.y<y0||o.y>y1)){
      ctx.beginPath();ctx.arc(o.x,o.y,o.r+5/view.s,0,6.2832);
      ctx.strokeStyle='#ffffff';ctx.lineWidth=1.6/view.s;ctx.stroke();
    }
  }
  /* 라벨 */
  ctx.textAlign='center';ctx.textBaseline='middle';
  var placed=[];
  function free(px,py,w2,h2){
    for(var q=0;q<placed.length;q++){var p=placed[q];
      if(Math.abs(px-p[0])<w2+p[2]&&Math.abs(py-p[1])<h2+p[3])return false;}
    return true;
  }
  labels.sort(function(a,b){return b.r-a.r;});
  for(i=0;i<labels.length;i++){
    o=labels[i];
    var fs=(o.t==='b')?Math.max(11,12.5/view.s):Math.max(9.5,10.5/view.s);
    ctx.font=(o.t==='b'?'700 ':'600 ')+fs+'px system-ui,sans-serif';
    var lim=(o.t==='h')?12:16;
    var txt=o.label.length>lim?o.label.slice(0,lim-1)+'…':o.label;
    var up=(o.t!=='h')?true:(o.num%2===1);
    var sy=up?(o.y-o.r-fs*.95):(o.y+o.r+fs*1.05);
    var wpx=ctx.measureText(txt).width;
    if(!free(o.x,sy,wpx/2+3,fs*.72))continue;
    placed.push([o.x,sy,wpx/2+3,fs*.72]);
    ctx.fillStyle=o.t==='h'?'rgba(246,226,168,.96)':(o.t==='r'?'rgba(255,255,255,.95)':'rgba(214,230,246,.95)');
    ctx.fillText(txt,o.x,sy);
  }
  /* 확대 시 장 라벨 */
  if(view.s>1.15){
    var shown=0;
    for(i=0;i<NODES.length&&shown<70;i++){
      o=NODES[i];if(o.hidden||o.t!=='c')continue;
      if(o.x<x0||o.x>x1||o.y<y0||o.y>y1)continue;
      var f2=Math.max(8.5/view.s,9);
      ctx.font='500 '+f2+'px system-ui,sans-serif';
      var t2=o.id+' '+o.label;
      if(t2.length>24)t2=t2.slice(0,23)+'…';
      var w2=ctx.measureText(t2).width/2+3,sy2=o.y-o.r-f2*.95;
      if(!free(o.x,sy2,w2,f2*1.0))continue;
      placed.push([o.x,sy2,w2,f2*.72]);
      ctx.fillStyle='rgba(198,212,228,.9)';ctx.fillText(t2,o.x,sy2);shown++;
    }
  }
  /* 검색 중에는 걸린 장의 이름을 축소 배율에서도 보여 준다 */
  var qfs=Math.max(9.5,10.5/Math.max(view.s,.5));
  if(qOn&&qfs*view.s>=7){
    for(i=0;i<NODES.length;i++){
      o=NODES[i];if(o.t!=='c'||!qHit[o.i])continue;
      if(o.x<x0||o.x>x1||o.y<y0||o.y>y1)continue;
      var fq=qfs;
      ctx.font='600 '+fq+'px system-ui,sans-serif';
      var tq=o.b+'권 '+o.n+'장 '+o.label;
      if(tq.length>26)tq=tq.slice(0,25)+'…';
      var wq=ctx.measureText(tq).width/2+3,syq=o.y+Math.max(7,9/view.s)+fq*.95;
      if(!free(o.x,syq,wq,fq*.72))continue;
      placed.push([o.x,syq,wq,fq*.72]);
      ctx.fillStyle='rgba(236,244,252,.95)';ctx.fillText(tq,o.x,syq);
    }
  }
  if(selected>=0&&NODES[selected].t==='c'&&view.s<=1.15){    var so=NODES[selected];
    if(!(so.x<x0||so.x>x1||so.y<y0||so.y>y1)){
      var f3=Math.max(10/view.s,10);
      ctx.font='700 '+f3+'px system-ui,sans-serif';
      var t3=so.b+'권 '+so.n+'장';
      ctx.fillStyle='rgba(255,226,156,.98)';
      ctx.fillText(t3,so.x,so.y-so.r-f3*1.05);
    }
  }
  ctx.restore();
  if(selected>=0){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.font='600 12px system-ui,sans-serif';ctx.fillStyle='rgba(242,193,78,.95)';
    ctx.textAlign='center';
    var tsel=NODES[selected].t==='c'?(NODES[selected].b+'권 '+NODES[selected].n+'장'):NODES[selected].label;
    ctx.fillText(tsel,W/2,H-(footerPad()+16));
  }
}

/* ---------- interaction ---------- */
function screenToWorld(px,py){return [(px-W/2-view.tx)/view.s,(py-H/2-view.ty)/view.s];}
var dragNode=null,panning=false,lastX=0,lastY=0,moved=0;
function hit(px,py){
  var w=screenToWorld(px,py),best=null,bd=1e9;
  for(var k2=0;k2<NODES.length;k2++){
    var o=NODES[k2];if(o.hidden)continue;
    var d=Math.hypot(o.x-w[0],o.y-w[1]),rr=o.r+9/view.s;
    if(d<rr&&d<bd){bd=d;best=o;}
  }
  return best;
}
cv.addEventListener('pointerdown',function(e){
  cv.setPointerCapture(e.pointerId);
  var o=hit(e.clientX,e.clientY);
  moved=0;lastX=e.clientX;lastY=e.clientY;
  if(o&&e.button===0){dragNode=o;}else{panning=true;cv.classList.add('drag');}
});
cv.addEventListener('pointermove',function(e){
  if(dragNode){
    var w=screenToWorld(e.clientX,e.clientY);
    dragNode.x=w[0];dragNode.y=w[1];view.dirty=true;moved+=5;return;
  }
  if(!panning)return;
  var dx=e.clientX-lastX,dy=e.clientY-lastY;
  view.tx+=dx;view.ty+=dy;lastX=e.clientX;lastY=e.clientY;
  moved+=Math.abs(dx)+Math.abs(dy);view.dirty=true;
});
cv.addEventListener('pointerup',function(e){
  if(dragNode){if(moved<6)select(dragNode.i);dragNode=null;}
  else if(panning){panning=false;cv.classList.remove('drag');
    if(moved<6){var o=hit(e.clientX,e.clientY);if(o)select(o.i);}}
});
cv.addEventListener('pointercancel',function(){dragNode=null;panning=false;cv.classList.remove('drag');});
cv.addEventListener('wheel',function(e){e.preventDefault();
  zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*0.0015));},{passive:false});
function zoomAt(px,py,k){
  var ns=Math.min(9,Math.max(0.06,view.s*k)),f=ns/view.s;
  view.tx=(view.tx+px-W/2)*f-(px-W/2);
  view.ty=(view.ty+py-H/2)*f-(py-H/2);
  view.s=ns;view.dirty=true;updateStat();
}
var pinch=null;
cv.addEventListener('touchstart',function(e){
  if(e.touches.length===2){var a=e.touches[0],b=e.touches[1];
    pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2};}
},{passive:true});
cv.addEventListener('touchmove',function(e){
  if(e.touches.length===2&&pinch){var a=e.touches[0],b=e.touches[1];
    var d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    zoomAt(pinch.x,pinch.y,d/pinch.d);pinch.d=d;}
},{passive:true});
cv.addEventListener('touchend',function(){pinch=null;},{passive:true});

/* ---------- panel ---------- */
var panel=document.getElementById('panel'),pTitle=document.getElementById('pTitle'),pBody=document.getElementById('pBody');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function btn(target,sub){
  var o=NODES[idxOf[target]];if(!o)return '';
  var lab=o.t==='c'?(o.b+'권 '+o.n+'장 · '+o.label):(o.t==='h'?('주제 '+o.num+' · '+o.label):o.label);
  return '<button class="lnk" data-go="'+idxOf[target]+'">'+esc(lab)+(sub?'<small>'+esc(sub)+'</small>':'')+'</button>';
}
var selected=-1;
function select(k){
  selected=k;view.dirty=true;
  var o=NODES[k],h='';
  pTitle.textContent=o.t==='c'?(o.b+'권 '+o.n+'장 · '+o.title):o.title;
  if(o.t==='c'){
    h+='<div class="meta"><span class="tag b">'+o.b+'권 '+o.n+'장</span><span class="tag">'+esc(BOOKS[String(o.b)].name)+'</span></div>';
    h+='<div class="one">'+esc(o.one)+'</div>';
    h+='<div class="sec">핵심 요지</div><div class="core">'+o.core.split('\n\n').map(function(p){return '<p>'+esc(p)+'</p>';}).join('')+'</div>';
    h+='<div class="sec">절별 요약</div><ul>';
    o.secs.forEach(function(s){h+='<li><b>'+esc(s[0])+'절</b> — '+esc(s[1])+'</li>';});
    h+='</ul>';
    h+='<div class="sec">주요 성경 구절</div><ul>';
    o.vs.forEach(function(s){h+='<li><b>'+esc(s[0])+'</b> — '+esc(s[1])+'</li>';});
    h+='</ul>';
    h+='<div class="sec">연결된 주제</div>'+o.hubs.map(function(x){return btn(x,'주제 허브');}).join('');
    h+='<div class="sec">이어지는 장</div>'+o.rel.map(function(x){return btn(x[0],x[1]);}).join('');
    h+='<div class="sec">보관함 위치</div><div style="font-size:12px;color:#8aa0b8">'+esc('칼빈_기독교강요_보관함/'+(o.b===1?'01_1권_하나님지식':o.b===2?'02_2권_그리스도지식':o.b===3?'03_3권_은혜수여':'04_4권_외적수단'))+'</div>';
  }else if(o.t==='h'){
    h+='<div class="meta"><span class="tag t">주제 '+o.num+'</span><span class="tag">'+esc(o.short)+'</span></div>';
    h+='<div class="sec">칼빈의 핵심 교리</div><div class="core"><p>'+esc(o.core)+'</p></div>';
    h+='<div class="sec">핵심 논점</div><ul>';
    o.points.forEach(function(p){h+='<li>'+esc(p)+'</li>';});
    h+='</ul>';
    h+='<div class="sec">이 주제를 다루는 장·절</div>';
    var seen={}, order=[], grouped={};
    o.keyrefs.forEach(function(r){
      var kk=r[0].split('.');
      var key=parseInt(kk[0])+'-'+('0'+kk[1]).slice(-2);
      if(!grouped[key]){grouped[key]=[];order.push(key);}
      grouped[key].push(r[1]+' — '+r[2]);seen[key]=1;
    });
    order.forEach(function(key){h+=btn(key,grouped[key].join(' · '));});
    var others=[];
    NODES.forEach(function(x){if(x.t==='c'&&x.hubs.indexOf(o.id)>=0&&!seen[x.id])others.push(x);});
    if(others.length){
      h+='<div class="sec">그 밖에 이 주제가 다시 나오는 장</div>';
      others.forEach(function(x){h+=btn(x.id,x.one);});
    }
    if(o.links&&o.links.length){
      h+='<div class="sec">함께 읽을 주제</div>'+o.links.map(function(x){return btn(x,'주제 허브');}).join('');
    }
  }else if(o.t==='b'){
    h+='<div class="meta"><span class="tag b">'+o.b+'권</span><span class="tag">'+o.chapters.length+'장</span></div>';
    h+='<div class="sec">이 권의 장</div>'+o.chapters.map(function(x){return btn(x,'');}).join('');
  }else{
    h+='<div class="sec">이 지도에 대하여</div><div class="core"><p>'+esc(P.meta.desc)+'</p></div>';
    h+='<div class="sec">네 권</div>';
    [1,2,3,4].forEach(function(b){h+=btn('B'+b,BOOKS[String(b)].name);});
    h+='<div class="sec">주제 허브</div>'+NODES.filter(function(x){return x.t==='h';}).map(function(x){return btn(x.id,x.short);}).join('');
  }
  pBody.innerHTML=h;pBody.scrollTop=0;
  panel.classList.add('show');
  focusNode(o);
}
function focusNode(o){
  var pts=[o],nb=adj[o.i]||[];
  for(var k2=0;k2<nb.length;k2++){if(nb[k2][1]!==2&&nb[k2][1]!==4)pts.push(NODES[nb[k2][0]]);}
  var ax=1e9,ay=1e9,bx=-1e9,by=-1e9;
  for(var j=0;j<pts.length;j++){var m=pts[j];if(m.hidden)continue;
    if(m.x<ax)ax=m.x;if(m.x>bx)bx=m.x;if(m.y<ay)ay=m.y;if(m.y>by)by=m.y;}
  if(ax>bx){ax=o.x-80;bx=o.x+80;ay=o.y-80;by=o.y+80;}
  var mob=(W<=760), pad=headerPad();
  var panelW=(!mob&&panel.classList.contains('show'))?Math.min(460,W*0.42):0;
  var availW=W-panelW-30;
  var topY=mob?pad:pad;
  var availH=mob?(H*0.34-pad):(H-pad-30);
  var w=Math.max(220,bx-ax),hh=Math.max(220,by-ay);
  var s3=Math.min(availW/(w*1.55),Math.max(140,availH)/(hh*1.55));
  view.s=Math.max(0.24,Math.min(1.05,s3));
  var cxT=mob?(W/2):((W-panelW)/2);
  var cyT=mob?((topY+H*0.34)/2):(H/2+pad/6);
  view.tx=cxT-W/2-o.x*view.s;
  view.ty=cyT-H/2-o.y*view.s;
  view.dirty=true;updateStat();
}
pBody.addEventListener('click',function(e){
  var b=e.target.closest('[data-go]');
  if(b){select(+b.getAttribute('data-go'));}
});
document.getElementById('pClose').onclick=function(){panel.classList.remove('show');selected=-1;view.dirty=true;};

function headerPad(){var hd=document.querySelector('header');return hd?hd.getBoundingClientRect().height+8:0;}
function footerPad(){var f=document.getElementById('srcbar');return f?f.getBoundingClientRect().height+2:0;}
function fitAll(){
  var top=headerPad(), bot=footerPad()+16;
  var listOpen=!!(resultsEl&&resultsEl.classList.contains('show'));
  if(listOpen&&W<760)bot=Math.max(bot,H*0.40);
  var ax=1e9,ay=1e9,bx=-1e9,by=-1e9,any=false;
  for(var k2=0;k2<NODES.length;k2++){var o=NODES[k2];if(o.hidden)continue;
    var rr=(o.t==='b'?o.r*1.35:o.r)+(o.t==='c'?(qOn?120:18):(qOn?64:30));  /* 라벨까지 들어가도록 여유 */
    any=true;
    if(o.x-rr<ax)ax=o.x-rr;if(o.x+rr>bx)bx=o.x+rr;
    if(o.y-rr<ay)ay=o.y-rr;if(o.y+rr>by)by=o.y+rr;}
  if(!any){ax=-260;bx=260;ay=-260;by=260;}
  var w=Math.max(140,bx-ax),hh=Math.max(140,by-ay);
  var leftGap=(W>=760&&listOpen)?Math.min(460,W*0.36):0;
  var aw=Math.max(140,W-leftGap-30), ah=Math.max(140,H-top-bot);
  var s=Math.min(aw/w,ah/hh);
  s=Math.min(s,W<760?1.0:1.15);        /* 한두 노드만 남아도 2.5×처럼 튀지 않게 */
  s=Math.max(s,0.13);
  view.s=s;
  var cx=(ax+bx)/2, cy=(ay+by)/2, cyT=(top+(H-bot))/2;
  view.tx=-cx*s+leftGap/2;
  view.ty=cyT-H/2-cy*s;
  view.dirty=true;updateStat();
}
function resetAll(){
  visBook={1:true,2:true,3:true,4:true};visHub=true;
  endSearch(true);
  selected=-1;panel.classList.remove('show');
  syncChips();applyVis();fitAll();
}

/* ---------- chips / search ---------- */
var chipsEl=document.getElementById('chips');
var chipSync=[];
function syncChips(){chipSync.forEach(function(c){var on=c.get();c.el.classList.toggle('on',on);c.el.classList.toggle('off',!on);});}
[1,2,3,4].forEach(function(b){
  var el=document.createElement('button');el.className='chip on';
  el.innerHTML='<i style="background:'+BOOKS[String(b)].color+'"></i>'+b+'권';
  el.onclick=function(){
    if(qOn)endSearch(true);
    var was=visBook[b];visBook[b]=!was;
    syncChips();applyVis();
    if(!contentLeft()){visBook[b]=was;syncChips();applyVis();}  /* 전부 사라지는 건 막는다 */
  };
  chipSync.push({el:el,get:function(){return !!visBook[b];}});
  chipsEl.appendChild(el);
});
var chipHub=document.createElement('button');chipHub.className='chip on';
chipHub.innerHTML='<i style="background:'+HC+'"></i>주제 허브';
chipHub.onclick=function(){
  if(qOn)endSearch(true);
  var was=visHub;visHub=!was;
  syncChips();applyVis();
  if(!contentLeft()){visHub=was;syncChips();applyVis();}
};
chipSync.push({el:chipHub,get:function(){return !!visHub;}});
chipsEl.appendChild(chipHub);
document.getElementById('fit').onclick=function(){resetAll();};

function updateStat(){
  var nc=0,nh=0;
  NODES.forEach(function(o){if(o.hidden)return;if(o.t==='c')nc++;if(o.t==='h')nh++;});
  var txt='장 '+nc+' · 주제 '+nh+' · '+view.s.toFixed(2)+'×';
  if(qOn){var w2=(q.value||'').trim();txt=(w2?'“'+(w2.length>7?w2.slice(0,7)+'…':w2)+'” · ':'')+'장 '+nc+' · 주제 '+nh;}
  document.getElementById('stat').textContent=txt;
}

var q=document.getElementById('q'),resultsEl=document.getElementById('results'),hits=[],hitIdx=-1,tid=null;
/* 검색을 끄고 원래 전체 그래프로 되돌린다 */
function endSearch(clearInput){
  qOn=false;qHit={};qCtx={};
  resultsEl.classList.remove('show');hits=[];hitIdx=-1;
  if(clearInput&&q)q.value='';
}
/* 검색 결과를 그래프에 반영 — 걸린 장 + 그 장에 붙은 주제 허브 + 연결선 */
function graphFor(all){
  if(!all||!all.length){graphOff();return;}
  qOn=true;qHit={};qCtx={};
  all.forEach(function(o){qHit[o.i]=1;});
  all.forEach(function(o){
    if(o.t!=='c'||!o.hubs)return;
    o.hubs.forEach(function(id){var h=NODES[idxOf[id]];if(h&&!qHit[h.i])qCtx[h.i]=1;});
  });
  applyVis();fitAll();
}
function graphOff(){qOn=false;qHit={};qCtx={};applyVis();fitAll();}
function search(term){
  term=term.trim().toLowerCase();
  if(!term){endSearch(false);graphOff();resultsEl.classList.remove('show');return;}
  var terms=term.split(/\s+/),out=[];
  NODES.forEach(function(o){
    if(o.t==='c'){
      var hay=(o.title+' '+o.one+' '+o.core+' '+o.secs.map(function(s){return s[1];}).join(' ')+' '+
        o.vs.map(function(s){return s[0]+' '+s[1];}).join(' ')+' '+o.id+' '+o.b+'권 '+o.n+'장').toLowerCase();
      var ok=true;for(var j=0;j<terms.length;j++){if(hay.indexOf(terms[j])<0){ok=false;break;}}
      if(ok){
        var sc=0;
        if(o.title.toLowerCase().indexOf(terms[0])>=0)sc+=100;
        if(o.one.toLowerCase().indexOf(terms[0])>=0)sc+=30;
        if(o.core.toLowerCase().indexOf(terms[0])>=0)sc+=10;
        out.push([sc,o]);
      }
    }else if(o.t==='h'){
      var hay2=(o.title+' '+o.short+' '+o.core+' '+o.points.join(' ')).toLowerCase();
      var ok2=true;for(var j2=0;j2<terms.length;j2++){if(hay2.indexOf(terms[j2])<0){ok2=false;break;}}
      if(ok2)out.push([60,o]);
    }
  });
  out.sort(function(a,b){return b[0]-a[0];});
  var all=out.map(function(x){return x[1];});
  hits=all.slice(0,40);hitIdx=-1;
  if(!hits.length){resultsEl.innerHTML='<div class="r"><b>찾는 장이나 주제가 없습니다</b><span>다른 낱말로 찾아보세요. 예: 칭의, 원죄, 성찬</span></div>';}
  else{
    resultsEl.innerHTML=hits.map(function(o,k){
      var sub=o.t==='c'?(o.b+'권 '+o.n+'장 · '+o.one):('주제 '+o.num+' · '+o.short);
      return '<div class="r" data-i="'+k+'"><b>'+esc(o.label)+'</b><span>'+esc(sub)+'</span></div>';
    }).join('');
  }
  resultsEl.classList.add('show');
  if(W>=760)resultsEl.style.top=(headerPad()+2)+'px';
  graphFor(all);
}
q.addEventListener('input',function(){clearTimeout(tid);tid=setTimeout(function(){search(q.value);},140);});
q.addEventListener('keydown',function(e){
  if(e.key==='Enter'){
    if(hits.length){select(hits[Math.max(0,hitIdx)].i);resultsEl.classList.remove('show');}
  }else if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();hitIdx+=(e.key==='ArrowDown'?1:-1);
    hitIdx=Math.max(0,Math.min(hits.length-1,hitIdx));
    var rs=resultsEl.querySelectorAll('.r');
    for(var j=0;j<rs.length;j++)rs[j].classList.toggle('act',j===hitIdx);
  }else if(e.key==='Escape'){q.value='';search('');}
});
resultsEl.addEventListener('click',function(e){
  var r=e.target.closest('.r');if(!r)return;
  var o=hits[+r.getAttribute('data-i')];
  if(o){select(o.i);resultsEl.classList.remove('show');}
});
document.addEventListener('pointerdown',function(e){
  if(!resultsEl.contains(e.target)&&e.target!==q)resultsEl.classList.remove('show');
});
window.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&panel.classList.contains('show')){panel.classList.remove('show');selected=-1;view.dirty=true;}
});

/* ---------- start ---------- */
var raf=null;
function loop(){if(view.dirty){try{draw();}catch(err){if(window.console)console.error(err);}}raf=requestAnimationFrame(loop);}
function start(){
  resize();
  NODES.forEach(function(o,k){o.i=k;});
  visBook={1:true,2:true,3:true,4:true};visHub=true;qOn=false;qHit={};qCtx={};
  syncChips();applyVis();
  if(W<760){NODES.forEach(function(o){o.y*=1.55;});}
  if(!contentLeft()){visBook={1:true,2:true,3:true,4:true};visHub=true;syncChips();applyVis();}
  fitAll();
  draw();
  requestAnimationFrame(loop);
  var load=document.getElementById('load');
  load.style.opacity='0';
  setTimeout(function(){load.style.display='none';},420);
}
var rzT=null;
window.addEventListener('resize',function(){resize();clearTimeout(rzT);rzT=setTimeout(function(){fitAll();},80);});
start();
})();
</script>
</body>
