*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;

.box{width:100%;max-width:560px;background:var(--paper);border:1px solid var(--line);border-radius:18px;

.go{margin-top:24px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  width:100%;min-height:56px;background:var(--accent);color:#fff;font-weight:800;font-size:1.02em;
  border-radius:12px;letter-spacing:.01em;text-decoration:none;box-shadow:0 6px 16px rgba(140,36,52,.26)}
.go:hover,.go:focus{background:var(--accent2)}
.go:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
.foot{margin:26px 0 0;font-size:.8em;line-height:1.9;color:var(--muted)}
.foot b{color:var(--navy2)}
@media (max-width:420px){.box{padding:30px 20px 26px}h1{font-size:1.32em}}

<script>location.replace('./공유/');</script>
